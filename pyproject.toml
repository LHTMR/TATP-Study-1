[tool.ruff]
line-length = 96
target-version = "py311"
# docs/calibration_sim.py is the record of the simulation behind
# docs/calibration_methods_comparison.md, kept exactly as it was run. Reformatting it would
# make the numbers in that document harder, not easier, to trace back to the code.
extend-exclude = ["docs/calibration_sim.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
# QT_QPA_PLATFORM is NOT set here. `env = [...]` needs the pytest-env plugin, and without it
# the key is silently ignored -- the tests would quietly stop being headless, which is the
# failure SPEC.md 17.1 exists to prevent. tests/conftest.py sets it instead, before Qt is
# imported, which needs no plugin and works however pytest is invoked.