# Every screen state the software can show, with what the image should contain.
# SPEC.md 17.4. Generated by `make shots ARGS=--write-manifest`; the descriptions
# come from the catalogue in tatp/screenshots.py, so edit them there, not here.
#
# An entry with no image is a failure, and an image with no entry is a failure. What
# is compared against screenshots/reference/ is only what has been approved.

screens:
  experimenter_en_disconnected: The garment reported disconnected. (en)
  experimenter_en_open_items: Unresolved open items listed for the experimenter (SPEC.md
    20). (en)
  experimenter_en_placeholder_banner: The unapproved-wording banner (SPEC.md 12.4),
    red and unmissable. (en)
  experimenter_en_plain: No banners, no open items -- what a correctly configured
    session shows. (en)
  experimenter_en_reduced_capability_banner: The reduced-capability banner naming
    the driver in use (SPEC.md 12.4). (en)
  experimenter_sv_disconnected: The garment reported disconnected. (sv)
  experimenter_sv_open_items: Unresolved open items listed for the experimenter (SPEC.md
    20). (sv)
  experimenter_sv_placeholder_banner: The unapproved-wording banner (SPEC.md 12.4),
    red and unmissable. (sv)
  experimenter_sv_plain: No banners, no open items -- what a correctly configured
    session shows. (sv)
  experimenter_sv_reduced_capability_banner: The reduced-capability banner naming
    the driver in use (SPEC.md 12.4). (sv)
  participant_en_adjust_just_noticeable: 'The adjustment screen for `just_noticeable`:
    the target, both large buttons drawn with their labels, and the confirm sentence,
    en.'
  participant_en_adjust_just_uncomfortable: 'The adjustment screen for `just_uncomfortable`:
    the target, both large buttons drawn with their labels, and the confirm sentence,
    en.'
  participant_en_adjust_match: 'The adjustment screen for `match`: the target, both
    large buttons drawn with their labels, and the confirm sentence, en.'
  participant_en_adjust_most_pleasant: 'The adjustment screen for `most_pleasant`:
    the target, both large buttons drawn with their labels, and the confirm sentence,
    en.'
  participant_en_blank: Nothing at all -- what the participant sees during a stimulus.
  participant_en_choice_comparison_accepting: 'Both stimuli delivered, no emphasis,
    the next press is the answer. Identical to the waiting state by design: nothing
    on screen may hint that a press is due.'
  participant_en_choice_comparison_chosen_right: The right button shown back as chosen
    -- filled, its symbol reversed out. Set directly rather than by pressing, because
    the press starts a timer that would blank the screen before it could be grabbed.
  participant_en_choice_comparison_emphasis_left: The left button's outline thickened
    while its stimulus plays (UI_PRINCIPLES.md 5.11). It must read as `this is the
    one you are feeling`, never as a suggestion.
  participant_en_choice_comparison_waiting: '`choices.comparison` with both buttons
    drawn and neither emphasised -- the state before the first stimulus, en.'
  participant_en_cue: 'The visual warning cue: one filled disc, centred, no wording.'
  participant_en_preference: 'The preference selection (SPEC.md 9 step 6): the opening
    line, both large buttons drawn with their labels, and the confirm sentence, en.'
  participant_en_screen_emergency_stop: The participant text `screens.emergency_stop`,
    centred, en.
  participant_en_screen_paused: The participant text `screens.paused`, centred, en.
  participant_en_screen_self_start: The participant text `screens.self_start`, centred,
    en.
  participant_en_screen_session_end: The participant text `screens.session_end`, centred,
    en.
  participant_en_screen_standby: The participant text `screens.standby`, centred,
    en.
  participant_en_screen_welcome: The participant text `screens.welcome`, centred,
    en.
  participant_en_vas_alertness_uncued: The `alertness` scale with its question and
    anchors and NO marker -- the state before the first press, en.
  participant_en_vas_intensity_uncued: The `intensity` scale with its question and
    anchors and NO marker -- the state before the first press, en.
  participant_en_vas_pain_at_50pct: The marker at 50 % along the line, no numbers
    and no tick marks beyond the labelled anchors.
  participant_en_vas_pain_at_5pct: The marker at 5 % along the line, no numbers and
    no tick marks beyond the labelled anchors.
  participant_en_vas_pain_at_95pct: The marker at 95 % along the line, no numbers
    and no tick marks beyond the labelled anchors.
  participant_en_vas_pain_first_press_left: The marker where a first left press puts
    it -- SPEC.md 10.2's rule that the marker appears on the side that was pressed.
