# Every screen state the software can show, with what the image should contain.
# SPEC.md 17.4. Generated by `make shots ARGS=--write-manifest`; the descriptions
# come from the catalogue in tatp/screenshots.py, so edit them there, not here.
#
# An entry with no image is a failure, and an image with no entry is a failure. What
# is compared against screenshots/reference/ is only what has been approved.

screens:
  experimenter_en_abort_dialog: 'The abort confirmation: what happens to the data,
    a reason field, and Abort disabled until a reason is typed. (en)'
  experimenter_en_all_banners: 'All three banners at once, one line each with the
    detail in the tooltip, in the space they need, which is fixed from the session''s
    start: no banner comes or goes during a session, so nothing below moves (UI_PRINCIPLES.md
    3.3). The fit-preview banner is amber like the reduced-capability one (SPEC.md
    11.1). (en)'
  experimenter_en_awaiting_rebalance: 'The evenness question answered ''uneven'':
    Rebalance offered beside Next step, because the procedure waits on either. (en)'
  experimenter_en_block_due: 'The block is due: amber and bold in the same place as
    the countdown. (en)'
  experimenter_en_block_overdue: 'The block is overdue: red and bold, OVERDUE in capitals.
    (en)'
  experimenter_en_block_pinprick: 'A pinprick block in the intervention: the countdown
    to the next block in grey, no pressures (hidden for blinding, SPEC.md 16) and
    no placeholder in their place. (en)'
  experimenter_en_block_touch: 'A touch block in the intervention: the one line shown
    at every touch start in every condition, and nothing else that could differ between
    them. (en)'
  experimenter_en_brush_secondary: 'A brush stroke in the secondary zone: the dashed
    ellipse outlined. (en)'
  experimenter_en_countdown: 'Waiting for the next block: ''Next: block 3 (touch)
    in 04:05'', grey, and nothing to do meanwhile. (en)'
  experimenter_en_demo_banner: The demonstration banner (docs/LOG.md N7.D23), amber
    like the others that say the session runs but what it records is not data. (en)
  experimenter_en_demo_controls: 'The Demo controls window beside a demonstration
    (docs/LOG.md N7.D23, N7.F12f): what the garment is commanded to do, steady --
    every channel''s pressure set, channels 2, 3 on -- then who presses for the participant
    and the experimenter, changeable at any time, Skip the wait, and Finish this stage
    (en).'
  experimenter_en_demo_controls_garment_changed: 'The Demo controls'' garment display
    0.2 s after channel 4 was turned on (docs/LOG.md N7.F12f): its row lit and its
    bar outlined, fading back over demo.garment_highlight_s (en).'
  experimenter_en_demo_controls_worn_link_lost: 'The Demo controls on a worn garment,
    its link lost (docs/LOG.md N7.F12f): the participant and the experimenter people
    and Finish this stage off, said in amber; the channels held at their last command
    in amber, not shown switching off, with the warning that the outputs may still
    hold it (N7.U16) (en).'
  experimenter_en_designer_grid: 'An example pattern opened on the Grid tab, at the
    lab laptop''s size: the pattern''s fields in two strips across the top; the grid
    across the whole width, one compact row per row interval with its time, one column
    per channel, on cells filled and no digits. The timeline below draws two cycles
    because it loops, the repeat fainter; the line under it says it loads, beside
    the garment chosen for Play. (en)'
  experimenter_en_designer_new: 'A new pattern: nothing filled in and nothing assumed.
    The line in red says why it does not load yet, and Save, Export and Play are disabled.
    (en)'
  experimenter_en_designer_off_grid: A timing off the row grid, refused in red with
    the reason and never rounded. The grid converted before it is kept, unchanged,
    and still previewed. (en)
  experimenter_en_designer_ordered: 'Ordered channels: five channels with their hold
    times; all three modes listed, each with what it does, join-and-hold chosen; the
    delay beside Convert, converted. The message says the grid was replaced, and the
    timeline shows the overlapping sweep. (en)'
  experimenter_en_designer_playing: 'Playback on the prototype sleeve, chosen beside
    Play: the cursor in amber on the timeline and the channels on now named, their
    labels amber. Set directly rather than played, because a running pattern would
    never be photographed at the same moment twice, and the sleeve is never woken
    for a picture. (en)'
  experimenter_en_designer_timed: 'Timed channels: onset and offset per channel in
    ms, converted. Played once, so the timeline draws one cycle. (en)'
  experimenter_en_disconnected: 'The garment reported disconnected: red and bold in
    the hardware panel, and its button reading Connect garment, emphasised as the
    way forward. (en)'
  experimenter_en_distances_dialog: 'The mapping distances window (SPEC.md 8.4): the
    latest mapped phase selected, one field per path in path order, two typed with
    either decimal mark. Non-modal: the session runs on behind it. (en)'
  experimenter_en_error_dialog: 'The error dialog: a red title and the message as
    raised. (en)'
  experimenter_en_first_pain_measures: 'Before the session''s first pain measure:
    what to tell the participant, set down the type scale to fit its region. (en)'
  experimenter_en_fit_garment: 'The first step of a session: the garment, the remote''s
    buttons by their printed symbols, the headphones and the cue, then Next step.
    (en)'
  experimenter_en_fit_preview_f40: 'The main window while the F40 fit preview (SPEC.md
    11.1) is open, only with fit_preview.enabled: the banner saying what it costs,
    the instruction saying the decision is due, Re-run and Accept offered, and no
    rating anywhere on this window -- they are in the preview window. (en)'
  experimenter_en_fit_preview_f40_window: 'The fit preview window itself for `fit_preview_f40`:
    the plot, the quality, what the session will use, and Accept / Re-run (en).'
  experimenter_en_fit_preview_touch: 'The main window while the touch-calibration
    fit preview is open: its instruction at a smaller size because it is long, Accept
    and Re-run offered. (en)'
  experimenter_en_fit_preview_touch_window: 'The fit preview window itself for `fit_preview_touch`:
    the plot, the quality, what the session will use, and Accept / Re-run (en).'
  experimenter_en_hardware_pressures: 'Touch calibration: the hardware panel with
    every channel''s pressure and one fault, in red. (en)'
  experimenter_en_interrupted_emergency_stop: 'The participant pressed the stop: the
    red line under the phase, the step on hold dimmed beneath it, Resume emphasised
    in its own slot and Abort the only controls offered, Next step greyed, and nothing
    moved. (en)'
  experimenter_en_interrupted_pause: 'The experimenter''s pause: the same line in
    amber, the step dimmed, Resume offered. (en)'
  experimenter_en_intervention_end: 'The intervention over and the garment off: what
    to tell the participant before the measures begin again, then Next step (docs/LOG.md
    N7.F11c10). The same in every condition. (en)'
  experimenter_en_intervention_fault: 'A garment fault during the intervention: shown
    in red, counted, and without the channel, which could say which pattern is running
    (SPEC.md 16). (en)'
  experimenter_en_intervention_recalibrate: 'The intervention, waiting for the next
    block with the condition''s touch on: Rebalance channels… and Restart calibration…
    offered at any time, as during touch calibration (S, 15 Oct 2026; docs/LOG.md
    N7.F12a1). The same in every condition, and no pressures (SPEC.md 16). (en)'
  experimenter_en_launcher: The launcher's four entries (SPEC.md 4.1), all enabled.
    Design a pattern says it is for S only, because it shows pattern names and shapes
    (en).
  experimenter_en_launcher_demo: 'Run a demo (docs/LOG.md N7.D23): the session dialog
    with the demonstration''s own participant code shown and not editable, no data
    folder or REDCap form, the mock garment (changeable: another runs at real time
    only, with people pressing, N7.F12f) and the example patterns chosen, and the
    speed and who presses for the participant and the experimenter (en).'
  experimenter_en_launcher_hardware_check: 'The hardware check (LOG N7.F4), at the
    lab laptop''s size, as it opens: a count for each remote button, where each screen
    lands, the sound devices, the noise within the participant''s own range with the
    cue and the alert, and each garment channel on and off. Drawn with a sample device
    list and the mock garment (en).'
  experimenter_en_launcher_hardware_check_channel_on: 'The hardware check with the
    mock garment connected and channel 2 on: each channel button says on or off, and
    one that is on is filled (LOG N7.F10b; en).'
  experimenter_en_launcher_instruments: 'Instruments and environment (SPEC.md 8.1),
    at the lab laptop''s size: all twenty filaments in view at once, in two halves,
    each with its label, size and nominal force, a field for the weighing in grams
    and the force in mN it will save; the weighing date and Save on one line; the
    optional room temperature and humidity on another. No balance field (en).'
  experimenter_en_launcher_preview: 'The schedule preview (SPEC.md 7.2): tools/preview_schedule.py''s
    report, read-only (en).'
  experimenter_en_launcher_resume: 'The resume question (SPEC.md 15): what was completed
    and how long ago sensitisation began. Resume, or an explicit new session; closing
    it starts nothing (en).'
  experimenter_en_launcher_session: 'The session dialog as it opens: the data folder
    filled in from config; the session number, both languages and the pattern folder
    unchosen, with no default; Start disabled until a check passes (en).'
  experimenter_en_launcher_session_checked: 'The session dialog after Check: a preflight
    warning listed in amber, Start enabled because nothing refuses (en).'
  experimenter_en_link_lost: 'The prototype sleeve''s link lost mid-session (docs/LOG.md
    N7.U16): shown disconnected, the warning that it may still be on first in the
    fault line, then the newest fault''s start; the earlier-fault count gives way
    to them. (en)'
  experimenter_en_long_instruction: 'The longest instruction the session gives, set
    down the type scale so it fits its region: nothing below it has moved, and the
    controls are where they always are. It asks for Accept, so Accept and Re-run are
    offered, as the procedure offers them. (en)'
  experimenter_en_mapping: 'A mapping path: the secondary zone outlined without a
    site, the technique text shown because a filament is used, and Mapping distances
    offered now that a phase has been mapped. (en)'
  experimenter_en_open_items: 'Unresolved open items listed for the experimenter (SPEC.md
    20): one small amber line at the foot of the banner region, by number, the summaries
    in the tooltip. (en)'
  experimenter_en_pilot_rig_pinprick: 'What the 15 Oct 2026 pilot looked like: the
    prototype sleeve''s reduced-capability banner and the open items above a filament
    trial. (en)'
  experimenter_en_pinprick_primary: 'A pinprick application: the filament by its gram
    label, the primary zone outlined on the diagram with its site beside it, the technique
    text below, and the response pending -- never its value. The filament-applied-instead
    entry is offered, as it is only during a filament trial. (en)'
  experimenter_en_placeholder_banner: The unapproved-wording banner (SPEC.md 12.4),
    red and unmissable. (en)
  experimenter_en_plain: No banners, no open items, nothing scheduled -- a correctly
    configured session at setup. The routine controls along the bottom, Next step
    emphasised; the situational ones (Resume, Discard, Rebalance, the fit choice,
    the filament entry, Mapping distances) hidden in places kept for them; no zone
    diagram, since there is no target; the garment connected, its button quiet at
    the foot of the side column. (en)
  experimenter_en_recalibrate_rebalance_dialog: 'Rebalance channels…: what it does,
    wherever it is offered, and why, from a fixed list; Rebalance channels disabled
    until a reason is chosen (docs/LOG.md N7.F12a1). (en)'
  experimenter_en_recalibrate_restart_dialog: Restart calibration…, with a reason
    chosen, shown pressed, so Restart calibration is enabled (docs/LOG.md N7.F12a1).
    (en)
  experimenter_en_reduced_capability_banner: The reduced-capability banner naming
    the garment in use in words, as the launcher does (SPEC.md 12.4). (en)
  experimenter_en_rekindle_due: 'The rekindle is due: a timed event that is not a
    block, named by its phase, and the thermode to place. (en)'
  experimenter_en_rerun_dialog: The re-run reason, asked before a fit is discarded
    (SPEC.md 11.1). (en)
  experimenter_en_session_complete: 'The last state: the session closed and every
    file written, the garment to come off, and Next step to close the program (docs/LOG.md
    N7.F11c9). The garment is shown disconnected, as closing the session leaves it,
    and Pause and the garment button are withdrawn: nothing is left to pause or to
    connect again. (en)'
  experimenter_en_status_warning: A warning in the status region, in amber, kept apart
    from the routine status so the next 'Waiting for...' does not replace it (15 Oct
    2026 pilot review). It goes under the routine line; this one is too long for both,
    so it has the region. (en)
  experimenter_en_touchcal_estimation_skip: 'The estimation run with the mock or prototype
    garment: how many ratings are answered, and Skip calibration under the garment,
    shown only on a pilot rig once a few ratings are in (docs/LOG.md N7.F8b, N7.F8c).
    Nothing else has moved. (en)'
  experimenter_en_touchcal_stopped_recalibrate: 'The participant pressed the stop
    during touch calibration''s step 4, with step 2''s fit accepted: beside Resume,
    Rebalance channels… and Restart calibration… are offered, each in the place of
    its kin in the situational row, and each asks why (docs/LOG.md N7.F12a1). The
    same in every condition; nothing else moved. (en)'
  experimenter_en_touchcal_stopped_recalibration_used: 'A stop during touch calibration
    once the re-calibrations a limit allows (recalibrations_max, none by default)
    are used: Resume only, and one grey line where the two offers were saying why.
    (en)'
