<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 404" width="320" height="404">
  <title>Placeholder: primary and secondary hyperalgesia zones, dorsum of the hand</title>

  <!-- Drawn for the dark experimenter screen (UI_PRINCIPLES.md 3.5): light lines on nothing,
       so the diagram is never the brightest thing in the room. tatp/ui/widgets.py highlights
       the ids below for the current stimulus; a replacement figure must keep them:

       - `primary` and `secondary`, the two zones;
       - `primary_site_1` .. `primary_site_8` and `secondary_site_1` .. `secondary_site_8`,
         where each numbered stimulation site is (study1.yaml pinprick.n_sites, brush.n_sites).
         Their placement here is a placeholder, evenly spread, like the rest of the figure
         (open item 11).

       - `view`, the part of the figure the window shows: the back of the hand round the zones,
         so the zones and their sites are drawn as large as the window's room allows.

       The figure is the RIGHT hand's dorsum, fingers up, so the thumb is on the left; the
       experimenter window mirrors it for a left hand. It carries no text, so that a mirrored
       drawing never shows mirrored writing: the labels are drawn by the window. -->
  <style>
    .outline { fill: none;    stroke: #9a9a9a; stroke-width: 3; stroke-linejoin: round; }
    .sh      { fill: none;    stroke: #9a9a9a; stroke-width: 2.5; stroke-dasharray: 7 5; }
    .ph      { fill: #3a3a3a; stroke: #9a9a9a; stroke-width: 2.5; }
    .site    { fill: none;    stroke: #6a6a6a; stroke-width: 1.5; }
    .view    { fill: none;    stroke: none; }
  </style>

  <rect id="view" class="view" x="40" y="140" width="200" height="200" />

  <!-- Dorsum of the right hand, schematic. Fingers point up, thumb to the left. -->
  <path class="outline" d="
    M 96,372
    C 92,330 88,300 86,272
    C 70,258 58,240 54,220
    C 50,200 52,178 62,170
    C 72,163 82,170 88,182
    L 98,202
    C 96,176 94,140 94,116
    C 94,104 100,98 108,98
    C 116,98 122,104 122,116
    L 126,196
    L 130,96
    C 130,84 136,78 144,78
    C 152,78 158,84 158,96
    L 160,196
    L 166,104
    C 166,92 172,86 180,86
    C 188,86 194,92 194,104
    L 192,198
    L 200,128
    C 201,116 207,110 215,111
    C 223,112 228,119 227,131
    L 222,214
    C 220,246 214,300 210,372
    Z" />

  <!-- Secondary hyperalgesia: the surrounding zone, mapped along four paths -->
  <ellipse id="secondary" class="sh" cx="154" cy="250" rx="62" ry="52" />

  <!-- Primary hyperalgesia: the thermode / capsaicin site itself -->
  <rect id="primary" class="ph" x="124" y="228" width="56" height="48" rx="3" />

  <!-- The secondary zone's sites, round it between the two zones, 1 distal and on clockwise -->
  <circle id="secondary_site_1" class="site" cx="154" cy="210" r="5" />
  <circle id="secondary_site_2" class="site" cx="188" cy="222" r="5" />
  <circle id="secondary_site_3" class="site" cx="202" cy="250" r="5" />
  <circle id="secondary_site_4" class="site" cx="188" cy="278" r="5" />
  <circle id="secondary_site_5" class="site" cx="154" cy="290" r="5" />
  <circle id="secondary_site_6" class="site" cx="120" cy="278" r="5" />
  <circle id="secondary_site_7" class="site" cx="106" cy="250" r="5" />
  <circle id="secondary_site_8" class="site" cx="120" cy="222" r="5" />

  <!-- The primary zone's sites, two rows of four inside it -->
  <circle id="primary_site_1" class="site" cx="132" cy="238" r="4" />
  <circle id="primary_site_2" class="site" cx="145" cy="238" r="4" />
  <circle id="primary_site_3" class="site" cx="158" cy="238" r="4" />
  <circle id="primary_site_4" class="site" cx="171" cy="238" r="4" />
  <circle id="primary_site_5" class="site" cx="132" cy="266" r="4" />
  <circle id="primary_site_6" class="site" cx="145" cy="266" r="4" />
  <circle id="primary_site_7" class="site" cx="158" cy="266" r="4" />
  <circle id="primary_site_8" class="site" cx="171" cy="266" r="4" />
</svg>
