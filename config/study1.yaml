# Design parameters for TATP Study 1.
# Timings, forces, thresholds and rates live here, never in .py (SPEC.md 4.2).
# Every user-facing string lives in config/text/ (SPEC.md 10.4).

design:
  n_participants: 41                 # SPEC.md 20 item 10
  n_sessions: 3
  conditions: [participant_preferred, ct_targeted, sham]
  limbs: [left, right]               # target limb alternates between visits (SPEC.md 2)
  allocation_file: config/allocation.csv

fit_preview:
  # SPEC.md 11.1. Shows the experimenter the fitted curve, its quality and the derived values
  # at the end of the F40 estimation and the touch-calibration estimation run, with an option
  # to re-run. OFF BY DEFAULT and intended for piloting.
  #
  # Turning it on shows the experimenter the participant's ratings. That breaks Bilaga 1 3.3,
  # contradicts Bilaga 3a ("Försöksledaren ser inte dina skattningar") and makes the welcome
  # screen's own sentence untrue -- see SPEC.md 11.1 before enabling it for real sessions.
  # Blinding to condition is unaffected; the estimation runs do not differ between conditions.
  enabled: false
  procedures: [f40, touch_calibration]  # which adaptive procedures offer the preview
  max_reruns: 2                      # bounds the forking path; a discarded run is retained
                                     # with superseded: true, never overwritten

vas:
  # SPEC.md 10.2. The marker is hidden until the first press, then appears on the side that
  # was pressed, so the starting position cannot bias the response.
  start_pct_after_left_press: 25.0
  start_pct_after_right_press: 75.0
  move_step_pct: 0.5                 # one tap
  hold_repeat_delay_s: 0.30          # before hold-to-repeat engages
  hold_repeat_interval_s: 0.04
  no_response_warning_s: 60.0        # log a warning; never auto-advance (SPEC.md 8.3)

choice:
  # Two-alternative screens where the press IS the answer (SPEC.md 10.8, UI_PRINCIPLES.md
  # 1.10, 5.12). Both are perceptual requirements rather than derived quantities -- long enough
  # to be seen, short enough not to feel like a lag -- so they are tuned by looking at the
  # screen during piloting, not calculated.
  feedback_s: 0.5                    # the chosen button held visibly chosen after the press
  gap_s: 0.5                         # blank between one trial and the next, so a participant
                                     # can tell two presentations apart without counting

pinprick:
  target_vas_pct: 40.0               # F40 is the quantity estimated
  slope_prior_vas_per_log10: 51.6    # SPEC.md 8.2 and 20 item 6: a simulated starting value,
                                     # to be replaced by a pooled estimate from pilot data.
                                     # Pooled, never per participant.
  measure_repetitions: 3             # 3 reps x 3 adjacent filaments (comparison doc 6)
  measure_n_levels: 3                # crossing filament and the two immediately below it
  max_applications: 25               # hard cap; take the best estimate and flag (SPEC.md 8.2)
  start_filament_label_g_session1_pre_s: "26"  # informed-prior start (comparison doc 5.2c).
                                     # Filaments are named by their gram label everywhere
                                     # (SPEC.md 8.1); 26 g is the 5.46, 255 mN.
  intolerable_vas_pct: 100.0         # top of the pain scale is the proxy for intolerable
                                     # (SPEC.md 8.2). There is no separate control: the
                                     # software raises the flag and enforces the cap.
  intolerable_sites_for_global_cap: 4   # once this many distinct sites are capped within one
                                     # time point, the cap applies to every site, at the lowest
                                     # force that reached the ceiling in that run (SPEC.md 8.2)
  expected_offset_steps_pre_to_post_s: -2.7    # Scheuren et al.; SPEC.md 20 item 7
  isi_min_s: 13.0                    # Scheuren et al. 2023
  isi_max_s: 17.0
  rating_cue_delay_s: 9.0            # rating cued 9 s after the stimulus (comparison doc 8)
  short_protocol_n_trials: 5         # median of five ratings (SPEC.md 8.3)
  n_sites: 8                         # site rotates on every application (SPEC.md 8.2)
  ordinal_rho_min: 0.3               # consistency check only; never gates eligibility, and
                                     # R^2 is deliberately not used (comparison doc 6.7)

brush:
  n_trials: 5                        # same structure as the short protocol (SPEC.md 8.3)
  n_sites: 8

mapping:
  # Secondary-hyperalgesia area, four linear paths inward (SPEC.md 8.4, Bilaga 1 3.6.2).
  n_paths: 4
  step_size_mm: 5.0
  step_interval_s: 1.0               # the 1 Hz pacing cue; the experimenter advances on each
  max_steps: 40                      # bounds the cue train; 40 x 5 mm = 200 mm. The software
                                     # does not count steps -- the border is a pen mark and a
                                     # ruler, not a keypress (SPEC.md 8.4).
  distance_plausible_min_mm: 1.0     # outside this range the entry is queried, not accepted
  distance_plausible_max_mm: 200.0   # silently (SPEC.md 17.5 adversarial experimenter)

touch_calibration:
  # Protocol B, scheme B of the comparison document (SPEC.md 9, comparison doc 7).
  reference_channel: 3               # middle channel; minimises max distance along the arm
  anchors_pct: [10.0, 90.0]          # the two LABELLED points on the intensity scale, "just
                                     # noticeable" and "just uncomfortable". A participant is
                                     # asked for a sensation the scale names, never for a
                                     # position on a line. These adjustments set the sampling
                                     # bracket for the estimation run (SPEC.md 9 step 1).
  anchor_prompt_keys: [just_noticeable, just_uncomfortable]
                                     # what the participant is asked for at each of anchors_pct,
                                     # in the same order: the `adjust_targets` keys in
                                     # config/text/participant_*.yaml. The pairing is here and
                                     # not in code because the wording is ethics-bound and the
                                     # anchors are tunable (SPEC.md 10.4).
  estimation_n_amplitudes: 10        # amplitudes spanning the bracket, RANDOMISED order -- an
                                     # ascending series builds in the sequence effect the fit
                                     # exists to average out (SPEC.md 9 step 2)
  estimation_fit: log_pressure       # rating ~ a + b*log(pressure), fitted rating-on-pressure
                                     # and inverted. Pressure is controlled, rating is noisy.
                                     # Alternative `linear_pressure` only holds if the bracket
                                     # is tight enough that curvature does not bite.
  derived_pct: [20.0, 30.0, 80.0]    # read off the fit, never adjusted to: the sham target and
                                     # both ends of the pleasantness window. Flag any that
                                     # falls outside the sampled amplitudes as extrapolated.
  adjustments_per_anchor: 1          # the adjustments only set the bracket now, so the
                                     # two-per-anchor hysteresis guard does less than it did.
                                     # Reverting to 2 costs two trials (SPEC.md 9 step 1).
  start_directions: [below, above]
  start_offset_fraction: 0.6         # how far below/above the expected point an adjustment
                                     # starts, as a fraction of the adjustable range
  adjustment_timeout_s: 120.0        # method of adjustment has no stopping rule of its own
  min_exploration_kpa: 20.0          # minimum total travel before confirm is accepted
  comparison_hold_s: 3.0             # clears the inflation transient (comparison doc 7.4)
  comparison_gap_s: 1.0              # between the two stimuli of a pair
  catch_trial_fraction: 0.2          # zero-pressure catch trials (SPEC.md 9)
  catch_felt_warn_fraction: 0.2      # flag if more than this share are reported felt
  pleasantness_range_anchors: [30.0, 80.0]   # which of derived_pct bound the pleasantness
                                     # adjustment: the FITTED P30 and P80, not the adjusted
                                     # values (SPEC.md 9 step 5)
  pleasantness_adjustments: 2
  sham_target_intensity_pct: 20.0    # low-intensity static sham touch, not absence of touch
  evenness_check: true               # end-of-calibration "does it feel even?" with a
                                     # rebalance path (SPEC.md 9, comparison doc 7.4)
  # ---- Added for Milestone 4. [R] marks a value a docs/research report recommended. ----
  estimation_settle_s: 3.0           # [R] R32. Stimulus on this long before the intensity VAS
                                     # appears, and it stays on until confirm: the question is
                                     # in the present tense. The comparison hold's 3 s.
  estimation_iti_min_s: 8.0          # [R] R32. Stimulus off to the next cue, jittered uniformly
  estimation_iti_max_s: 12.0         # between these, drawn from the session RNG
  catch_felt_min_pct: 10.0           # [R] R32. A catch trial counts as felt when rated at or
                                     # above the scale's own "just noticeable" anchor
  stage1:
    # [R] R30. The SPEC.md 9 stage-1 gate; a fit failing any one fails stage 1. Low confidence
    # in the numbers -- the precedents are heat pain -- so check their failure rates first in
    # the pilot. R^2 is stored and deliberately NOT gated on (Amir et al. 2022).
    min_span_vas: 40.0               # "flat": fitted rise across the participant's own bracket,
                                     # b * (x_max - x_min). A slope floor alone is meaningless
                                     # because bracket widths differ.
    min_spearman_rho: 0.56           # "non-monotonic": rank correlation of rating on pressure,
                                     # catch trials excluded; the one-sided 5 % cut at n = 10.
                                     # A slope <= 0 fails as well, whatever rho is.
    max_residual_sd_vas: 25.0        # "poor residuals", in VAS points
  channel_match_pct: 50.0            # [R] R31. Channels are matched, and checked in step 4, at
                                     # the reference's FITTED P50 -- inside the range every
                                     # condition is delivered in
  channel_match_adjustments: 2       # step 3, one from each of start_directions
  channel_match_zero_retries: 1      # a match that produced 0 kPa has no gain: match the
                                     # channel again this many times, then ask the
                                     # experimenter (repeat, or a recorded fallback)
  equalisation_pairs_to_flag: 2      # [R] R33. A pair is both orders. A second pair runs only
                                     # when the first favoured one channel in both orders, and a
                                     # channel is re-adjusted only when it wins all of them --
                                     # 12.5 % false alarms for a truly equal channel
  equalisation_readjust_max_passes: 1   # [R] R33. Re-adjust (both start points) and re-check
                                     # this many times, then continue with a logged warning
  evenness_max_rebalances: 1         # how often "uneven" offers the experimenter a rebalance
                                     # (steps 3 and 4 again) before the answer is just recorded

patterns:
  # Which pattern each condition uses, by pattern name within the selected pattern folder.
  # `participant_preferred` has no entry: it is whatever the participant chose in the
  # preference selection, which runs in every session (SPEC.md 9 step 6).
  condition_pattern:
    ct_targeted: sweep_03cms
    sham: static_sham
  preference_candidates: [sweep_01cms, sweep_03cms, sweep_20cms]
  # The fixed CT-targeted pattern every session uses where the condition must not show: the
  # masking check (SPEC.md 10.7), the stop rehearsal (10.9), the pleasantness adjustment and the
  # evenness check (9). Identical in every session, so it carries no information about the
  # condition. It is the ct_targeted condition's own pattern, which S may want to review
  # (docs/research/R31: it slightly favours ct_targeted in the pleasantness step).
  fixed_ct_pattern: sweep_03cms

training:
  # SPEC.md 10.9. The pressure the stop rehearsal runs the fixed pattern at -- its own value,
  # free to diverge from audio.masking_check_pressure_kpa, because a pressure chosen to be
  # audible is not necessarily one that is clearly felt. A HARDWARE/SAFETY value, so it is S's
  # (CLAUDE.md): null until S sets it, local item L11. While null the rehearsal still runs, but
  # commands NO pressure -- the pattern switches channels at whatever they hold, which on the
  # valve garment is nothing -- and logs a warning every session.
  stop_rehearsal_pressure_kpa: null

cues:
  # A visual warning cue precedes every stimulus (SPEC.md 10.5).
  warning_lead_s: 1.0
  warning_duration_s: 0.5