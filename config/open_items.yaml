# Unresolved values, and how the software knows they are still unresolved.
#
# SPEC.md 0 and 20: a value that is not yet known must be a configuration parameter with a
# clearly-marked placeholder, never a guessed constant, and the software WARNS AT STARTUP for
# each unresolved one. This file is what makes that automatic rather than remembered: the
# loader checks every `resolved_when` path and warns for each that is still null.
#
# `item`         The SPEC.md 20 item number, or Ln for one raised during the build that the
#                spec does not fix but the code cannot do without.
# `resolved_when` Dotted path into the named config file. `[]` indexes a list; `[*]` means
#                every element of a list must be non-null.
# `blocks_use`   true  -> the study cannot be RUN for real until this is settled
#                false -> piloting is fine without it

items:
  - item: "1"
    summary: Measured filament forces and weighing date
    resolved_when: {file: filaments.yaml, path: "filaments[*].force_measured_mn"}
    also: {file: filaments.yaml, path: "weighing_date"}
    fix: Launcher entry 2, Instruments and environment (SPEC.md 8.1)
    blocks_use: true

  - item: "2"
    summary: Garment pressure resolution
    resolved_when: {file: hardware.yaml, path: "garment.pressure_resolution_kpa"}
    fix: Hardware bring-up (SPEC.md 18.2)
    blocks_use: false

  - item: "3"
    summary: Inflation rate per channel
    resolved_when: {file: hardware.yaml, path: "garment.inflation_rate_kpa_s"}
    fix: Hardware bring-up; decides whether the 3 s static match transfers to the moving
         pattern (SPEC.md 9)
    blocks_use: false

  - item: "4"
    summary: The session schedule grid -- block spacing
    resolved_when: {file: schedule.yaml, path: "generate.settled"}
    fix: "Piloting (SPEC.md 7). Add `settled: true` under `generate:` once the grid is fixed."
    blocks_use: false

  - item: "5"
    summary: Real intervention patterns, per-channel activation duration and overlap
    resolved_when: {file: study1.yaml, path: "patterns.folder_settled"}
    fix: Bring-up. The patterns in config/patterns/examples/ are provisional mockups.
    blocks_use: true

  - item: "6"
    summary: Slope prior, pooled across participants
    resolved_when: {file: study1.yaml, path: "pinprick.slope_prior_source"}
    fix: Re-estimate from pilot data pooled across participants, never per participant
         (SPEC.md 8.2). Set to `pilot_pooled_YYYY-MM-DD` once done; 51.6 is simulated.
    blocks_use: false

  - item: "7"
    summary: Expected pre-S to post-S offset for the informed prior
    resolved_when: {file: study1.yaml, path: "pinprick.expected_offset_confirmed"}
    fix: Confirm -2.7 ladder steps against pilot data (SPEC.md 8.2)
    blocks_use: false

  - item: "8"
    summary: Duration of one touch adjustment
    resolved_when: {file: study1.yaml, path: "touch_calibration.measured_adjustment_duration_s"}
    fix: Piloting. Decides whether the Protocol B time budget holds, and between schemes
         A, B and C (comparison doc 7.2).
    blocks_use: false

  - item: "9"
    summary: Screen resolutions and indices for the lab PC
    resolved_when: {file: hardware.yaml, path: "screens.participant_screen_index"}
    also: {file: hardware.yaml, path: "screens.experimenter_screen_index"}
    fix: Set on the lab PC. Until then both windows open on the primary screen, windowed,
         which is right for development and wrong for a session.
    blocks_use: true

  - item: "11"
    summary: A proper hyperalgesic-zone figure
    resolved_when: {file: study1.yaml, path: "assets.zone_diagram_approved"}
    fix: Replace assets/hyperalgesia_zones.svg. Explicitly not blocking (SPEC.md 20).
    blocks_use: false

  - item: "12"
    summary: S's approval of the Swedish VAS wordings
    resolved_when: {file: text/participant_sv.yaml, path: "meta.wording_approved"}
    fix: Approved 23 Aug 2026. Where an ethics document supplies a wording it is used;
         otherwise S decides. SPEC.md 10.6's "checked against the participant-facing ethics
         attachments" overstated what this is.
    blocks_use: true

  - item: "13"
    summary: Overlap between consecutive channel activations
    resolved_when: {file: study1.yaml, path: "patterns.overlap_rows_settled"}
    fix: Piloting (SPEC.md 12.2)
    blocks_use: false

  - item: "14"
    summary: Serial protocol for the proportional-valve controller
    resolved_when: {file: hardware.yaml, path: "garment.baud"}
    fix: The prototype's protocol carries a bitmask, which cannot express a per-channel
         pressure. This is a protocol change to agree with whoever builds the controller,
         not just a driver change. Settle before arduino_valves.py is written (SPEC.md 20).
    blocks_use: true

  # ---- Raised during the build. The spec requires the value to exist but does not fix it. --

  - item: "L1"
    summary: Software pressure ceiling, below the hardware maximum
    resolved_when: {file: hardware.yaml, path: "garment.pressure_ceiling_kpa_confirmed"}
    fix: SPEC.md 13 requires a hard ceiling below the 250 kPa hardware maximum but does not
         give a number. 200 kPa is in place as a working value and is NOT a measured or
         agreed limit. Confirm at bring-up, then set this key true.
    blocks_use: true

  - item: "L2"
    summary: Software pressure rate limit
    resolved_when: {file: hardware.yaml, path: "garment.pressure_rate_max_kpa_s_confirmed"}
    fix: SPEC.md 13 requires a rate limit so that holding the up button cannot ramp to
         maximum quickly, but does not give a number. 60 kPa/s is a working value chosen to
         sit just above the 50 kPa/s top adjustment rate of SPEC.md 10.3.
    blocks_use: true

  - item: "L3"
    summary: White-noise and cue levels at the participant's headphones
    resolved_when: {file: hardware.yaml, path: "audio.levels_confirmed"}
    fix: The dBFS values are placeholders. Set with a sound level meter at the headphones so
         the cue is reliably audible over the noise and neither is uncomfortable.
    blocks_use: true

  - item: "L4"
    summary: Participant-facing instruction, standby and training screen text
    resolved_when: {file: text/participant_sv.yaml, path: "meta.instructions_supplied"}
    fix: SPEC.md 10.6 supplies the VAS questions and anchors only. The welcome, standby,
         phase-instruction and VAS-training screens are not in the spec and are bound by
         Bilaga 1 and the participant-facing ethics attachments (SPEC.md 1.3, 20 item 12),
         so they are marked placeholders rather than invented. Every such string is prefixed
         PLACEHOLDER so it cannot reach a participant unnoticed.
    blocks_use: true