    ragged: 'Line {line} has {value} cells, and the first line has {expected}.'
    bit_range: 'Channel {channel} is not a bit of the prototype''s {bits}-bit mask.'
    not_whole_ms: 'A step of {value} ms is not a whole number of milliseconds, which the prototype needs.'
    too_many_steps: '{value} steps, and the prototype stores at most {limit}.'
    mock_channels: 'The mock garment has channels {have}, and this pattern uses {value}.'
