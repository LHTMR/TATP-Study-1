# Every experimenter-facing string, English. SPEC.md 10.4, 11.
#
# The experimenter screen NEVER shows a participant rating (Bilaga 1 3.3) and NEVER shows the
# condition or the selected pattern (SPEC.md 16). No string here may name one.
#
# Placeholders in braces are filled by the software: {filament}, {force_mn}, {site}, {path},
# {region}, {channel}, {block}, {phase}, {time}, {value}.

meta:
  language: en

session:
  # The identity strip at the top of the experimenter window (SPEC.md 11). The condition is
  # deliberately absent from it and must never be added (SPEC.md 16).
  participant: 'Participant {value}'
  session_number: 'Session {value}'
  limb: 'Target limb: {value}'
  experimenter: 'Experimenter {value}'

terms:
  # Controlled-vocabulary values that appear inside the strings below, so that a value the
  # software holds in English -- a limb, a zone -- is not shown untranslated.
  limbs:
    left: left
    right: right
  regions:
    primary: primary
    secondary: secondary
  # mapping.path_ids in study1.yaml, filled into {path}.
  mapping_paths:
    proximal: proximal
    lateral: lateral
    distal: distal
    medial: medial
  # Filled into warnings.out_of_range (SPEC.md 8.2).
  out_of_range:
    below: the lightest filament was already rated at or above the target
    above: the heaviest filament was still rated below the target
  # The two kinds of intervention block, filled into status.block_label. Identical in every
  # condition, so naming them reveals nothing (SPEC.md 16).
  block_types:
    pinprick: pinprick
    touch: touch
  # The launcher's language choices, each written in its own language.
  languages:
    sv: Svenska
    en: English
  # The garment drivers the launcher offers (tatp/session.py DRIVERS). Names the rig, never a
  # condition.
  garments:
    mock: Mock garment (no hardware)
    arduino_mosfet: Prototype sleeve (on/off; pressure set by hand)
  stage1:
    # Why a touch-calibration estimate failed its quality check (SPEC.md 9). Says what kind of
    # failure, never a rating.
    flat: flat
    non_monotonic: not rising with pressure
    poor_residuals: noisy
    bracket_unusable: no range between the two settings
    unreachable: targets outside what the garment can deliver
    empty_window: no pleasantness range left inside the garment's limits

phases:
  setup: Setup
  touch_calibration: Touch calibration
  pre_sensitisation: Pre-sensitisation
  sensitisation: Heat sensitisation
  capsaicin: Capsaicin
  post_sensitisation: Post-sensitisation
  intervention: Intervention
  rekindle: Rekindle
  post_intervention: Post-intervention
  session_end: Session end

instructions:
  # SPEC.md 11: what to do now, alongside the zone diagram.
  monofilament: >-
    Approach perpendicular from about 3 cm. Bend the filament to about three-quarters of its
    extended length, hold for about 1 s, no lateral movement, then remove slowly. Keep the
    site out of the participant's view.
  # Filaments are named by the gram label printed on them (SPEC.md 8.1), with the force after.
  apply_filament: Apply the {filament} g filament ({force_mn} mN) at site {site}, {region} zone.
  # One stroke of about 2 cm, never repeated: repetition raises pain (docs/research/RB2).
  apply_brush: Brush the {region} zone at site {site} -- one single stroke of about 2 cm.
  mapping_path: Map path {path}. Step inward 5 mm on each cue and stop when the participant signals.
  # Read aloud before the first path. The mapping is instructed verbally and the participant
  # answers verbally, so this is the only place the wording exists -- there is no participant
  # mapping screen. Examples of the change are Bilaga 1's own ("burning", "tenderness", "more
  # intense pricking"); keep them, they are what the plan says participants are told.
  mapping_script: >-
    Say aloud: "I will touch you with this filament, moving a small step at a time towards the
    marked area. Tell me as soon as the feeling clearly changes — burning, tenderness, or a
    sharper pricking."
  mapping_distances: Measure each border from the centre of the primary zone, and enter the four distances in mm whenever convenient. This never blocks the session.
  fit_garment: Fit the garment and confirm all five channels are seated.
  thermode_start: Start the thermode at 50 °C. The software times the phase and does not command the device.
  thermode_rekindle: Rekindle now. The garment has been deactivated and will be reactivated afterwards.
  capsaicin_apply: Apply 0.075 % capsaicin.
  # SPEC.md 7.4, 8.3: the software times, the experimenter launches.
  ready: Ready. Press Start block when the participant is ready.
  mapping_ready: Path {path} of {value}. Press Start block to start the pacing cue, and again to stop it at the border.
  await_participant: Waiting for the participant's response.
  response_received: Response received.
  # Setup and touch calibration (SPEC.md 9, 10.7, 10.9). None names a pattern or a condition.
  masking_check: 'Audio setup: the participant is setting the noise level against the garment.'
  earplugs: Fit the earplugs under the headphones, then press Start block.
  stop_rehearsal: >-
    Stop rehearsal: the participant will now press the stop button. When the stop screen shows,
    press Resume. Press Start block only if they cannot press it.
  stop_rehearsal_resume: The stop was detected. Press Resume to carry on in front of the participant.
  touchcal_bracket: 'Touch calibration, step 1: the participant sets the touch on the middle channel.'
  touchcal_estimation: 'Touch calibration, step 2: the participant rates a series of touches.'
  touchcal_match: 'Touch calibration, step 3: the participant matches channel {channel} to the middle channel.'
  touchcal_equalise: 'Touch calibration, step 4: the participant compares channel {channel} with the middle channel.'
  touchcal_pleasantness: 'Touch calibration, step 5: the participant sets the most pleasant level.'
  touchcal_evenness: 'Touch calibration: the participant is asked whether the movement feels even.'
  touchcal_preference: 'Touch calibration, step 6: the participant chooses a kind of touch.'
  touchcal_fit_review: The touch-calibration estimate is ready. Accept it, or re-run the procedure.
  touchcal_stage1_failed: >-
    The touch-calibration estimate failed its quality check ({value}). Re-run the procedure, or
    accept it to continue with the estimate flagged.
  touchcal_stage1_unusable: >-
    The touch-calibration estimate cannot be used ({value}). Re-run the procedure, or abort the
    session.
  touchcal_stage1_exhausted: >-
    The touch-calibration estimate cannot be used ({value}) and the re-run limit is reached.
    Accept to continue on a fallback that is recorded as not valid for analysis, or abort the
    session.
  touchcal_gain_undefined: >-
    Channel {channel} was matched at 0 kPa again. Rebalance to repeat the match, or proceed
    with this channel at the middle channel's pressure, which is recorded as not valid for
    analysis.
  touchcal_uneven: >-
    The participant reports the movement as uneven along the arm. Rebalance the channels, or
    proceed.
  # Shown at the start of every touch delivery in EVERY condition, and nothing else is: only
  # one condition is self-started, so any line about starting it would name that condition
  # (SPEC.md 16). A test holds the experimenter screen identical across the three.
  touch_start: 'Touch: the garment is being started.'
  # The session sequencer (SPEC.md 2, 7.4). The software times and the experimenter launches;
  # none of these names a condition, a pattern or anything about the touch that differs.
  waiting: Waiting for the next scheduled step. The countdown shows when it is due.
  capsaicin_remove: Remove the capsaicin, then press Start block to begin the post-sensitisation measures.
  intervention_start: The intervention starts now. Press Start block to start the touch.
  touch_block: 'Touch-rating block: the participant rates the touch.'
  baseline_ratings: 'Baseline: the participant rates how they feel right now.'
  intervention_end: The intervention has ended and the garment has been switched off.
  # SPEC.md 15: a session resumed during the rekindle never prompts the heat a second time.
  rekindle_resumed: >-
    The session resumed during the rekindle. The heat was started before the interruption and
    is not prompted again; the rekindle is timed from then. Press Start block to confirm. If the
    heat was not in fact applied, apply it now and enter a note. The garment stays off until the
    rekindle is over.

controls:
  start_block: Start block
  pause: Pause
  resume: Resume
  discard_repeat: Discard and repeat last trial
  abort: Abort session
  note: Timestamped note
  connect: Connect garment
  disconnect: Disconnect garment
  rebalance: Rebalance channels
  # SPEC.md 11.1, shown only when fit_preview.enabled.
  fit_accept: Accept this estimate
  fit_rerun: Re-run the procedure
  # The free-text entries (SPEC.md 8.2, 8.4, 11). None of them ever blocks the session.
  add_note: Add note
  substitution: Filament applied instead (g)
  record_substitution: Record filament
  distances: 'Mapping distances (mm), measured from the centre of the primary zone:'
  enter_distances: Enter distances
  open_distances: Mapping distances…
  cancel: Cancel

status:
  connected: Connected
  disconnected: Disconnected
  channel_pressure: 'Channel {channel}: {value} kPa'
  # The hardware panel's compact form: every channel on one or two lines.
  channel_pressures: 'kPa by channel: {value}'
  channel_pressure_short: '{channel}: {value}'
  elapsed: Session elapsed {time}
  next_event: 'Next: {phase} in {time}'
  block_due: Block {block} is due.
  block_overdue: Block {block} is OVERDUE.
  # A scheduled phase change or the rekindle, due and overdue, as for a block.
  event_due: '{phase} is due.'
  event_overdue: '{phase} is OVERDUE.'
  # Filled into next_event's {phase} when the next event is a block.
  block_label: block {block} ({value})
  # Shown for as long as the session is interrupted (SPEC.md 13).
  interrupted_emergency_stop: EMERGENCY STOP. The garment is at zero. Press Resume when the participant is ready.
  interrupted_pause: Paused. The garment is at zero. Press Resume to continue.
  discarded: Last trial discarded. It will be repeated.
  discarded_not_repeated: >-
    Last trial discarded. The application limit has been reached, so it will not be repeated.

warnings:
  # Warn-and-continue, never block (SPEC.md 7.3, 11, 14.1).
  experimenter_changed: >-
    These initials differ from earlier sessions for this participant. Bilaga 1 3.3 asks for the
    same experimenter throughout. The session will continue and the deviation is recorded.
  cloud_sync: >-
    The data folder is inside a cloud-synced tree ({value}). This is recorded in the session
    file. Move the data to a local folder if you can.
  filaments_unweighed: >-
    No measured filament forces. Nominal forces deviate from measured by up to about 20 %
    (Berquin et al. 2010). Weigh the set in Instruments and environment before collecting data.
  open_items: 'Unresolved configuration placeholders: {value}'
  out_of_range: >-
    The calibration ran out of ladder ({value}). The boundary filament will be used and the
    trial is flagged. Expect this in a meaningful fraction of sessions.
  application_cap: >-
    The limit of {value} applications was reached. The best available estimate is used and
    flagged.
  substitution_unknown: No filament labelled {filament} g is held. The substitution was not recorded.
  substitution_not_lower: >-
    The {filament} g filament is not lighter than the one asked for. It is recorded as applied.
  distance_implausible: >-
    Path {path}: {value} mm is outside the plausible range. Enter the same value again to
    confirm it, or enter the corrected value.
  catch_trials_felt: >-
    More than the allowed share of zero-pressure catch trials were reported as felt ({value}).
  schedule: 'Schedule warning, block {block}: {value}'
  no_response: No response for {value} s.
  # SPEC.md 10.7 step 5. Raising the noise has stopped helping, so the remedy is physical.
  # Audible as well as on screen: the experimenter may be looking at the participant.
  masking_failed: >-
    The participant can still hear the garment and the noise cannot be raised further. Offer
    earplugs under the headphones. The noise has stopped so you can talk, and the check will
    start again from the beginning once they are fitted.
  masking_failed_after_earplugs: >-
    Still audible with earplugs. The session will continue and is recorded as not fully masked.
  equalisation_mismatch: >-
    Channel {channel} still does not match the middle channel after re-adjustment. The session
    continues and this is recorded.

banners:
  # SPEC.md 12.4: persistent and unmissable. A session run this way must be impossible to
  # mistake for a real one afterwards.
  reduced_capability: >-
    THIS SESSION IS NOT COLLECTING VALID TOUCH-CALIBRATION DATA. The connected device
    ({value}) cannot set pressure per channel. Timings are real; pressures are not.
  placeholder_text: >-
    PARTICIPANT SCREENS STILL CONTAIN PLACEHOLDER TEXT. Do not run a real participant.
  # SPEC.md 11.1. Unmissable, because the experimenter must not switch this on without seeing
  # what it costs.
  fit_preview: >-
    FIT PREVIEW IS ON. You will see the participant's ratings, which Bilaga 1 3.3 and the
    information sheet say you do not. The session is recorded as unblinded in that respect.

dialogs:
  abort_confirm: Abort this session? All data collected so far is kept.
  abort_reason: Reason for aborting
  # SPEC.md 15. Both values are formatted by the session from its own text.
  resume_found: 'An unfinished session was found for this participant. Completed: {completed}. Sensitisation began {since_sensitisation} ago. Resume it, keeping the original timing?'
  # The two values filled into resume_found: what was completed, and how long ago
  # sensitisation began (run_session.resume_summary). Phase names come from `phases:` above.
  resume_blocks: blocks {value}
  resume_nothing_completed: nothing yet
  resume_since_sensitisation: '{value} (hours:minutes)'
  resume_not_sensitised: '— it had not begun yet —'
  distances_outstanding: Mapping distances are still outstanding. Enter them now, or close the session with them flagged missing.
  fit_rerun_reason: Why are you re-running? Recorded with the discarded estimate, which is kept.
  fit_rerun_exhausted: The re-run limit for this procedure has been reached. This estimate will be used.
  error: Error
  close: Close
  # Buttons of the resume question.
  resume_yes: Resume the session
  resume_no: Start a new session

preflight:
  # What the launcher checks before a session starts (SPEC.md 11, 15, 17.5). A refusal stops
  # the session; a warning is shown and the session may continue. {value} is filled in.
  session_completed: Session {value} for this participant has already been completed. It will not be run again.
  code_not_allocated: Participant code {value} is not in the allocation file. Check the code.
  previous_session_missing: >-
    No data was found for session {value} of this participant. This session can run, but its
    first calibration starts from the configured filament instead of the previous session's
    estimate, and the log records it.
  previous_estimate_missing: >-
    Session {value} of this participant has no accepted pre-sensitisation estimate. This
    session's first calibration starts from the configured filament instead, and the log
    records it.
  session_aborted_before: >-
    Session {value} for this participant was started before and aborted. A new session will be
    recorded alongside it.
  another_instance: Another session is already running from this data folder ({value}). Close it first.

zones:
  # Beside the zone diagram (SPEC.md 11): where the current stimulus goes.
  target: '{region} zone, site {site}'
  target_region: '{region} zone'

hardware:
  # The hardware panel (SPEC.md 11, 12.1). Per-channel pressure is left out entirely while the
  # intervention and the rekindle run, because it would differ by condition (SPEC.md 16).
  title: Garment
  fault: 'Fault: {value}'
  # During the intervention and the rekindle a fault's detail names a channel, and which
  # channels a pattern uses differs by condition (SPEC.md 16). The fault itself is still shown.
  fault_withheld: 'Garment faults: {value} (detail in the data)'

fit_preview:
  # SPEC.md 11.1. Shown only when fit_preview.enabled is true. The one place a participant's
  # ratings reach the experimenter.
  f40_title: 'F40, run {value}'
  touch_title: 'Touch calibration, run {value}'
  x_force: Force (mN, log scale)
  x_pressure_log: Pressure (kPa, log scale)
  x_pressure_linear: Pressure (kPa)
  y_rating: Rating (%)
  missing: '–'
  # Quoted: YAML reads a bare yes or no as a boolean.
  answer_yes: 'yes'
  answer_no: 'no'
  # Short, because the preview shares a narrow column with the plot. rho is the rank
  # correlation of rating on force, the F40 run's consistency check.
  f40_quality: 'rho {rho} · {measure} of {total} applications measured'
  f40_flags_out_of_range: 'Ran out of ladder: {value}'
  f40_flags_capped: Application limit reached
  f40_derived: 'F40 {f40} mN, so {filament} g ({force} mN); slope {slope}'
  touch_quality: 'R² {r_squared} · residual SD {residual_sd} · rising {monotonic}'
  touch_stage1_pass: 'Stage 1: passes'
  touch_stage1_fail: 'Stage 1: fails ({value})'
  touch_derived: 'P20 {p20} · P30 {p30} · P80 {p80} kPa'

launcher:
  # SPEC.md 4.1: the four entries.
  title: TATP Study 1
  run_session: Run a session
  run_session_detail: The experiment. Needs the participant code, session number and pattern folder.
  instruments: Instruments and environment
  instruments_detail: Enter weighed filament forces, and today's room temperature and humidity.
  design_pattern: Design a pattern
  design_pattern_detail: Compose garment patterns, preview them, and save them to a pattern folder. For S only. It shows pattern names and shapes, so an experimenter running sessions never opens it.
  preview_schedule: Preview schedule
  preview_schedule_detail: The session timeline and its warnings. Nothing is started.
  environment_entered: 'Room {temperature} °C, {humidity} % RH, handed to the next session.'
  # The session dialog. It collects only what SPEC.md 6 lists; everything else is config.
  session_title: Run a session
  participant_code: Participant code
  session_number: Session number
  experimenter_initials: Experimenter initials
  participant_language: Participant language
  experimenter_language: Experimenter language
  garment: Garment
  data_folder: Data folder
  pattern_folder: Pattern folder
  browse: Browse…
  # The unchosen state of the session number and the languages, which have no default.
  choose: Choose…
  check: Check
  start: Start session
  close: Close
  missing_field: 'Required: {value}'
  no_pattern_folder: Choose the pattern folder. There is no default, so the provisional example patterns are never used by accident.
  refusals: 'The session cannot start:'
  warnings: 'Warnings. The session can start, and each is recorded:'
  no_findings: No problems found.
  preview_title: Schedule preview

instruments:
  # SPEC.md 8.1. Writes the measured forces and the weighing date into config/filaments.yaml.
  title: Instruments and environment
  filaments: Filament forces
  label: Label (g)
  size: Size
  nominal: Nominal (mN)
  measured: Measured (mN)
  weighing_date: 'Weighing date (YYYY-MM-DD):'
  weighing_balance: 'Balance used:'
  save_forces: Save forces
  saved: 'Saved {value} measured forces to filaments.yaml.'
  invalid_force: 'Filament {filament} g: {value} is not a force in mN above zero.'
  invalid_date: '{value} is not a date in the form YYYY-MM-DD.'
  date_required: Enter the weighing date before saving measured forces.
  nothing_to_save: No measured forces entered.
  environment: Room environment (optional)
  room_temperature: 'Room temperature (°C):'
  relative_humidity: 'Relative humidity (%):'
  use_environment: Use for the next session
  invalid_number: '{value} is not a number.'

designer:
  # SPEC.md 12.2: launcher entry 3, tools/design_pattern.py. For S, not for a blinded
  # experimenter (SPEC.md 16), so it may show pattern names, but no string here names a
  # condition. Written by the build (docs/LOG.md N7.P1-N7.P9), not ethics-sourced.
  title: Pattern designer
  for_s_only: For S only. It shows pattern names and shapes, so an experimenter running sessions never opens it.
  new: New
  open: Open pattern…
  import_reference: Import prototype CSV…
  save: Save
  save_as: Save as…
  export: Export command file…
  parameters: Pattern
  name: Name (also the file name)
  row_interval_ms: Row interval (ms)
  channel_ids: Channel ids (bit indices)
  loop: Repeats while active
  descriptive: Descriptive only, optional
  nominal_velocity_cm_s: Nominal velocity (cm/s)
  assumed_channel_spacing_cm: Channel spacing (cm)
  overlap_rows: Overlap (rows)
  tab_grid: Grid
  tab_ordered: Ordered channels
  tab_timed: Timed channels
  grid_hint: One row per row interval, one column per channel. Click a cell to switch it on or off.
  row_time: '{value} ms'
  add_row: Add row
  duplicate_row: Duplicate row
  remove_row: Remove row
  channel: Channel
  hold_ms: Hold (ms)
  onset_ms: Onset (ms)
  offset_ms: Offset (ms)
  add_channel: Add channel
