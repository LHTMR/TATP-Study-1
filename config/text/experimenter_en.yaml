# Every experimenter-facing string, English. SPEC.md 10.4, 11.
#
# The experimenter screen NEVER shows a participant rating (Bilaga 1 3.3) and NEVER shows the
# condition or the selected pattern (SPEC.md 16). No string here may name one.
#
# Placeholders in braces are filled by the software: {filament}, {force_mn}, {site}, {path},
# {region}, {channel}, {block}, {phase}, {time}, {value}.

meta:
  language: en

session:
  # The identity strip at the top of the experimenter window (SPEC.md 11). The condition is
  # deliberately absent from it and must never be added (SPEC.md 16).
  participant: 'Participant {value}'
  session_number: 'Session {value}'
  limb: 'Target limb: {value}'
  experimenter: 'Experimenter {value}'

terms:
  # Controlled-vocabulary values that appear inside the strings below, so that a value the
  # software holds in English -- a limb, a zone -- is not shown untranslated.
  limbs:
    left: left
    right: right
  regions:
    primary: primary
    secondary: secondary
  # mapping.path_ids in study1.yaml, filled into {path}.
  mapping_paths:
    proximal: proximal
    lateral: lateral
    distal: distal
    medial: medial
  # Filled into warnings.out_of_range (SPEC.md 8.2).
  # DRAFT (LOG N7.F11b15): written by the build, not ethics-sourced. Shortened so the warning
  # fits the status region.
  out_of_range:
    below: even the lightest reached the target
    above: even the heaviest stayed below the target
  # The two kinds of intervention block, filled into status.block_label. Identical in every
  # condition, so naming them reveals nothing (SPEC.md 16).
  block_types:
    pinprick: pinprick
    touch: touch
  # The launcher's language choices, each written in its own language.
  languages:
    sv: Svenska
    en: English
  # The garment drivers the launcher offers (tatp/session.py DRIVERS). Names the rig, never a
  # condition.
  garments:
    mock: Mock garment (no hardware)
    arduino_mosfet: Prototype sleeve (on/off; pressure set by hand)
  stage1:
    # Why a touch-calibration estimate failed its quality check (SPEC.md 9). Says what kind of
    # failure, never a rating.
    flat: flat
    non_monotonic: not rising with pressure
    poor_residuals: noisy
    bracket_unusable: no range between the two settings
    unreachable: targets outside what the garment can deliver
    empty_window: no pleasantness range left inside the garment's limits

phases:
  setup: Setup
  touch_calibration: Touch calibration
  pre_sensitisation: Pre-sensitisation
  sensitisation: Heat sensitisation
  capsaicin: Capsaicin
  post_sensitisation: Post-sensitisation
  intervention: Intervention
  rekindle: Rekindle
  post_intervention: Post-intervention
  session_end: Session end
  # Not phases of the session: what the countdown names while the capsaicin is on, and while
  # the rekindle heat is on. `capsaicin_removal` is also the scheduled step's name in the log.
  # DRAFT (LOG N7.F11b17): written by the build, not ethics-sourced
  capsaicin_removal: Capsaicin removal
  # DRAFT (LOG N7.F11b10): written by the build, not ethics-sourced
  rekindle_end: End of the rekindle heat

instructions:
  # SPEC.md 11: what to do now, alongside the zone diagram.
  #
  # Filled by `tatp.config.instruction`: {controls[...]} with the button labels below, so an
  # instruction never names a button its own way (LOG N7.F11b18); {say[...]} with a sentence
  # from `say:` in the PARTICIPANT's language, since it is said to them (LOG N7.F11b19); the
  # remote's button symbols ({confirm} ...) from hardware.yaml; and the step's own values.
  monofilament: >-
    Approach perpendicular from about 3 cm. Bend the filament to about three-quarters of its
    extended length, hold for about 1 s, no lateral movement, then remove slowly. Keep the
    site out of the participant's view.
  # Filaments are named by the gram label printed on them (SPEC.md 8.1), with the force after.
  # "Now:" so the application in progress never reads like the one before (LOG N7.F11b8).
  # DRAFT (LOG N7.F11b8): written by the build, not ethics-sourced
  apply_filament: 'Now: apply the {filament} g filament ({force_mn} mN) at site {site}, {region} zone.'
  # One stroke of about 2 cm, never repeated: repetition raises pain (docs/research/RB2).
  # DRAFT (LOG N7.F11b8): written by the build, not ethics-sourced
  apply_brush: 'Now: brush the {region} zone at site {site}, one single stroke of about 2 cm.'
  # DRAFT (LOG N7.F11b8, N7.F14c): written by the build, not ethics-sourced. The jittered gap
  # after a rating when no application follows it: the series is over. The response is
  # reported on the status line (`received_*`).
  between_applications: 'Wait: the next step will appear here.'
  # DRAFT (LOG N7.F11b8): written by the build, not ethics-sourced. The same gap after a
  # discard, which the status reports, when no application follows it.
  between_applications_discarded: 'Discarded. Wait: the next step will appear here.'
  # DRAFT (LOG N7.F14c): written by the build, not ethics-sourced; "Deliver in" is S's. The
  # gap before an application, so the experimenter can prepare it (S, 16 Oct 2026): what
  # comes next, counting down in whole seconds to its warning cue.
  next_filament: 'Next: the {filament} g filament ({force_mn} mN) at site {site}, {region} zone. Deliver in {seconds} s.'
  next_brush: 'Next: the brush at site {site}, {region} zone. Deliver in {seconds} s.'
  # DRAFT (LOG N7.F14c): written by the build, not ethics-sourced. The status line through
  # that gap: the application just rated, never its rating (Bilaga 3a: the experimenter does
  # not see the participant's ratings).
  received_filament: 'Response received: {filament} g at site {site}.'
  received_brush: 'Response received: brush at site {site}.'
  # DRAFT (LOG N7.F11b11): written by the build, not ethics-sourced. {step} is
  # mapping.step_size_mm.
  mapping_path: 'Path {path}: move the filament {step} mm inward on each tick. When the participant reports a change, press {controls[proceed]} and mark the border on the skin.'
  # Read aloud before the first path: `say.mapping`.
  mapping_script: 'Say aloud: "{say[mapping]}"'
  mapping_distances: Measure each border from the centre of the primary zone, and enter the four distances in mm whenever convenient. This never blocks the session.
  # DRAFT (LOG N7.F12g2): written by the build, not ethics-sourced. Nothing about the warning
  # cue: it is now words ("Get ready"), which explain themselves the first time they appear, so
  # the sentence the circle needed (N7.F11b1) is gone.
  fit_garment: >-
    Fit the garment and check that all five channels are seated. Give the participant the
    remote and show the buttons: {decrease} {increase} move, {confirm} confirms,
    {emergency_stop} stops. Put the headphones on. Then press {controls[proceed]}.
  # DRAFT (LOG N7.F11b2): written by the build, not ethics-sourced
  welcome: >-
    The participant reads the welcome and presses {confirm}. The stop rehearsal follows at
    once: the touch starts and they are asked to press the stop button.
  # DRAFT (LOG N7.F14a): written by the build, not ethics-sourced
  practice_intro: >-
    The participant is reading that the rating-scale practice comes next, and presses
    {confirm} to start it.
  # DRAFT (LOG N7.F11b9): written by the build, not ethics-sourced. {minutes} is the
  # sensitisation window's length (schedule.yaml), inside `say.heat`.
  thermode_start: >-
    Heat: tell the participant "{say[heat]}" Place the thermode (50 °C) on the primary zone
    and press {controls[proceed]} the moment it starts heating: this is time zero.
  # DRAFT (LOG N7.F11b9): written by the build, not ethics-sourced. While the heat is on.
  heat_on: Heat on. Remove the thermode when the capsaicin is due.
  # DRAFT (LOG N7.F11b9): written by the build, not ethics-sourced
  capsaicin_apply: Remove the thermode. Apply 0.075 % capsaicin to the primary zone, then press {controls[proceed]}.
  # DRAFT (LOG N7.F11b9): written by the build, not ethics-sourced. While the capsaicin is on.
  capsaicin_on: Capsaicin on. Remove it when the countdown ends.
  # DRAFT (LOG N7.F11b10): written by the build, not ethics-sourced
  thermode_rekindle: >-
    Rekindle: the garment's touch is off. Place the thermode on the primary zone and press
    {controls[proceed]} as it starts heating.
  # DRAFT (LOG N7.F11b10): written by the build, not ethics-sourced. While the rekindle heat is
  # on; the countdown above counts to its end.
  rekindle_heating: Rekindle heat on. Remove the thermode when the countdown ends.
  # DRAFT (LOG N7.F11b10): written by the build, not ethics-sourced
  rekindle_remove: Remove the thermode, then press {controls[proceed]}. The garment's touch starts again.
  # SPEC.md 7.4, 8.3: the software times, the experimenter launches. One per kind of series,
  # saying what is about to be applied (LOG N7.F11b7). {n} is the configured count.
  # DRAFT (LOG N7.F11b7): written by the build, not ethics-sourced
  ready_long: >-
    Filament series, {region} zone, starting with the {filament} g filament. Have the
    filaments to hand, then press {controls[proceed]}.
  # DRAFT (LOG N7.F11b14): written by the build, not ethics-sourced. Before the session's
  # first pain measure, which is followed by the pain scale's training.
  ready_long_first: 'First pain measures. Tell the participant: "{say[first_pain]}" Then press {controls[proceed]}.'
  # DRAFT (LOG N7.F11b7): written by the build, not ethics-sourced
  ready_short: '{n} applications of the {filament} g filament, {region} zone. Have it to hand, then press {controls[proceed]}.'
  # DRAFT (LOG N7.F11b7): written by the build, not ethics-sourced
  ready_brush: '{n} brush strokes, {region} zone. Have the brush to hand, then press {controls[proceed]}.'
  # DRAFT (LOG N7.F11b7): written by the build, not ethics-sourced. An intervention pinprick
  # block: {ready} is `ready_short`.
  ready_pinprick_block: 'Pinprick block {block}: {ready}'
  # DRAFT (LOG N7.F11b7): written by the build, not ethics-sourced
  ready_touch_block: 'Touch-rating block {block}: nothing to apply. Press {controls[proceed]} and the participant rates the touch.'
  # DRAFT (LOG N7.F11b11): written by the build, not ethics-sourced
  mapping_ready: 'Path {index} of {count} ({path}). Start outside the area. Press {controls[proceed]} to start the tick.'
  await_participant: Waiting for the participant's response.
  response_received: Response received.
  # DRAFT (LOG N7.F11b5): written by the build, not ethics-sourced. The VAS proportionality
  # training (SPEC.md 10.6), before a scale's first rating; the same in every condition. The
  # experimenter cannot see the participant's screen, so the labels are given here:
  # {anchors} are the participant text's anchors for the scale, left to right, and
  # {explanation} is `say.proportionality`, both in the PARTICIPANT's language.
  vas_training: >-
    Rating-scale training. Tell the participant: "{say[training_scale]}" Read the labels from
    left to right: {anchors}. Then say: "{explanation}" Then press {controls[proceed]}.
  # DRAFT (LOG N7.F7a): written by the build, not ethics-sourced. After that Next step, while
  # the participant makes the practice rating. Never shows where they put the marker.
  vas_training_wait: >-
    Rating scale training: the participant is making a practice rating and confirms it with
    {confirm}. It is not recorded as a rating.
  # Setup and touch calibration (SPEC.md 9, 10.7, 10.9). None names a pattern or a condition.
  # DRAFT (LOG N7.F11b4): written by the build, not ethics-sourced. Step 1 of the masking
  # check, with the garment still off.
  masking_check: 'Audio setup, part 1: the participant turns the noise up until they can hear it easily. The garment starts next.'
  # DRAFT (LOG N7.F11b4): written by the build, not ethics-sourced. The masking step (SPEC.md
  # 10.7): the participant is told to say so if they can still hear the garment, and the
  # experimenter's Next step is what records it.
  masking_check_mask: >-
    Audio setup, part 2: the garment is running and the participant raises the noise to cover
    it. Press {controls[proceed]} only if they say they can still hear the garment: that
    records it and stops the noise so you can offer earplugs.
  # DRAFT (LOG N7.F11b4): written by the build, not ethics-sourced. The same step with earplugs in.
  masking_check_mask_earplugs: >-
    Audio setup, with earplugs: the participant raises the noise to cover the garment. Press
    {controls[proceed]} only if they say they can still hear it: that records it, and the
    session continues recorded as not fully masked.
  # DRAFT (LOG N7.F11b4): written by the build, not ethics-sourced. The `settled` screen, where
  # Next step does nothing.
  masking_done: 'Audio setup done. The participant reads the screen and presses {confirm}; touch calibration follows.'
  # DRAFT (LOG N7.F11b4): written by the build, not ethics-sourced
  earplugs: >-
    Fit the earplugs under the headphones. Tell the participant: "{say[earplugs]}" Then press
    {controls[proceed]}.
  # DRAFT (LOG N7.F11b3): written by the build, not ethics-sourced
  stop_rehearsal: >-
    Stop rehearsal: the touch is running and the participant is asked to press the stop
    button. Wait for the press. {controls[proceed]} is only for a participant who cannot press,
    and it records no press.
  # DRAFT (LOG N7.F11b3): written by the build, not ethics-sourced
  stop_rehearsal_resume: 'The stop worked. Tell the participant: "{say[stop_works]}" Then press {controls[resume]}.'
  # DRAFT (LOG N7.F11b3): written by the build, not ethics-sourced. After the resume, while
  # `stop_rehearsal_done` is up.
  stop_rehearsal_done: The participant reads that the stop button works at any time and presses {confirm}. The audio setup follows.
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced. "Each starts from no touch"
  # holds while touch_calibration.adjustments_per_anchor is 1 (tests/test_touchcal.py).
  touchcal_bracket: >-
    Touch calibration, step 1 of 6: the participant sets the touch on the middle channel,
    first to just noticeable, then to just uncomfortable. Each starts from no touch.
  # DRAFT (LOG N7.F8c): the progress, "x/N answered" (S, 5 Oct 2026).
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_estimation: 'Touch calibration, step 2 of 6: the participant rates a series of touches. {answered}/{total} answered.'
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced. {index} of {count} counts
  # the channels matched to the middle one.
  touchcal_match: 'Touch calibration, step 3 of 6: the participant matches channel {channel} ({index} of {count}) to the middle channel.'
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced. Step 3's matching, repeated
  # inside step 4 for a channel that still felt different.
  touchcal_readjust: 'Touch calibration, step 4 of 6: channel {channel} did not match the middle channel, so the participant sets it again.'
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_equalise: 'Touch calibration, step 4 of 6: the participant compares channel {channel} ({index} of {count}) with the middle channel.'
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_pleasantness: 'Touch calibration, step 5 of 6: the participant sets the most pleasant level.'
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_evenness: 'Touch calibration, after step 5: the participant is asked whether the movement feels even.'
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_preference: 'Touch calibration, step 6 of 6: the participant chooses a kind of touch.'
  # DRAFT (LOG N7.F11b18): written by the build, not ethics-sourced
  touchcal_fit_review: 'The touch-calibration estimate is ready. Press {controls[fit_accept]}, or {controls[fit_rerun]}.'
  # DRAFT (LOG N7.F11b15): written by the build, not ethics-sourced
  f40_fit_review: 'The pinprick-force estimate (F40) is ready. Press {controls[fit_accept]}, or {controls[fit_rerun]}.'
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_stage1_failed: >-
    The touch-calibration estimate failed its quality check ({value}). Press
    {controls[fit_rerun]} to repeat steps 1 and 2, and tell the participant: "{say[rerun]}" Or
    press {controls[fit_accept]} to go on with it flagged.
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_stage1_unusable: >-
    The touch-calibration estimate cannot be used ({value}). Press {controls[fit_rerun]} to
    repeat steps 1 and 2, and tell the participant: "{say[rerun]}" Or press {controls[abort]}.
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced. No re-run is offered: the
  # limit is reached, and a re-run is refused.
  touchcal_stage1_exhausted: >-
    The touch-calibration estimate cannot be used ({value}) and the re-run limit is reached.
    Press {controls[fit_accept]} to go on with a fallback that is recorded as not valid for
    analysis, or press {controls[abort]}.
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_gain_undefined: >-
    Channel {channel} was matched at 0 kPa again. Press {controls[rebalance]} to repeat the
    match, or {controls[proceed]} to continue with this channel at the middle channel's
    pressure, which is recorded as not valid for analysis.
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_uneven: >-
    The participant reports the movement as uneven along the arm. Press {controls[rebalance]}
    to repeat steps 3 and 4, or {controls[proceed]} to go on.
  # Shown at the start of every touch delivery in EVERY condition, and nothing else is: only
  # one condition is self-started, so any line about starting it would name that condition
  # (SPEC.md 16). A test holds the experimenter screen identical across the three.
  # DRAFT (LOG N7.F11b15): written by the build, not ethics-sourced
  touch_start: The garment's touch is starting.
  # The session sequencer (SPEC.md 2, 7.4). The software times and the experimenter launches;
  # none of these names a condition, a pattern or anything about the touch that differs.
  # DRAFT (LOG N7.F11b15): written by the build, not ethics-sourced
  waiting: Nothing to do until the next step. The countdown above shows when it is due.
  # DRAFT (LOG N7.F11b18): written by the build, not ethics-sourced
  capsaicin_remove: Remove the capsaicin, then press {controls[proceed]} to begin the post-sensitisation measures.
  # DRAFT (LOG N7.F11b13): written by the build, not ethics-sourced. Identical in every
  # condition: in every condition the garment touches (SPEC.md 12). {hours} is the
  # intervention window's length (schedule.yaml), inside `say.intervention`.
  intervention_start: 'Intervention. Tell the participant: "{say[intervention]}" Then press {controls[proceed]}.'
  # DRAFT (LOG N7.F11c7): written by the build, not ethics-sourced. The count as in
  # `touchcal_estimation`: the same in every condition, never what was answered.
  touch_block: 'Touch-rating block: the participant rates the touch. {answered}/{total} answered.'
  baseline_ratings: 'Baseline: the participant rates how they feel right now.'
  # DRAFT (LOG N7.F11c10): written by the build, not ethics-sourced. A wait for Next step, so
  # the participant is told before the measures begin again; the same in every condition.
  intervention_end: >-
    The intervention has ended; the garment is off. Tell the participant: "{say[intervention_end]}"
    Then press {controls[proceed]}.
  # DRAFT (LOG N7.F11c9): written by the build, not ethics-sourced. The last instruction, once
  # the session is closed and every file written; Next step closes the program.
  session_complete: >-
    Session complete. All data is saved. Remove the garment and tell the participant the visit
    is over. Press {controls[proceed]} to close the program.
  # DRAFT (LOG N7.F11c1): written by the build, not ethics-sourced. While the participant reads
  # the introduction to the next kind of task in touch calibration (participant
  # `screens.intro_*`), one whole line each, numbered as the step instructions are.
  touchcal_intro_bracket: 'Touch calibration, step 1 of 6: the participant is reading what comes next.'
  touchcal_intro_estimation: 'Touch calibration, step 2 of 6: the participant is reading what comes next.'
  touchcal_intro_match: 'Touch calibration, step 3 of 6: the participant is reading what comes next.'
  # A channel set again after it did not match (`touchcal_readjust`) is part of step 4.
  touchcal_intro_readjust: 'Touch calibration, step 4 of 6: the participant is reading what comes next.'
  touchcal_intro_compare: 'Touch calibration, step 4 of 6: the participant is reading what comes next.'
  touchcal_intro_pleasant: 'Touch calibration, step 5 of 6: the participant is reading what comes next.'
  # SPEC.md 15: a session resumed during the rekindle never prompts the heat a second time.
  # DRAFT (LOG N7.F11b18): written by the build, not ethics-sourced
  rekindle_resumed: >-
    The session resumed during the rekindle. The heat was started before the interruption and
    is not prompted again; the rekindle is timed from then. Press {controls[proceed]} to
    confirm. If the heat was not in fact applied, apply it now and enter a note. The garment
    stays off until the rekindle is over.

# What the experimenter says aloud to the participant, quoted inside `instructions` as
# {say[...]}. Loaded in the PARTICIPANT's language (`Config.say`), whatever the experimenter's
# (LOG N7.F11b19). None may differ by condition (SPEC.md 16).
say:
  # Read aloud before the first mapping path. The mapping is instructed verbally and the
  # participant answers verbally, so this is the only place the wording exists -- there is no
  # participant mapping screen. Examples of the change are Bilaga 1's own ("burning",
  # "tenderness", "more intense pricking"); keep them, they are what the plan says
  # participants are told.
  mapping: >-
    I will touch you with this filament, moving a small step at a time towards the marked
    area. Tell me as soon as the feeling clearly changes — burning, tenderness, or a sharper
    pricking.
  # DRAFT (LOG N7.F11b9): written by the build, not ethics-sourced. {minutes} is filled after.
  heat: You will now feel heat on your hand for {minutes} minutes.
  # DRAFT (LOG N7.F11b4): written by the build, not ethics-sourced
  earplugs: You will set the noise again from the start, the same way.
  # DRAFT (LOG N7.F11b3): written by the build, not ethics-sourced
  stop_works: That is how the stop button works. I will start the touch again now.
  # DRAFT (LOG N7.F11b5): written by the build, not ethics-sourced
  training_scale: There is no touch now. This is the scale you will use.
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  rerun: We will do the settings and ratings once more.
  # DRAFT (LOG N7.F12g3): written by the build, not ethics-sourced. The brush is rated on the
  # pain scale too (study1.yaml brush.rating_scale). The cue is now the text "Get ready"
  # (N7.F12g1), not a circle; every skin test is a real stimulus, so saying one follows is true.
  first_pain: >-
    Next I will test the skin with thin plastic filaments and a soft brush. Each time, the
    screen first tells you to get ready, then you feel it, then the line appears and you rate
    how painful it was. This first line is practice.
  # DRAFT (LOG N7.F11b13): written by the build, not ethics-sourced. {hours} is filled after.
  intervention: >-
    The next part takes about {hours} hours. You will feel touch from the garment, and in
    between I will repeat the skin tests and you will rate the touch. Just follow the screen.
  # DRAFT (LOG N7.F11c10): written by the build, not ethics-sourced. At the intervention's end,
  # the same in every condition.
  intervention_end: The touch has finished. We will now repeat the skin tests from the start of the visit.
  # DRAFT (LOG N7.F7a): written by the build, not ethics-sourced. What the experimenter says
  # about proportionality in the VAS training (SPEC.md 10.6), shown inside
  # `instructions.vas_training` as {explanation}. It was on the participant's screen until S's
  # lab-run list (5 Oct 2026); it is the participant text's old sentence, and Bilaga 1's "a
  # mark twice as far along the line indicates it is twice as painful" / "twice as
  # pleasant/intense". One key per trained scale, the same scales as the participant text's
  # `training`.
  proportionality:
    pain: A mark twice as far along the line means it was twice as painful.
    intensity: A mark twice as far along the line means the touch felt twice as intense.
    pleasantness: A mark twice as far along the line means the touch felt twice as pleasant.

controls:
  proceed: Next step
  pause: Pause
  resume: Resume
  discard_repeat: Discard and repeat last trial
  abort: Abort session
  note: Timestamped note
  connect: Connect garment
  disconnect: Disconnect garment
  rebalance: Rebalance channels
  # SPEC.md 11.1, shown only when fit_preview.enabled.
  fit_accept: Accept this estimate
  fit_rerun: Re-run the procedure
  # DRAFT (LOG N7.F8b): written by the build. Shown only with the mock or prototype garment,
  # after a few touch-calibration ratings; ends the calibration, recorded as skipped.
  skip_calibration: Skip calibration
  # DRAFT (LOG N7.F12a1): written by the build, not ethics-sourced. Re-calibration, while
  # touch is calibrated or delivered and beside Resume after a stop; each opens a dialog
  # asking why.
  recalibrate_rebalance: Rebalance channels…
  # DRAFT (LOG N7.F12a1): written by the build, not ethics-sourced
  recalibrate_restart: Restart calibration…
  # DRAFT (LOG N7.F12a1): written by the build, not ethics-sourced. Confirms the restart's dialog.
  restart_calibration: Restart calibration
  # The free-text entries (SPEC.md 8.2, 8.4, 11). None of them ever blocks the session.
  add_note: Add note
  # DRAFT (LOG N7.F10a): written by the build, not ethics-sourced. Shown in the emptied note
