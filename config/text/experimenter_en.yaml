# Every experimenter-facing string, English. SPEC.md 10.4, 11.
#
# The experimenter screen NEVER shows a participant rating (Bilaga 1 3.3) and NEVER shows the
# condition or the selected pattern (SPEC.md 16). No string here may name one.
#
# Placeholders in braces are filled by the software: {filament}, {force_mn}, {site}, {path},
# {region}, {channel}, {block}, {phase}, {time}, {value}.

meta:
  language: en

session:
  # The identity strip at the top of the experimenter window (SPEC.md 11). The condition is
  # deliberately absent from it and must never be added (SPEC.md 16).
  participant: 'Participant {value}'
  session_number: 'Session {value}'
  limb: 'Target limb: {value}'
  experimenter: 'Experimenter {value}'

terms:
  # Controlled-vocabulary values that appear inside the strings below, so that a value the
  # software holds in English -- a limb, a zone -- is not shown untranslated.
  limbs:
    left: left
    right: right
  regions:
    primary: primary
    secondary: secondary
  # mapping.path_ids in study1.yaml, filled into {path}.
  mapping_paths:
    proximal: proximal
    lateral: lateral
    distal: distal
    medial: medial
  # Filled into warnings.out_of_range (SPEC.md 8.2).
  out_of_range:
    below: the lightest filament was already rated at or above the target
    above: the heaviest filament was still rated below the target
  stage1:
    # Why a touch-calibration estimate failed its quality check (SPEC.md 9). Says what kind of
    # failure, never a rating.
    flat: flat
    non_monotonic: not rising with pressure
    poor_residuals: noisy
    bracket_unusable: no range between the two settings
    unreachable: targets outside what the garment can deliver
    empty_window: no pleasantness range left inside the garment's limits

phases:
  setup: Setup
  touch_calibration: Touch calibration
  pre_sensitisation: Pre-sensitisation
  sensitisation: Heat sensitisation
  capsaicin: Capsaicin
  post_sensitisation: Post-sensitisation
  intervention: Intervention
  rekindle: Rekindle
  post_intervention: Post-intervention
  session_end: Session end

instructions:
  # SPEC.md 11: what to do now, alongside the zone diagram.
  monofilament: >-
    Approach perpendicular from about 3 cm. Bend the filament to about three-quarters of its
    extended length, hold for about 1 s, no lateral movement, then remove slowly. Keep the
    site out of the participant's view.
  # Filaments are named by the gram label printed on them (SPEC.md 8.1), with the force after.
  apply_filament: Apply the {filament} g filament ({force_mn} mN) at site {site}, {region} zone.
  # One stroke of about 2 cm, never repeated: repetition raises pain (docs/research/RB2).
  apply_brush: Brush the {region} zone at site {site} -- one single stroke of about 2 cm.
  mapping_path: Map path {path}. Step inward 5 mm on each cue and stop when the participant signals.
  # Read aloud before the first path. The mapping is instructed verbally and the participant
  # answers verbally, so this is the only place the wording exists -- there is no participant
  # mapping screen. Examples of the change are Bilaga 1's own ("burning", "tenderness", "more
  # intense pricking"); keep them, they are what the plan says participants are told.
  mapping_script: >-
    Say aloud: "I will touch you with this filament, moving a small step at a time towards the
    marked area. Tell me as soon as the feeling clearly changes — burning, tenderness, or a
    sharper pricking."
  mapping_distances: Measure each border from the centre of the primary zone, and enter the four distances in mm whenever convenient. This never blocks the session.
  fit_garment: Fit the garment and confirm all five channels are seated.
  thermode_start: Start the thermode at 50 °C. The software times the phase and does not command the device.
  thermode_rekindle: Rekindle now. The garment has been deactivated and will be reactivated afterwards.
  capsaicin_apply: Apply 0.075 % capsaicin.
  # SPEC.md 7.4, 8.3: the software times, the experimenter launches.
  ready: Ready. Press Start block when the participant is ready.
  mapping_ready: Path {path} of {value}. Press Start block to start the pacing cue, and again to stop it at the border.
  await_participant: Waiting for the participant's response.
  response_received: Response received.
  # Setup and touch calibration (SPEC.md 9, 10.7, 10.9). None names a pattern or a condition.
  masking_check: 'Audio setup: the participant is setting the noise level against the garment.'
  earplugs: Fit the earplugs under the headphones, then press Proceed.
  stop_rehearsal: >-
    Stop rehearsal: the participant will now press the stop button. When the stop screen shows,
    press Resume. Press Proceed only if they cannot press it.
  stop_rehearsal_resume: The stop was detected. Press Resume to carry on in front of the participant.
  touchcal_bracket: 'Touch calibration, step 1: the participant sets the touch on the middle channel.'
  touchcal_estimation: 'Touch calibration, step 2: the participant rates a series of touches.'
  touchcal_match: 'Touch calibration, step 3: the participant matches channel {channel} to the middle channel.'
  touchcal_equalise: 'Touch calibration, step 4: the participant compares channel {channel} with the middle channel.'
  touchcal_pleasantness: 'Touch calibration, step 5: the participant sets the most pleasant level.'
  touchcal_evenness: 'Touch calibration: the participant is asked whether the movement feels even.'
  touchcal_preference: 'Touch calibration, step 6: the participant chooses a kind of touch.'
  touchcal_fit_review: The touch-calibration estimate is ready. Accept it, or re-run the procedure.
  touchcal_stage1_failed: >-
    The touch-calibration estimate failed its quality check ({value}). Re-run the procedure, or
    accept it to continue with the estimate flagged.
  touchcal_stage1_unusable: >-
    The touch-calibration estimate cannot be used ({value}). Re-run the procedure, or abort the
    session.
  touchcal_stage1_exhausted: >-
    The touch-calibration estimate cannot be used ({value}) and the re-run limit is reached.
    Accept to continue on a fallback that is recorded as not valid for analysis, or abort the
    session.
  touchcal_gain_undefined: >-
    Channel {channel} was matched at 0 kPa again. Rebalance to repeat the match, or proceed
    with this channel at the middle channel's pressure, which is recorded as not valid for
    analysis.
  touchcal_uneven: >-
    The participant reports the movement as uneven along the arm. Rebalance the channels, or
    proceed.
  # Shown at the start of every touch delivery in EVERY condition, and nothing else is: only
  # one condition is self-started, so any line about starting it would name that condition
  # (SPEC.md 16). A test holds the experimenter screen identical across the three.
  touch_start: 'Touch: the garment is being started.'

controls:
  start_block: Start block
  pause: Pause
  resume: Resume
  discard_repeat: Discard and repeat last trial
  abort: Abort session
  note: Timestamped note
  connect: Connect garment
  disconnect: Disconnect garment
  rebalance: Rebalance channels
  # SPEC.md 11.1, shown only when fit_preview.enabled.
  fit_accept: Accept this estimate
  fit_rerun: Re-run the procedure

status:
  connected: Connected
  disconnected: Disconnected
  channel_pressure: 'Channel {channel}: {value} kPa'
  elapsed: Session elapsed {time}
  next_event: 'Next: {phase} in {time}'
  block_due: Block {block} is due.
  block_overdue: Block {block} is OVERDUE.
  discarded: Last trial discarded. It will be repeated.
  discarded_not_repeated: >-
    Last trial discarded. The application limit has been reached, so it will not be repeated.

warnings:
  # Warn-and-continue, never block (SPEC.md 7.3, 11, 14.1).
  experimenter_changed: >-
    These initials differ from earlier sessions for this participant. Bilaga 1 3.3 asks for the
    same experimenter throughout. The session will continue and the deviation is recorded.
  cloud_sync: >-
    The data folder is inside a cloud-synced tree ({value}). This is recorded in the session
    file. Move the data to a local folder if you can.
  filaments_unweighed: >-
    No measured filament forces. Nominal forces deviate from measured by up to about 20 %
    (Berquin et al. 2010). Weigh the set in Instruments and environment before collecting data.
  open_items: 'Unresolved configuration placeholders: {value}'
  out_of_range: >-
    The calibration ran out of ladder ({value}). The boundary filament will be used and the
    trial is flagged. Expect this in a meaningful fraction of sessions.
  application_cap: >-
    The limit of {value} applications was reached. The best available estimate is used and
    flagged.
  substitution_unknown: No filament labelled {filament} g is held. The substitution was not recorded.
  substitution_not_lower: >-
    The {filament} g filament is not lighter than the one asked for. It is recorded as applied.
  distance_implausible: >-
    Path {path}: {value} mm is outside the plausible range. Enter the same value again to
    confirm it, or enter the corrected value.
  catch_trials_felt: >-
    More than the allowed share of zero-pressure catch trials were reported as felt ({value}).
  schedule: 'Schedule warning, block {block}: {value}'
  no_response: No response for {value} s.
  # SPEC.md 10.7 step 5. Raising the noise has stopped helping, so the remedy is physical.
  # Audible as well as on screen: the experimenter may be looking at the participant.
  masking_failed: >-
    The participant can still hear the garment and the noise cannot be raised further. Offer
    earplugs under the headphones. The noise has stopped so you can talk, and the check will
    start again from the beginning once they are fitted.
  masking_failed_after_earplugs: >-
    Still audible with earplugs. The session will continue and is recorded as not fully masked.
  equalisation_mismatch: >-
    Channel {channel} still does not match the middle channel after re-adjustment. The session
    continues and this is recorded.

banners:
  # SPEC.md 12.4: persistent and unmissable. A session run this way must be impossible to
  # mistake for a real one afterwards.
  reduced_capability: >-
    THIS SESSION IS NOT COLLECTING VALID TOUCH-CALIBRATION DATA. The connected device
    ({value}) cannot set pressure per channel. Timings are real; pressures are not.
  placeholder_text: >-
    PARTICIPANT SCREENS STILL CONTAIN PLACEHOLDER TEXT. Do not run a real participant.
  # SPEC.md 11.1. Unmissable, because the experimenter must not switch this on without seeing
  # what it costs.
  fit_preview: >-
    FIT PREVIEW IS ON. You will see the participant's ratings, which Bilaga 1 3.3 says you will
    not and the participant information sheet says you do not. This session is recorded as
    unblinded in that respect.

dialogs:
  abort_confirm: Abort this session? All data collected so far is kept.
  abort_reason: Reason for aborting
  resume_found: An unfinished session was found for this participant, started {time} ago. Resume it?
  distances_outstanding: Mapping distances are still outstanding. Enter them now, or close the session with them flagged missing.
  fit_rerun_reason: Why are you re-running? Recorded with the discarded estimate, which is kept.
  fit_rerun_exhausted: The re-run limit for this procedure has been reached. This estimate will be used.
  error: Error