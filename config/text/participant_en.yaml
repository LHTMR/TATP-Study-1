# Every participant-facing string, English. SPEC.md 10.4: no user-facing string in any .py
# file, and a missing key is a startup error, never a silent fallback to the other language.
#
# BLINDING (SPEC.md 16). Nothing in this file may state or imply that touch is expected to
# relieve pain, name the research environment, or distinguish one condition from another.
# Tests assert that the forbidden terms do not appear here.
#
# Strings beginning `PLACEHOLDER` are NOT approved wording. They are the screens SPEC.md 10.6
# does not supply, which are bound by Bilaga 1 and the participant-facing ethics attachments
# (open item L4). Startup warns while any remain; they cannot reach a participant unnoticed.

meta:
  language: en
  # S approves the participant-facing wording. Where an ethics document supplies wording it is
  # used; otherwise S decides. Renamed from `verified_against_ethics`, which overstated it --
  # this is approval, not a document-by-document check.
  wording_approved: 2026-08-23     # SPEC.md 20 item 12
  instructions_supplied: 2026-08-23  # open item L4

vas:
  # SPEC.md 10.6. Anchors are placed at their percentage along the line; the marker is hidden
  # until the first press. No numbers, no tick marks beyond these anchors (SPEC.md 10.2).
  pain:
    question: How painful was the stimulus that you just felt on your hand?
    anchors:
      - {pct: 0.0, label: not at all painful}
      - {pct: 10.0, label: just painful}
      - {pct: 100.0, label: extremely painful}
  intensity:
    question: How intense is the current touch from the garment?
    anchors:
      - {pct: 0.0, label: no sensation at all}
      - {pct: 10.0, label: just noticeable}
      - {pct: 90.0, label: just uncomfortable}
      - {pct: 100.0, label: very intense}
  pleasantness:
    question: How pleasant is the current touch from the garment?
    anchors:
      - {pct: 0.0, label: very unpleasant}
      - {pct: 100.0, label: very pleasant}
  relaxation:
    # RSQ item 6 (Steghaus & Poth 2022), adapted to a VAS. SPEC.md 10.6.
    question: How accurately does the following statement describe how you feel right now?
    statement: I'm feeling very relaxed.
    anchors:
      - {pct: 0.0, label: completely disagree}
      - {pct: 100.0, label: completely agree}
  alertness:
    # RSQ item 10 (R).
    question: How accurately does the following statement describe how you feel right now?
    statement: I'm feeling refreshed and awake.
    anchors:
      - {pct: 0.0, label: completely disagree}
      - {pct: 100.0, label: completely agree}

# DRAFT (LOG N7.F7a): written by the build, not ethics-sourced
# The VAS training's practice rating (SPEC.md 10.6), one key per trained scale: a scale with a
# key here is trained, and every key must be a scale. Shown below the scale, which is drawn as
# it is rated, once the experimenter has explained the anchors and proportionality aloud -- the
# proportionality sentence itself is now the experimenter's (`say.proportionality`, S's
# lab-run list, 5 Oct 2026). Free placement, no target: a target would teach a position on the
# line rather than a judgement of a sensation (docs/research/R35). The same words for every
# scale, so nothing on it differs between the scales or the sessions.
training:
  pain: &practice >-
    Practice: move the marker with the two large buttons, both ways, then press ▶. This
    practice is not a rating.
  intensity: *practice
  pleasantness: *practice

# DRAFT (LOG N7.F11c3): written by the build, not ethics-sourced
# Below the scale, where the practice line will be, while the experimenter explains the scale
# aloud (`training` above is the second step). Without it the participant had a scale and no
# way to tell that nothing was asked of them yet.
training_listen: Listen to the experimenter.

# DRAFT (LOG N7.F12g1): written by the build, not ethics-sourced
# The visual warning cue before every stimulus (SPEC.md 10.5), alone on the screen at the
# message position, with the tone over the noise. Replaces the filled circle (S, 15 Oct 2026),
# which signalled the same start. The estimation run's zero-pressure catch trials are cued
# exactly as real trials are, by design (SPEC.md 9; Berquin et al. 2010): what keeps them valid
# is that the cueing is identical, not what the cue says. Nothing about relief, and the same in
# every condition.
warning_cue: Get ready

screens:
  # Approved 23 Aug 2026. Vocabulary follows Bilaga 3a, which describes the skin testing as
  # "tunna plastfilament" and "en mjuk pensel" and never as pinpricks -- a participant screen
  # may not describe the study in words the consent document does not use.
  #
  # There is no `mapping` key. The area mapping is instructed verbally and the participant
  # signals verbally (SPEC.md 8.4); the experimenter's script is `instructions.mapping_script`
  # in experimenter_{sv,en}.yaml. The participant screen shows `standby` throughout.
  # S's wording, 16 Oct 2026 (LOG N7.F14a). Says only what comes next, the stop rehearsal's
  # touch: the buttons and the scale are explained by `practice_intro`, when a scale is first
  # on the screen.
  welcome: |-
    Welcome.
    Next you will feel a touch on your arm.

    Press ▶ when you are ready.
  # S's wording, 16 Oct 2026 (LOG N7.F14a), moved here from `welcome`. Shown once per session,
  # before the first rating-scale practice.
  practice_intro: |-
    Next you will practise using the rating scale.
    The two large buttons move the marker along the line.
    ▶ confirms your answer.
    There are no right answers — mark what you feel. The experimenter does not see your answers.

    Press ▶ to start the practice.
  # The first screen of a session, up while the garment is fitted and before the welcome. S's
  # wording, 30 Sep 2026 (LOG N7.F3).
  # (LOG N7.F11c11: the Swedish was reworded; this English is S's, unchanged.)
  session_starting: The session will start shortly.
  # DRAFT (LOG N7.F11c8): written by the build, not ethics-sourced. Shown through every wait --
  # the heat, the capsaicin, the gaps between blocks, the experimenter's decisions -- so it may
  # not promise that anything starts "shortly", which by the second time is untrue. Nor that
  # nothing is asked: the area mapping shows it while the participant says when the feeling
  # changes, as the experimenter instructs aloud.
  standby: |-
    Rest for now.
    The experimenter will tell you what comes next.
  session_end: |-
    That is the end of today's visit.
    Thank you.
    Please wait for the experimenter.
  paused: |-
    Paused.
    The session continues shortly.
  emergency_stop: |-
    Stopped.
    The touch has been switched off.
    Please wait for the experimenter.
  # Shown in the participant-preferred condition only (SPEC.md 12.3). The agentive wording is
  # part of that condition's manipulation, not incidental phrasing: it says the touch starts
  # BECAUSE the participant pressed. Do not soften it to "press to continue".
  self_start: Press ▶ when you're ready for the touch to start.
  # SPEC.md 10.9, the emergency stop rehearsal. Approved by S 10 Sep 2026 and copied from the
  # spec verbatim; S shortened "at any time, in any part of the visit" to "at any time" on
  # 5 Oct 2026. The first is drawn with the stop button under it -- "this button" points at
  # it; the screen between the two is the real `emergency_stop`, unchanged.
  stop_rehearsal: |-
    The touch is running now.
    Press this button to stop it.
    Nothing is lost — we carry straight on afterwards.
  stop_rehearsal_done: |-
    That is the stop button.
    It works at any time.

    Press ▶ to continue.
  # The task introductions (LOG N7.F11c1), the build's drafts of 15 Oct 2026 and not part of
  # the 23 Aug 2026 approval above; each is marked DRAFT on its own key.
  # One before each new kind of task in touch calibration and before the baseline ratings
  # (15 Oct 2026 pilot review: seven tasks ran back to back with nothing saying the task had
  # changed). The same in every session and condition. Nothing about how strong any touch will
  # be: the estimation run's catch trials must stay unannounced.
  # `intro_bracket` names the anchors in the order `touch_calibration.anchor_prompt_keys` asks
  # for them, which a test holds it to.
  # DRAFT (LOG N7.F11c1): written by the build, not ethics-sourced
  intro_bracket: |-
    Next you set how strong the touch is, with the two large buttons.
    First until it is just noticeable, then until it is just uncomfortable.

    Press ▶ to start.
  # Not "a series of touches ... while you feel it": the run includes presentations with no
  # pressure (catch trials), and saying each is a touch to be felt would prime a report of one,
  # which is what `catch_felt_fraction` measures. The scale's own question and its "no sensation
  # at all" anchor then let an empty period be rated as it is felt.
  # DRAFT (LOG N7.F11c1): written by the build, not ethics-sourced
  intro_estimation: |-
    Next comes a series of short periods, one at a time.
    Rate each one on the line.

    Press ▶ to start.
  # DRAFT (LOG N7.F11c1): written by the build, not ethics-sourced
  intro_match: |-
    Next, two touches take turns in two places on your arm.
    Set the second so that it feels as strong as the first.

    Press ▶ to start.
  # DRAFT (LOG N7.F11c1): written by the build, not ethics-sourced
  intro_compare: |-
    Next you will feel two touches, one after the other, and choose which felt stronger.

    Press ▶ to start.
  # DRAFT (LOG N7.F11c1): written by the build, not ethics-sourced
  intro_pleasant: |-
    Next the touch moves along your arm.
    Set it so that it feels as pleasant as possible.

    Press ▶ to start.
  # No count: `touch_block.baseline_scales` says how many.
  # DRAFT (LOG N7.F11c1): written by the build, not ethics-sourced
  intro_baseline: |-
    Next, some questions about how you feel right now.

    Press ▶ to start.

participant_controls:
  # Named for the participant's own buttons, because `controls:` in the experimenter files is
  # already that role's button labels -- one key meaning two things is a trap for a later reader.
  #
  # Screens that draw the two large buttons with a label under each, an opening line above them
  # and a confirm sentence below (UI_PRINCIPLES.md 5.8). These keep a confirm, unlike `choices`,
  # because the press is not the answer: it moves something the participant then commits to.
  #
  # Both were approved 23 Aug 2026 as text screens. What went, on 10 Sep 2026, is only the
  # sentence naming the buttons -- "Left button: ... Right button: ..." and "Use the two large
  # buttons to move between them" -- which the drawn buttons replace. The play button is not
  # drawn, so every confirm line still names it in words.
  adjust:
    # SPEC.md 9 and 10.3. The opening line is the target, from `adjust_targets`.
    left: Weaker
    right: Stronger
    confirm: Press ▶ when it feels right.
  preference:
    # SPEC.md 9 step 6, the preference selection.
    intro: You will feel a few different kinds of touch.
    left: Previous
    right: Next
    confirm: Press ▶ to choose the one you like best.

choices:
  # Two-alternative screens where the buttons are DRAWN and the press itself is the answer
  # (SPEC.md 10.8, UI_PRINCIPLES.md 5.8-5.12). Each has a question and the two option labels,
  # which are written on the drawn buttons -- so an option label is a phrase, not a sentence.
  #
  # The affirmative or first-mentioned option is on the LEFT throughout (SPEC.md 10.7).
  comparison:
    # SPEC.md 9 step 4. Approved 23 Aug 2026 as a text screen; what has gone since is only the
    # two lines the drawn buttons replace -- "Left button: the first. Right button: the second."
    # and "Press ▶ to confirm." The question is unchanged.
    # (LOG N7.F11c11: the Swedish was reworded; this English is unchanged.)
    question: |-
      Two touches, one after the other.
      Which felt stronger?
    left: The first
    right: The second
  # DRAFT (LOG N7.C1): written by the build, not ethics-sourced
  evenness:
    # SPEC.md 9, the end-of-calibration evenness check, asked while the pattern plays. "The
    # movement" is how the check is phrased in the spec and the comparison document (7.4).
    question: Does the movement feel even along your arm?
    left: Yes, it feels even
    right: No, it feels uneven

audio_setup:
  # SPEC.md 10.7, the masking check. Drafted 23 Aug 2026 on S's instruction and APPROVED by S
  # the same day. Not ethics-sourced wording like the VAS questions -- practical instruction
  # about the headphones, which is why S approves it directly.
  #
  # The word for the noise is "hiss" rather than "white noise": the participant has to turn it
  # up until it covers a sound, and needs to know what they are listening for, not what it is
  # called. Nothing here says why the noise is there, because the reason is that the garment
  # must not be identifiable by ear -- which is a blinding matter (SPEC.md 16).
  #
  # `find_level`: S changed "until you can just hear it" to "until you can hear it easily" on
  # 5 Oct 2026, because "just" made it a threshold task.
  # DRAFT (LOG N7.F11c6): written by the build, not ethics-sourced. The first line said a hiss
  # could be heard, but the noise starts below audibility (`audio.white_noise_start_dbfs`), so
  # the first presses changed nothing the participant could hear.
  find_level: |-
    A hiss is playing in the headphones, too quietly to hear at first.
    Left button: quieter. Right button: louder.
    Turn it up until you can hear it easily, then press ▶.
  # (LOG N7.F11c11: the Swedish was reworded; this English is unchanged.)
  # DRAFT (LOG N7.F6c): written by the build, not ethics-sourced. The question "Can you still
  # hear the garment?" was its own screen until 5 Oct 2026, which S found confusing; it is now
  # this screen's own instruction, and ▶ is the answer that the hiss covers it. A participant
  # who can still hear the garment says so, and the experimenter offers earplugs (SPEC.md
  # 10.7). The button line is repeated from `find_level` so turning down is not left implicit.
  mask_level: |-
    The garment is working now, and you may be able to hear it.
    Left button: quieter. Right button: louder.
    Turn the hiss up until it covers that sound, but stop before the hiss itself becomes uncomfortable.
    If you can still hear the garment, tell the experimenter.
    Press ▶ when the hiss covers it.
  settled: |-
    That is the sound level set for today.
    It stays the same for the rest of the visit.

    Press ▶ to continue.

adjust_targets:
  # The target for each method-of-adjustment step (SPEC.md 9), shown above the `screens.adjust`
  # frame. Every target is a labelled anchor of the scale in question -- the participant is
  # asked for a sensation the scale names, never for a position on a line. That is why the
  # intensity anchors are 10 % and 90 %: P30 and P80 are interpolated, not adjusted to.
  just_noticeable: Set the touch so that it is just noticeable.
  just_uncomfortable: Set the touch so that it is just uncomfortable.
  match: Set the second touch so that it feels as strong as the first.
  most_pleasant: Set the touch so that it feels as pleasant as possible.