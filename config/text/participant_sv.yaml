# Varje deltagarvänd sträng, svenska. SPEC.md 10.4.
#
# BLINDNING (SPEC.md 16). Ingenting här får ange eller antyda att beröring förväntas lindra
# smärta, namnge forskningsmiljön eller skilja en betingelse från en annan.
#
# Formuleringarna under `vas:` är utkast från SPEC.md 10.6 och ska kontrolleras mot de
# deltagarvända etikbilagorna före första användning (SPEC.md 20 punkt 12). Kollegor granskar
# svenskan under piloteringen.
#
# Strängar som börjar med PLACEHOLDER är INTE godkänd text -- se motsvarande engelska fil.

meta:
  language: sv
  # S godkänner de deltagarvända formuleringarna. Där ett etikdokument anger en formulering
  # används den; i övrigt avgör S. Omdöpt från `verified_against_ethics`, som lovade för
  # mycket -- det här är ett godkännande, inte en dokumentgenomgång.
  wording_approved: 2026-08-23     # SPEC.md 20 punkt 12
  instructions_supplied: 2026-08-23  # öppen punkt L4

vas:
  pain:
    question: Hur smärtsamt var det du just kände på handen?
    anchors:
      - {pct: 0.0, label: inte alls smärtsamt}
      - {pct: 10.0, label: precis smärtsamt}
      - {pct: 100.0, label: extremt smärtsamt}
  intensity:
    question: Hur intensiv är beröringen från plagget just nu?
    anchors:
      - {pct: 0.0, label: ingen känsla alls}
      - {pct: 10.0, label: precis märkbar}
      - {pct: 90.0, label: precis obehaglig}
      - {pct: 100.0, label: mycket intensiv}
  pleasantness:
    # Symmetrisk skala, en avvikelse från Bilaga 1 3.9.1 som anger "unpleasant" till
    # "very pleasant". Beslutat 22 aug 2026 (SPEC.md 10.6).
    question: Hur behaglig är beröringen från plagget just nu?
    anchors:
      - {pct: 0.0, label: mycket obehaglig}
      - {pct: 100.0, label: mycket behaglig}
  relaxation:
    # RSQ punkt 6, översatt från det tyska originalet "Ich fühle mich sehr entspannt."
    question: Hur väl stämmer följande påstående med hur du känner dig just nu?
    statement: Jag känner mig mycket avslappnad.
    anchors:
      - {pct: 0.0, label: instämmer inte alls}
      - {pct: 100.0, label: instämmer helt}
  alertness:
    # RSQ punkt 10 (R), från "Ich fühle mich erfrischt und wach." Tyskans *erfrischt* är
    # uppiggad, inte utvilad, därför "pigg och vaken" (SPEC.md 10.6).
    question: Hur väl stämmer följande påstående med hur du känner dig just nu?
    statement: Jag känner mig pigg och vaken.
    anchors:
      - {pct: 0.0, label: instämmer inte alls}
      - {pct: 100.0, label: instämmer helt}

# DRAFT (LOG N7.F7a, N7.F16b): written by the build, not ethics-sourced. Sista meningen
# översatt från S:s engelska (20 okt 2026).
# Övningsskattningen i VAS-övningen (SPEC.md 10.6), en nyckel per övad skala: en skala med en
# nyckel här övas, och varje nyckel måste vara en skala. Visas under skalan, som ritas som den
# skattas, när försöksledaren har förklarat etiketterna och proportionaliteten muntligt --
# proportionalitetsmeningen är nu försöksledarens (`say.proportionality`, S:s lista efter
# labbkörningen 5 okt 2026). Fri placering, inget mål (docs/research/R35). Samma ord för varje
# skala, så att ingenting skiljer sig mellan skalor eller besök.
training:
  pain: &practice >-
    Övning: flytta markören med de två stora knapparna, åt båda hållen, och tryck sedan på ▶.
    Den här skattningen sparas inte.
  intensity: *practice
  pleasantness: *practice

# DRAFT (LOG N7.F11c3): written by the build, not ethics-sourced
# Under skalan, där övningsraden sedan står, medan försöksledaren förklarar skalan muntligt.
training_listen: Lyssna på försöksledaren.

# DRAFT (LOG N7.F12g1): written by the build, not ethics-sourced
# Den visuella varningssignalen före varje stimulus (SPEC.md 10.5), ensam på skärmen där
# meddelanden står, med tonen över bruset. Ersätter cirkeln (S, 15 okt 2026), som signalerade
# samma start. Skattningsseriens försök utan tryck signaleras med avsikt precis som de verkliga
# (SPEC.md 9; Berquin m.fl. 2010): det som håller dem giltiga är att signaleringen är identisk,
# inte vad signalen säger. Inget om lindring, och samma i alla betingelser.
warning_cue: Gör dig redo

screens:
  # Godkänd 23 aug 2026. Ordvalen följer Bilaga 3a, som beskriver hudmätningen som "tunna
  # plastfilament" och "en mjuk pensel" och aldrig som nålstick -- en deltagarskärm får inte
  # beskriva studien med ord som samtyckesdokumentet inte använder.
  #
  # Det finns ingen `mapping`-nyckel. Kartläggningen instrueras muntligt och deltagaren
  # markerar muntligt (SPEC.md 8.4); försöksledarens manus är `instructions.mapping_script` i
  # experimenter_{sv,en}.yaml. Deltagarskärmen visar `standby` under tiden.
  # S:s lydelse, 16 okt 2026 (LOG N7.F14a). Säger bara vad som kommer härnäst, beröringen i
  # övningen med stoppknappen: knapparna och skalan förklaras av `practice_intro`, när en skala
  # först visas.
  welcome: |-
    Välkommen.
    Härnäst kommer du att känna en beröring på armen.

    Tryck på ▶ när du är redo.
  # S:s lydelse, 16 okt 2026 (LOG N7.F14a), flyttad hit från `welcome`. Visas en gång per
  # session, före den första övningen med skattningsskalan.
  practice_intro: |-
    Härnäst får du öva på att använda skattningsskalan.
    De två stora knapparna flyttar markören längs linjen.
    ▶ bekräftar ditt svar.
    Det finns inga rätta svar – markera det du känner. Försöksledaren ser inte dina svar.

    Tryck på ▶ för att börja övningen.
  # The first screen of a session, up while the garment is fitted and before the welcome.
  # DRAFT (LOG N7.F11c11): written by the build, not ethics-sourced. "Sessionen" is not how
  # the visit is spoken of to a participant.
  session_starting: Vi börjar snart.
  # DRAFT (LOG N7.F11c8): written by the build, not ethics-sourced. Visas under varje väntan,
  # så den får inte lova att något börjar "snart" -- och inte heller att ingenting begärs:
  # kartläggningen visar den medan deltagaren säger till när känslan ändras.
  standby: |-
    Vila så länge.
    Försöksledaren berättar vad som händer härnäst.
  # S:s lydelse, 16 okt 2026 (LOG N7.F14d). Ett uppehåll mellan två stimuli längre än
  # `cues.please_wait_min_s`, så att pausen ser avsiktlig ut och inte som ett fel.
  please_wait: Vänta.
  session_end: |-
    Då är dagens besök slut.
    Tack.
    Vänta kvar tills försöksledaren kommer.
  paused: |-
    Pausad.
    Sessionen fortsätter snart.
  emergency_stop: |-
    Stoppat.
    Beröringen är avstängd.
    Vänta kvar tills försöksledaren kommer.
  # Visas endast i den deltagarvalda betingelsen (SPEC.md 12.3). Den agentiva formuleringen är
  # en del av den betingelsens manipulation, inte en tillfällig ordvändning: den säger att
  # beröringen börjar FÖR ATT deltagaren tryckte. Mildra den inte till "tryck för att fortsätta".
  self_start: Tryck på ▶ när du är redo att beröringen ska börja.
  # SPEC.md 10.9, övningen med nödstoppet. Godkänd av S 10 sep 2026 och ordagrant kopierad från
  # specifikationen. Den första ritas med stoppknappen under sig -- "den här knappen" pekar på
  # den; skärmen mellan de två är den riktiga `emergency_stop`, oförändrad.
  stop_rehearsal: |-
    Beröringen är igång nu.
    Tryck på den här knappen för att stänga av den.
    Ingenting går förlorat — vi fortsätter direkt efteråt.
  # DRAFT (LOG N7.F6a): written by the build, not ethics-sourced. S kortade 5 okt 2026 "at
  # any time, in any part of the visit" till "at any time"; "Den fungerar när som helst." är
  # byggets översättning.
  stop_rehearsal_done: |-
    Det där är stoppknappen.
    Den fungerar när som helst.

    Tryck på ▶ för att fortsätta.
  # Introduktionerna till uppgifterna (LOG N7.F11c1) är byggets utkast från 15 okt 2026 och
  # ingår inte i godkännandet 23 aug 2026 ovan; var och en är märkt DRAFT på sin egen nyckel.
  # En före varje ny sorts uppgift i beröringskalibreringen och före baslinjeskattningarna.
  # Samma i varje besök och betingelse. Ingenting om hur stark någon beröring blir: de tomma
  # försöken i skattningsserien får inte förvarnas.
  # DRAFT (LOG N7.F11c1): written by the build, not ethics-sourced
  intro_bracket: |-
    Nu ställer du själv in hur stark beröringen är, med de två stora knapparna.
    Först tills den är precis märkbar, sedan tills den är precis obehaglig.

    Tryck på ▶ för att börja.
  # Inte "en serie beröringar": serien har tomma försök utan tryck, och de får inte utlovas som
  # beröringar (se den engelska filen).
  # DRAFT (LOG N7.F11c1): written by the build, not ethics-sourced
  intro_estimation: |-
    Nu kommer en serie korta perioder, en i taget.
    Skatta var och en på linjen.

    Tryck på ▶ för att börja.
  # DRAFT (LOG N7.F11c1): written by the build, not ethics-sourced
  intro_match: |-
    Nu turas två beröringar om på två ställen på armen.
    Ställ in den andra så att den känns lika stark som den första.

    Tryck på ▶ för att börja.
  # DRAFT (LOG N7.F11c1): written by the build, not ethics-sourced
  intro_compare: |-
    Nu känner du två beröringar, den ena efter den andra, och väljer vilken som kändes starkast.

    Tryck på ▶ för att börja.
  # DRAFT (LOG N7.F11c1): written by the build, not ethics-sourced
  intro_pleasant: |-
    Nu rör sig beröringen längs armen.
    Ställ in den så att den känns så behaglig som möjligt.

    Tryck på ▶ för att börja.
  # DRAFT (LOG N7.F11c1): written by the build, not ethics-sourced
  intro_baseline: |-
    Nu följer några frågor om hur du känner dig just nu.

    Tryck på ▶ för att börja.

participant_controls:
  # Namnet syftar på deltagarens egna knappar: `controls:` i försöksledarfilerna är redan den
  # rollens knappetiketter, och en nyckel som betyder två saker är en fälla för en senare läsare.
  #
  # Skärmar som ritar ut de två stora knapparna med en etikett under var, en inledande rad ovanför
  # och en bekräftelsemening under (UI_PRINCIPLES.md 5.8). Dessa har kvar ett bekräftelsesteg, till
  # skillnad från `choices`, eftersom trycket inte är svaret: det flyttar något som deltagaren
  # sedan bekräftar.
  #
  # Båda godkändes 23 aug 2026 som textskärmar. Det som utgick 10 sep 2026 är bara meningen som
  # namnger knapparna -- "Vänster knapp: ... Höger knapp: ..." och "Använd de två stora knapparna
  # för att växla mellan dem" -- som de utritade knapparna ersätter. Uppspelningsknappen ritas
  # inte ut, så varje bekräftelserad nämner den fortfarande i ord.
  adjust:
    # SPEC.md 9 och 10.3. Den inledande raden är målet, från `adjust_targets`.
    left: Svagare
    right: Starkare
    confirm: Tryck på ▶ när det känns rätt.
  preference:
    # SPEC.md 9 steg 6, valet av föredragen beröring.
    intro: Du får känna några olika sorters beröring.
    left: Föregående
    right: Nästa
    confirm: Tryck på ▶ för att välja den du tycker bäst om.
    # DRAFT (LOG N7.F16k): written by the build, not ethics-sourced
    position: '{position} av {count}'

choices:
  # Tvåvalsskärmar där knapparna RITAS ut och trycket i sig är svaret (SPEC.md 10.8,
  # UI_PRINCIPLES.md 5.8-5.12). Var och en har en fråga och de två alternativens etiketter, som
  # skrivs på de utritade knapparna -- en etikett är alltså en fras, inte en mening.
  #
  # Det jakande eller först nämnda alternativet ligger alltid till VÄNSTER (SPEC.md 10.7).
  comparison:
    # SPEC.md 9 steg 4. Godkänd 23 aug 2026 som textskärm; det som utgått sedan dess är bara de
    # två rader som de utritade knapparna ersätter -- "Vänster knapp: den första. Höger knapp:
    # den andra." och "Tryck på ▶ för att bekräfta." Frågan är oförändrad.
    # DRAFT (LOG N7.F11c11): written by the build, not ethics-sourced. "En i taget" sa inte att
    # de kommer i en ordning, vilket knapparna "Den första" och "Den andra" bygger på.
    question: |-
      Två beröringar, den ena efter den andra.
      Vilken kändes starkast?
    left: Den första
    right: Den andra
  # DRAFT (LOG N7.C1): written by the build, not ethics-sourced
  evenness:
    # SPEC.md 9, jämnhetskontrollen i slutet av kalibreringen, medan mönstret spelas.
    question: Känns rörelsen jämn längs armen?
    left: Ja, den känns jämn
    right: Nej, den känns ojämn

audio_setup:
  # SPEC.md 10.7, maskeringskontrollen. Utkast 23 aug 2026 på S:s instruktion, godkänt av S
  # samma dag. Inte etikförankrad formulering som VAS-frågorna, utan praktisk instruktion om
  # hörlurarna, vilket är därför S godkänner den direkt.
  #
  # "Brus" om ljudet, inte "vitt brus": deltagaren ska höja det tills det döljer ett ljud och
  # behöver veta vad hen lyssnar efter, inte vad det heter. Ingenting här säger varför bruset
  # finns, eftersom skälet är att plagget inte ska gå att känna igen på ljudet (SPEC.md 16).
  #
  # DRAFT (LOG N7.F6a): written by the build, not ethics-sourced -- the Swedish of S's
  # 5 Oct 2026 change, "until you can hear it easily" in place of "until you can just hear it",
  # because "precis" made it a threshold task.
  # DRAFT (LOG N7.F11c6): written by the build, not ethics-sourced. Bruset börjar under
  # hörtröskeln, så den första raden får inte påstå att det hörs.
  find_level: |-
    Ett brus spelas i hörlurarna, men först för svagt för att höras.
    Vänster knapp: svagare. Höger knapp: starkare.
    Höj det tills du lätt kan höra det, och tryck sedan på ▶.
  # DRAFT (LOG N7.F6c): written by the build, not ethics-sourced. Frågan "Hör du fortfarande
  # plagget?" var en egen skärm till 5 okt 2026, vilket S tyckte var förvirrande; nu är den
  # skärmens egen instruktion, och ▶ är svaret att bruset döljer ljudet. En deltagare som
  # fortfarande hör plagget säger det, och försöksledaren erbjuder öronproppar (SPEC.md 10.7).
  # Knappraden upprepas från `find_level` så att det framgår hur man sänker.
  # DRAFT (LOG N7.F11c11): written by the build, not ethics-sourced. "Plagget arbetar nu" är
  # inte naturlig svenska.
  mask_level: |-
    Plagget är igång nu, och du kanske kan höra det.
    Vänster knapp: svagare. Höger knapp: starkare.
    Höj bruset tills det döljer det ljudet, men sluta innan bruset i sig blir obehagligt.
    Om du fortfarande hör plagget, säg det till försöksledaren.
    Tryck på ▶ när bruset döljer det.
  settled: |-
    Då är ljudnivån inställd för idag.
    Den är densamma resten av besöket.

    Tryck på ▶ för att fortsätta.

adjust_targets:
  # Målet för varje justeringssteg (SPEC.md 9), visas ovanför ramen i `screens.adjust`. Varje mål
  # är ett etiketterat ankare på respektive skala -- deltagaren ombeds ställa in en förnimmelse
  # som skalan namnger, aldrig en position på en linje. Därför är intensitetsankarna 10 % och
  # 90 %: P30 och P80 interpoleras och justeras inte fram.
  just_noticeable: Ställ in beröringen så att den är precis märkbar.
  just_uncomfortable: Ställ in beröringen så att den är precis obehaglig.
  match: Ställ in den andra beröringen så att den känns lika stark som den första.
  most_pleasant: Ställ in beröringen så att den känns så behaglig som möjligt.