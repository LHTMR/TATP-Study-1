# Varje deltagarvänd sträng, svenska. SPEC.md 10.4.
#
# BLINDNING (SPEC.md 16). Ingenting här får ange eller antyda att beröring förväntas lindra
# smärta, namnge forskningsmiljön eller skilja en betingelse från en annan.
#
# Formuleringarna under `vas:` är utkast från SPEC.md 10.6 och ska kontrolleras mot de
# deltagarvända etikbilagorna före första användning (SPEC.md 20 punkt 12). Kollegor granskar
# svenskan under piloteringen.
#
# Strängar som börjar med PLACEHOLDER är INTE godkänd text -- se motsvarande engelska fil.

meta:
  language: sv
  verified_against_ethics: null    # SPEC.md 20 punkt 12 -- gäller VAS-formuleringarna, kvarstår
  instructions_supplied: 2026-08-23  # öppen punkt L4, godkänd av S

vas:
  pain:
    question: Hur smärtsamt var det du just kände på handen?
    anchors:
      - {pct: 0.0, label: inte alls smärtsamt}
      - {pct: 10.0, label: precis smärtsamt}
      - {pct: 100.0, label: extremt smärtsamt}
  intensity:
    question: Hur intensiv är beröringen från plagget just nu?
    anchors:
      - {pct: 0.0, label: ingen känsla alls}
      - {pct: 10.0, label: precis märkbar}
      - {pct: 90.0, label: precis obehaglig}
      - {pct: 100.0, label: mycket intensiv}
  pleasantness:
    # Symmetrisk skala, en avvikelse från Bilaga 1 3.9.1 som anger "unpleasant" till
    # "very pleasant". Beslutat 22 aug 2026 (SPEC.md 10.6).
    question: Hur behaglig är beröringen från plagget just nu?
    anchors:
      - {pct: 0.0, label: mycket obehaglig}
      - {pct: 100.0, label: mycket behaglig}
  relaxation:
    # RSQ punkt 6, översatt från det tyska originalet "Ich fühle mich sehr entspannt."
    question: Hur väl stämmer följande påståenden med hur du känner dig just nu?
    statement: Jag känner mig mycket avslappnad.
    anchors:
      - {pct: 0.0, label: instämmer inte alls}
      - {pct: 100.0, label: instämmer helt}
  alertness:
    # RSQ punkt 10 (R), från "Ich fühle mich erfrischt und wach." Tyskans *erfrischt* är
    # uppiggad, inte utvilad, därför "pigg och vaken" (SPEC.md 10.6).
    question: Hur väl stämmer följande påståenden med hur du känner dig just nu?
    statement: Jag känner mig pigg och vaken.
    anchors:
      - {pct: 0.0, label: instämmer inte alls}
      - {pct: 100.0, label: instämmer helt}

training:
  # Proportionalitetsinstruktion (Price et al. 1983), en gång per skala vid första användning.
  pain: Ett märke dubbelt så långt ut på linjen betyder att det gjorde dubbelt så ont.
  intensity: Ett märke dubbelt så långt ut på linjen betyder att beröringen kändes dubbelt så intensiv.
  pleasantness: Ett märke dubbelt så långt ut på linjen betyder att beröringen kändes dubbelt så behaglig.

screens:
  # Godkänd 23 aug 2026. Ordvalen följer Bilaga 3a, som beskriver hudmätningen som "tunna
  # plastfilament" och "en mjuk pensel" och aldrig som nålstick -- en deltagarskärm får inte
  # beskriva studien med ord som samtyckesdokumentet inte använder.
  #
  # Det finns ingen `mapping`-nyckel. Kartläggningen instrueras muntligt och deltagaren
  # markerar muntligt (SPEC.md 8.4); försöksledarens manus är `instructions.mapping_script` i
  # experimenter_{sv,en}.yaml. Deltagarskärmen visar `standby` under tiden.
  welcome: |-
    Välkommen.
    Studien handlar om behagliga och obehagliga kroppsförnimmelser – beröring och smärta.
    Du skattar det du känner genom att markera en punkt på en linje. Det finns inga rätta
    svar, och försöksledaren ser inte dina skattningar.

    Tryck på ▶ för att börja.
  standby: |-
    Vila en stund.
    Nästa del börjar snart.
  session_end: |-
    Då är dagens besök slut.
    Tack.
    Vänta kvar tills försöksledaren kommer.
  paused: |-
    Pausad.
    Sessionen fortsätter snart.
  emergency_stop: |-
    Stoppat.
    Beröringen är avstängd.
    Vänta kvar tills försöksledaren kommer.
  # Visas endast i den deltagarvalda betingelsen (SPEC.md 12.3). Den agentiva formuleringen är
  # en del av den betingelsens manipulation, inte en tillfällig ordvändning -- se
  # docs/participant_screen_text_draft.md.
  self_start: Tryck på ▶ när du är redo att beröringen ska börja.
  adjust: |-
    Vänster knapp: svagare. Höger knapp: starkare.
    Tryck på ▶ när det känns rätt.
  comparison: |-
    Två beröringar, en i taget.
    Vilken kändes starkast?
    Vänster knapp: den första. Höger knapp: den andra.
    Tryck på ▶ för att bekräfta.
  preference: |-
    Du får känna några olika sorters beröring.
    Använd de två stora knapparna för att växla mellan dem.
    Tryck på ▶ för att välja den du tycker bäst om.

adjust_targets:
  # Målet för varje justeringssteg (SPEC.md 9), visas ovanför ramen i `screens.adjust`.
  # Formulerat med ankaretiketterna från respektive skala där målet ligger på ett etiketterat
  # ankare. Punkterna 30 % och 80 % på intensitetsskalan saknar ankaretikett, så de stegen visar
  # skalan med målpunkten markerad och instruktionen hänvisar till den.
  just_noticeable: Ställ in beröringen så att den är precis märkbar.
  marked_point: Ställ in beröringen så att den motsvarar den markerade punkten på skalan.
  match: Ställ in den andra beröringen så att den känns lika stark som den första.
  most_pleasant: Ställ in beröringen så att den känns så behaglig som möjligt.