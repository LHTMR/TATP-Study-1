# Varje försöksledarvänd sträng, svenska. SPEC.md 10.4, 11.
#
# Försöksledarskärmen visar ALDRIG en deltagares skattning (Bilaga 1 3.3) och ALDRIG
# betingelsen eller det valda mönstret (SPEC.md 16).
#
# Platshållare inom klammer fylls i av programmet: {filament}, {force_mn}, {site}, {path},
# {region}, {channel}, {block}, {phase}, {time}, {value}.

meta:
  language: sv

session:
  # Identitetsraden överst i försöksledarfönstret (SPEC.md 11). Betingelsen saknas medvetet
  # och får aldrig läggas till (SPEC.md 16).
  participant: 'Deltagare {value}'
  session_number: 'Session {value}'
  limb: 'Målarm: {value}'
  experimenter: 'Försöksledare {value}'

terms:
  # Värden ur kontrollerade vokabulärer som förekommer inuti strängarna nedan, så att ett värde
  # som programmet håller på engelska -- en arm, en zon -- inte visas oöversatt.
  anchor_targets:
    just_noticeable: precis märkbar
    just_uncomfortable: precis obehaglig
  limbs:
    left: vänster
    right: höger
  regions:
    # Böjda så att de passar "{region} zonen" under instructions nedan.
    primary: primära
    secondary: sekundära
  # mapping.path_ids i study1.yaml, fylls i {path}.
  mapping_paths:
    proximal: proximal
    lateral: lateral
    distal: distal
    medial: medial
  # DRAFT (LOG N7.F18f): written by the build, not ethics-sourced. Kolumnrubrikerna i rutan
  # för avstånden, och banornas etiketter i kartläggningens diagram.
  mapping_paths_short:
    proximal: Prox.
    lateral: Lat.
    distal: Dist.
    medial: Med.
  # Fylls i warnings.out_of_range (SPEC.md 8.2).
  # DRAFT (LOG N7.F11b15): written by the build, not ethics-sourced. Förkortade så att
  # varningen ryms på statusraden.
  out_of_range:
    below: redan det lättaste nådde målet
    above: även det tyngsta låg under målet
  # De två sorternas interventionsblock, fylls i status.block_label. Samma i alla betingelser,
  # så namnen avslöjar ingenting (SPEC.md 16).
  block_types:
    pinprick: filament
    touch: beröring
  # Språkvalen i startfönstret, vart och ett på sitt eget språk.
  languages:
    sv: Svenska
    en: English
  # Plaggdrivrutinerna som startfönstret erbjuder (tatp/session.py DRIVERS). Namnger riggen,
  # aldrig en betingelse.
  garments:
    mock: Simulerat plagg (ingen hårdvara)
    arduino_mosfet: Prototypärmen (på/av; trycket ställs för hand)
  stage1:
    # Varför en skattning i beröringskalibreringen underkändes (SPEC.md 9). Anger vilken sorts
    # fel, aldrig en skattning.
    flat: platt
    non_monotonic: stiger inte med trycket
    poor_residuals: brusig
    bracket_unusable: inget intervall mellan de två inställningarna
    unreachable: mål utanför vad plagget kan ge
    empty_window: inget behaglighetsintervall kvar inom plaggets gränser

# Tidslinjen överst på skärmen (LOG N7.F16h): varje fas utom den pågående, förkortad, så att
# alla får plats på en rad. Den pågående står utskriven, med sitt namn under `phases`.
# DRAFT (LOG N7.F16h): written by the build, not ethics-sourced
timeline:
  setup: Förb.
  touch_calibration: Kalibr.
  pre_sensitisation: Före S
  sensitisation: Värme
  capsaicin: Caps.
  post_sensitisation: Efter S
  intervention: Interv.
  post_intervention: Efter I

phases:
  setup: Förberedelse
  touch_calibration: Beröringskalibrering
  pre_sensitisation: Före sensitisering
  sensitisation: Värmesensitisering
  capsaicin: Capsaicin
  post_sensitisation: Efter sensitisering
  intervention: Intervention
  rekindle: Återuppvärmning
  post_intervention: Efter intervention
  session_end: Sessionen avslutad
  # Inte faser i sessionen: vad nedräkningen kallar medan capsaicinet sitter på, och medan
  # återuppvärmningens värme är på. `capsaicin_removal` är också det schemalagda stegets namn i
  # loggen.
  # DRAFT (LOG N7.F11b17): written by the build, not ethics-sourced
  capsaicin_removal: Borttagning av capsaicin
  # DRAFT (LOG N7.F11b10): written by the build, not ethics-sourced
  rekindle_end: Slut på återuppvärmningen

# Stegen i varje fas, efter `session_runner.stage_key`: utskrivna i Hoppa till och för det
# pågående steget i raden under faserna, korta för de andra där (S, 21 okt 2026).
# DRAFT (LOG N7.F18d): written by the build, not ethics-sourced
stages:
  garment: Plagget på
  welcome: Välkommen
  stop_rehearsal: Övning med stoppknappen
  masking_check: Ljudinställning
  touch_calibration: Beröringskalibrering
  baseline: Utgångsskattningar
  mark_zone: Markera den primära zonen
  long: Filamentserie, sekundära zonen
  mapping: Kartläggning
  short_primary: Filament, primära zonen
  brush_secondary: Pensel, sekundära zonen
  brush_primary: Pensel, primära zonen
  sensitisation: Värme (tid noll)
  capsaicin_apply: Capsaicin på
  capsaicin_remove: Capsaicin av
  intervention_start: Interventionens start
  block: 'Block {block} ({type})'
  rekindle: Återuppvärmning
  intervention_end: Interventionens slut
  session_end: Sessionens slut
stages_short:
  garment: Plagg
  welcome: Välkommen
  stop_rehearsal: Stopp
  masking_check: Ljud
  touch_calibration: Kalibrering
  baseline: Utgång
  mark_zone: Markera
  long: Serie SH
  mapping: Kartl.
  short_primary: PH
  brush_secondary: Pensel SH
  brush_primary: Pensel PH
  sensitisation: Värme
  capsaicin_apply: Caps. på
  capsaicin_remove: Caps. av
  intervention_start: Start
  block: 'B{block}'
  rekindle: Återuppv.
  intervention_end: Slut
  session_end: Slut

# Över vad som ska göras nu (S, 21 okt 2026).
# DRAFT (LOG N7.F18d): written by the build, not ethics-sourced
headings:
  now: Nu
  prepare: Förbered
  wait: Vänta
  wait_for: 'Vänta · {time}'

instructions:
  # SPEC.md 11: vad som ska göras nu, bredvid zondiagrammet.
  #
  # Fylls i av `tatp.config.instruction`: {controls[...]} med knapparnas etiketter nedan, så
  # att en instruktion aldrig benämner en knapp på sitt eget sätt (LOG N7.F11b18); {say[...]}
  # med en mening ur `say:` på DELTAGARENS språk, eftersom den sägs till deltagaren (LOG
  # N7.F11b19); fjärrkontrollens knappsymboler ({confirm} ...) från hardware.yaml; och stegets
  # egna värden.
  monofilament: >-
    Applicera vinkelrätt från cirka 3 cm. Böj filamentet till ungefär tre fjärdedelar av dess
    utsträckta längd, håll kvar i cirka 1 s, ingen sidorörelse, lyft sedan långsamt. Håll
    appliceringsstället utom synhåll för deltagaren.
  # Filamenten benämns med gramsiffran som står tryckt på dem (SPEC.md 8.1). Var det ska är
  # zondiagrammet bredvid instruktionen, som markerar platsen (S, 21 okt 2026); kraften står i
  # data. Under "Förbered" medan deltagaren ser "Gör dig redo" (LOG N7.F16f).
  # DRAFT (LOG N7.F18e): written by the build, not ethics-sourced
  prepare_filament: 'Gör dig redo: filamentet {filament} g, som visas.'
  # DRAFT (LOG N7.F18e): written by the build, not ethics-sourced
  prepare_brush: 'Gör dig redo: penseln, som visas.'
  # Under "Nu", när förvarningen är slut. Trycket säger att det är applicerat, och skattningen
  # visas räknat från det (S, 20 okt 2026; LOG N7.F16f). S:s lydelse, 21 okt 2026.
  # DRAFT (LOG N7.F18e): written by the build, not ethics-sourced
  apply_filament: 'Applicera filamentet {filament} g som visas och tryck sedan på {controls[proceed]}.'
  # Ett drag på cirka 2 cm, aldrig upprepat: upprepning höjer smärtan (docs/research/RB2).
  # DRAFT (LOG N7.F18e): written by the build, not ethics-sourced
  apply_brush: 'Borsta en gång som visas, ett enda drag på cirka 2 cm, och tryck sedan på {controls[proceed]}.'
  # Under "Förbered", medan deltagaren skattar: nästa applicering, så att den är redo när
  # uppehållet är slut (S, 21 okt 2026). Aldrig vad skattningen blev.
  # DRAFT (LOG N7.F18e): written by the build, not ethics-sourced
  rating_next_filament: 'Deltagaren skattar. Härnäst: filamentet {filament} g, som visas.'
  # DRAFT (LOG N7.F18e): written by the build, not ethics-sourced
  rating_next_either: 'Deltagaren skattar. Härnäst: filamentet {lighter} g eller {heavier} g, beroende på skattningen.'
  # DRAFT (LOG N7.F18e): written by the build, not ethics-sourced
  rating_next_brush: 'Deltagaren skattar. Härnäst: penseln, som visas.'
  # DRAFT (LOG N7.F18e): written by the build, not ethics-sourced
  rating_next_open: 'Deltagaren skattar. Vad som kommer härnäst beror på skattningen.'
  # DRAFT (LOG N7.F18e): written by the build, not ethics-sourced
  rating_last: 'Deltagaren skattar seriens sista applicering.'
  # DRAFT (LOG N7.F11b8, N7.F14c): written by the build, not ethics-sourced. Det slumpade
  # uppehållet efter en skattning när ingen applicering följer: serien är slut. Svaret
  # rapporteras på statusraden (`received_*`).
  between_applications: 'Serien är klar. Det som kommer härnäst visas här.'
  # DRAFT (LOG N7.F11b8): written by the build, not ethics-sourced. Samma uppehåll efter en
  # kassering, som statusraden rapporterar, när ingen applicering följer.
  between_applications_discarded: 'Kasserat. Det som kommer härnäst visas här.'
  # DRAFT (LOG N7.F18e): written by the build, not ethics-sourced. Uppehållet före en
  # applicering, under "Vänta" med tiden som är kvar (S, 16 och 21 okt 2026).
  next_filament: 'Härnäst: filamentet {filament} g, som visas.'
  next_brush: 'Härnäst: penseln, som visas.'
  # DRAFT (LOG N7.F14c): written by the build, not ethics-sourced. Statusraden under det
  # uppehållet: appliceringen som just skattades, aldrig skattningen (Bilaga 3a:
  # försöksledaren ser inte deltagarens skattningar).
  received_filament: 'Svar mottaget: {filament} g.'
  received_brush: 'Svar mottaget: penseln.'
  # DRAFT (LOG N7.F11b11): written by the build, not ethics-sourced. {step} är
  # mapping.step_size_mm.
  mapping_path: 'Bana {path}: flytta filamentet {step} mm inåt vid varje taktsignal. Tryck på {controls[proceed]} när deltagaren säger till att känslan förändras, och markera gränsen på huden.'
  # Läses högt före första banan: `say.mapping`.
  mapping_script: 'Säg högt: "{say[mapping]}"'
  # DRAFT (LOG N7.F12g2): written by the build, not ethics-sourced. Inget om varningssignalen:
  # den är nu ord ("Gör dig redo"), som förklarar sig själva första gången de visas, så meningen
  # som cirkeln behövde (N7.F11b1) är borta.
