  rekindle_heating: Återuppvärmningen pågår. Ta bort termoden när nedräkningen är slut.
  # DRAFT (LOG N7.F11b10): written by the build, not ethics-sourced
  rekindle_remove: Ta bort termoden och tryck sedan på {controls[proceed]}. Plaggets beröring startar igen.
  # SPEC.md 7.4, 8.3: programmet tar tid, försöksledaren startar. En per sorts serie, och den
  # säger vad som snart ska appliceras (LOG N7.F11b7), med zonen i diagrammet bredvid och
  # antalet i förloppet (S, 21 okt 2026).
  # DRAFT (LOG N7.F18e): written by the build, not ethics-sourced
  ready_long: >-
    Förbered filamenten för en serie, med början på {filament} g. Tryck på {controls[proceed]}
