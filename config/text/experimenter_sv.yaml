  # DRAFT (LOG N7.F11b4): written by the build, not ethics-sourced
  earplugs: Du ställer in bruset igen från början, på samma sätt.
  # DRAFT (LOG N7.F11b3): written by the build, not ethics-sourced
  stop_works: Så fungerar stoppknappen. Nu startar jag beröringen igen.
  # DRAFT (LOG N7.F11b5): written by the build, not ethics-sourced
  training_scale: Nu är det ingen beröring. Det här är skalan du kommer att använda.
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  rerun: Vi gör inställningarna och skattningarna en gång till.
  # DRAFT (LOG N7.F12g3): written by the build, not ethics-sourced. Penseln skattas också på
  # smärtskalan (study1.yaml brush.rating_scale). Ordvalet följer samtyckesdokumentet
  # (UI_PRINCIPLES.md 2.4). Signalen är nu texten "Gör dig redo" (N7.F12g1), inte en cirkel;
  # varje hudtest är ett verkligt stimulus, så det stämmer att något följer.
  first_pain: >-
    Nu ska jag testa huden med tunna plastfilament och en mjuk pensel. Varje gång står det
    först på skärmen att du ska göra dig redo, sedan känner du det, sedan visas linjen och du
    skattar hur smärtsamt det var. Den första linjen är en övning.
  # DRAFT (LOG N7.F11b13): written by the build, not ethics-sourced. {hours} fylls i efteråt.
  intervention: >-
    Nästa del tar ungefär {hours} timmar. Du kommer att känna beröring från plagget, och
    däremellan upprepar jag testerna på huden och du skattar beröringen. Följ bara skärmen.
  # DRAFT (LOG N7.F11c10): written by the build, not ethics-sourced
  intervention_end: Beröringen är slut. Nu gör vi om hudmätningarna från början av besöket.
  # DRAFT (LOG N7.F7a): written by the build, not ethics-sourced. Vad försöksledaren säger om
  # proportionalitet i VAS-övningen (SPEC.md 10.6), visat i `instructions.vas_training` som
  # {explanation}. Det stod på deltagarens skärm fram till S:s lista efter labbkörningen (5 okt
  # 2026); det är deltagartextens tidigare mening (SPEC.md 10.6). En nyckel per övad skala,
  # samma skalor som deltagartextens `training`.
  proportionality:
    pain: Ett märke dubbelt så långt ut på linjen betyder att det gjorde dubbelt så ont.
    intensity: Ett märke dubbelt så långt ut på linjen betyder att beröringen kändes dubbelt så intensiv.
    pleasantness: Ett märke dubbelt så långt ut på linjen betyder att beröringen kändes dubbelt så behaglig.

