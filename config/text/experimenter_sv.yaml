# Varje försöksledarvänd sträng, svenska. SPEC.md 10.4, 11.
#
# Försöksledarskärmen visar ALDRIG en deltagares skattning (Bilaga 1 3.3) och ALDRIG
# betingelsen eller det valda mönstret (SPEC.md 16).
#
# Platshållare inom klammer fylls i av programmet: {filament}, {force_mn}, {site}, {path},
# {region}, {channel}, {block}, {phase}, {time}, {value}.

meta:
  language: sv

session:
  # Identitetsraden överst i försöksledarfönstret (SPEC.md 11). Betingelsen saknas medvetet
  # och får aldrig läggas till (SPEC.md 16).
  participant: 'Deltagare {value}'
  session_number: 'Session {value}'
  limb: 'Målarm: {value}'
  experimenter: 'Försöksledare {value}'

terms:
  # Värden ur kontrollerade vokabulärer som förekommer inuti strängarna nedan, så att ett värde
  # som programmet håller på engelska -- en arm, en zon -- inte visas oöversatt.
  limbs:
    left: vänster
    right: höger
  regions:
    # Böjda så att de passar "{region} zonen" under instructions nedan.
    primary: primära
    secondary: sekundära
  # mapping.path_ids i study1.yaml, fylls i {path}.
  mapping_paths:
    proximal: proximal
    lateral: lateral
    distal: distal
    medial: medial
  # Fylls i warnings.out_of_range (SPEC.md 8.2).
  out_of_range:
    below: det lättaste filamentet skattades redan på eller över målet
    above: det tyngsta filamentet skattades fortfarande under målet
  # De två sorternas interventionsblock, fylls i status.block_label. Samma i alla betingelser,
  # så namnen avslöjar ingenting (SPEC.md 16).
  block_types:
    pinprick: filament
    touch: beröring
  # Språkvalen i startfönstret, vart och ett på sitt eget språk.
  languages:
    sv: Svenska
    en: English
  stage1:
    # Varför en skattning i beröringskalibreringen underkändes (SPEC.md 9). Anger vilken sorts
    # fel, aldrig en skattning.
    flat: platt
    non_monotonic: stiger inte med trycket
    poor_residuals: brusig
    bracket_unusable: inget intervall mellan de två inställningarna
    unreachable: mål utanför vad plagget kan ge
    empty_window: inget behaglighetsintervall kvar inom plaggets gränser

phases:
  setup: Förberedelse
  touch_calibration: Beröringskalibrering
  pre_sensitisation: Före sensitisering
  sensitisation: Värmesensitisering
  capsaicin: Capsaicin
  post_sensitisation: Efter sensitisering
  intervention: Intervention
  rekindle: Återuppvärmning
  post_intervention: Efter intervention
  session_end: Sessionen avslutad

instructions:
  monofilament: >-
    Applicera vinkelrätt från cirka 3 cm. Böj filamentet till ungefär tre fjärdedelar av dess
    utsträckta längd, håll kvar i cirka 1 s, ingen sidorörelse, lyft sedan långsamt. Håll
    appliceringsstället utom synhåll för deltagaren.
  # Filamenten benämns med gramsiffran som står tryckt på dem (SPEC.md 8.1), kraften efter.
  apply_filament: Applicera filamentet {filament} g ({force_mn} mN) på plats {site}, {region} zonen.
  # Ett drag på cirka 2 cm, aldrig upprepat: upprepning höjer smärtan (docs/research/RB2).
  apply_brush: Borsta {region} zonen på plats {site} -- ett enda drag på cirka 2 cm.
  mapping_path: Kartlägg bana {path}. Flytta 5 mm inåt vid varje signal och stanna när deltagaren markerar.
  # Läses högt före första banan. Kartläggningen instrueras muntligt och deltagaren svarar
  # muntligt, så det här är enda stället formuleringen finns -- det finns ingen deltagarskärm
  # för kartläggningen. Exemplen på förändringen är Bilaga 1:s egna ("burning", "tenderness",
  # "more intense pricking"); behåll dem, det är vad planen säger att deltagaren får höra.
  mapping_script: >-
    Säg högt: "Jag kommer att röra vid dig med det här filamentet och flytta ett litet steg i
    taget mot det markerade området. Säg till så snart känslan tydligt förändras – brännande,
    ömmande eller vassare stick."
  mapping_distances: Mät varje gräns från mitten av den primära zonen och skriv in de fyra avstånden i mm när det passar. Detta avbryter aldrig sessionen.
  fit_garment: Sätt på plagget och kontrollera att alla fem kanaler sitter rätt.
  thermode_start: Starta termoden på 50 °C. Programmet tar tid på fasen men styr inte enheten.
  thermode_rekindle: Återuppvärm nu. Plagget har avaktiverats och återaktiveras efteråt.
  capsaicin_apply: Applicera 0,075 % capsaicin.
  # SPEC.md 7.4, 8.3: programmet tar tid, försöksledaren startar.
  ready: Redo. Tryck på Starta block när deltagaren är redo.
  mapping_ready: Bana {path} av {value}. Tryck på Starta block för att starta taktsignalen, och igen för att stoppa den vid gränsen.
  await_participant: Väntar på deltagarens svar.
  response_received: Svar mottaget.
  # Förberedelser och beröringskalibrering (SPEC.md 9, 10.7, 10.9). Ingen nämner ett mönster
  # eller en betingelse.
  masking_check: 'Ljudinställning: deltagaren ställer in brusnivån mot plagget.'
  earplugs: Sätt öronpropparna under hörlurarna och tryck sedan på Gå vidare.
  stop_rehearsal: >-
    Övning med stoppknappen: deltagaren trycker nu på stoppknappen. När stoppskärmen visas,
    tryck på Återuppta. Tryck på Gå vidare bara om deltagaren inte kan trycka.
  stop_rehearsal_resume: Stoppet registrerades. Tryck på Återuppta för att fortsätta inför deltagaren.
  touchcal_bracket: 'Beröringskalibrering, steg 1: deltagaren ställer in beröringen på mittkanalen.'
  touchcal_estimation: 'Beröringskalibrering, steg 2: deltagaren skattar en serie beröringar.'
  touchcal_match: 'Beröringskalibrering, steg 3: deltagaren matchar kanal {channel} mot mittkanalen.'
  touchcal_equalise: 'Beröringskalibrering, steg 4: deltagaren jämför kanal {channel} med mittkanalen.'
  touchcal_pleasantness: 'Beröringskalibrering, steg 5: deltagaren ställer in den behagligaste nivån.'
  touchcal_evenness: 'Beröringskalibrering: deltagaren får frågan om rörelsen känns jämn.'
  touchcal_preference: 'Beröringskalibrering, steg 6: deltagaren väljer en sorts beröring.'
  touchcal_fit_review: Skattningen i beröringskalibreringen är klar. Godkänn den, eller gör om proceduren.
  touchcal_stage1_failed: >-
    Skattningen i beröringskalibreringen klarade inte kvalitetskontrollen ({value}). Gör om
    proceduren, eller godkänn den för att fortsätta med skattningen flaggad.
  touchcal_stage1_unusable: >-
    Skattningen i beröringskalibreringen kan inte användas ({value}). Gör om proceduren, eller
    avbryt sessionen.
  touchcal_stage1_exhausted: >-
    Skattningen i beröringskalibreringen kan inte användas ({value}) och gränsen för antal
    omkörningar är nådd. Godkänn för att fortsätta med en reservlösning som registreras som
    inte giltig för analys, eller avbryt sessionen.
  touchcal_gain_undefined: >-
    Kanal {channel} matchades åter vid 0 kPa. Balansera om för att göra om matchningen, eller
    gå vidare med kanalen på mittkanalens tryck, vilket registreras som inte giltigt för analys.
  touchcal_uneven: >-
    Deltagaren upplever rörelsen som ojämn längs armen. Balansera om kanalerna, eller gå vidare.
  # Visas i början av varje beröring i ALLA betingelser, och inget annat visas: bara en
  # betingelse startas av deltagaren, så en rad om starten skulle avslöja den (SPEC.md 16).
  touch_start: 'Beröring: plagget startas.'

controls:
  start_block: Starta block
  pause: Pausa
  resume: Återuppta
  discard_repeat: Kassera och upprepa senaste trial
  abort: Avbryt sessionen
  note: Tidsstämplad anteckning
  connect: Anslut plagget
  disconnect: Koppla från plagget
  rebalance: Balansera om kanalerna
  # SPEC.md 11.1, visas endast när fit_preview.enabled är på.
  fit_accept: Godkänn den här skattningen
  fit_rerun: Gör om proceduren
  # Fritextfälten (SPEC.md 8.2, 8.4, 11). Inget av dem avbryter någonsin sessionen.
  add_note: Lägg till anteckning
  substitution: Filament använt i stället (g)
  record_substitution: Registrera filament
  distances: 'Kartläggningsavstånd (mm), mätta från mitten av den primära zonen:'
  enter_distances: Registrera avstånd
  open_distances: Kartläggningsavstånd…
  cancel: Avbryt

status:
  connected: Ansluten
  disconnected: Frånkopplad
  channel_pressure: 'Kanal {channel}: {value} kPa'
  # Hårdvarupanelens kompakta form: alla kanaler på en eller två rader.
  channel_pressures: 'kPa per kanal: {value}'
  channel_pressure_short: '{channel}: {value}'
  elapsed: Förfluten tid {time}
  next_event: 'Nästa: {phase} om {time}'
  block_due: Block {block} ska starta nu.
  block_overdue: Block {block} är FÖRSENAT.
  # Ett schemalagt fasbyte eller återuppvärmningen, i tid och försenat, som för ett block.
  event_due: '{phase} ska starta nu.'
  event_overdue: '{phase} är FÖRSENAD.'
  # Fylls i next_event:s {phase} när nästa händelse är ett block.
  block_label: block {block} ({value})
  # Visas så länge sessionen är avbruten (SPEC.md 13).
  interrupted_emergency_stop: NÖDSTOPP. Plagget är på noll. Tryck på Återuppta när deltagaren är redo.
  interrupted_pause: Pausad. Plagget är på noll. Tryck på Återuppta för att fortsätta.
  discarded: Senaste trial kasserad. Den upprepas.
  discarded_not_repeated: >-
    Senaste trial kasserad. Gränsen för antal appliceringar är nådd, så den upprepas inte.

warnings:
  experimenter_changed: >-
    Dessa initialer skiljer sig från tidigare sessioner för denna deltagare. Bilaga 1 3.3 önskar
    samma försöksledare genomgående. Sessionen fortsätter och avvikelsen registreras.
  cloud_sync: >-
    Datamappen ligger i ett molnsynkat träd ({value}). Detta registreras i sessionsfilen. Flytta
    data till en lokal mapp om det går.
  filaments_unweighed: >-
    Inga uppmätta filamentkrafter. Nominella krafter avviker från uppmätta med upp till cirka
    20 % (Berquin et al. 2010). Väg uppsättningen under Instrument och miljö innan data samlas in.
  open_items: 'Olösta konfigurationsplatshållare: {value}'
  out_of_range: >-
    Kalibreringen tog slut på stegen ({value}). Yttersta filamentet används och försöket flaggas.
    Räkna med detta i en betydande andel av sessionerna.
  application_cap: >-
    Gränsen på {value} appliceringar är nådd. Bästa tillgängliga skattning används och
    flaggas.
  substitution_unknown: Inget filament märkt {filament} g finns. Utbytet registrerades inte.
  substitution_not_lower: >-
    Filamentet {filament} g är inte lättare än det som efterfrågades. Det registreras som
    applicerat.
  distance_implausible: >-
    Bana {path}: {value} mm ligger utanför det rimliga intervallet. Skriv samma värde igen för
    att bekräfta det, eller skriv det rättade värdet.
  catch_trials_felt: >-
    Fler än tillåten andel av kontrolltrials utan tryck rapporterades som kända ({value}).
  schedule: 'Schemavarning, block {block}: {value}'
  no_response: Inget svar på {value} s.
  # SPEC.md 10.7 steg 5. Att höja bruset hjälper inte längre, så åtgärden är fysisk. Hörbar
  # larmsignal också, eftersom försöksledaren kan titta på deltagaren i stället för skärmen.
  masking_failed: >-
    Deltagaren hör fortfarande plagget och bruset kan inte höjas mer. Erbjud öronproppar under
    hörlurarna. Bruset har stängts av så att ni kan prata, och kontrollen börjar om från början
    när propparna sitter på plats.
  masking_failed_after_earplugs: >-
    Fortfarande hörbart med öronproppar. Sessionen fortsätter och registreras som inte helt
    maskerad.
  equalisation_mismatch: >-
    Kanal {channel} matchar fortfarande inte mittkanalen efter omjustering. Sessionen fortsätter
    och detta registreras.

banners:
  reduced_capability: >-
    DENNA SESSION SAMLAR INTE IN GILTIG BERÖRINGSKALIBRERINGSDATA. Den anslutna enheten
    ({value}) kan inte ställa tryck per kanal. Tiderna är verkliga; trycken är det inte.
  placeholder_text: >-
    DELTAGARSKÄRMARNA INNEHÅLLER FORTFARANDE PLATSHÅLLARTEXT. Kör inte en riktig deltagare.
  # SPEC.md 11.1. Omöjlig att missa, eftersom försöksledaren inte ska kunna slå på detta utan
  # att se vad det kostar.
  fit_preview: >-
    FÖRHANDSGRANSKNING AV ANPASSNINGEN ÄR PÅ. Du ser deltagarens skattningar, vilket Bilaga 1
    3.3 och forskningspersonsinformationen säger att du inte gör. Sessionen registreras som
    oblindad i det avseendet.

dialogs:
  abort_confirm: Avbryta sessionen? All data som samlats in hittills sparas.
  abort_reason: Orsak till avbrott
  resume_found: En oavslutad session hittades för denna deltagare, startad för {time} sedan. Återuppta den?
  distances_outstanding: Kartläggningsavstånd saknas fortfarande. Skriv in dem nu, eller avsluta sessionen med dem flaggade som saknade.
  fit_rerun_reason: Varför gör du om proceduren? Registreras tillsammans med den kasserade skattningen, som sparas.
  fit_rerun_exhausted: Gränsen för antal omkörningar av den här proceduren är nådd. Den här skattningen används.
  error: Fel
  close: Stäng
  # Knapparna till frågan om att återuppta.
  resume_yes: Återuppta sessionen
  resume_no: Starta en ny session

zones:
  # Bredvid zondiagrammet (SPEC.md 11): var den aktuella stimuleringen ska ges.
  target: '{region} zonen, plats {site}'
  target_region: '{region} zonen'

hardware:
  # Hårdvarupanelen (SPEC.md 11, 12.1). Trycket per kanal utelämnas helt under interventionen
  # och återuppvärmningen, eftersom det skulle skilja sig mellan betingelserna (SPEC.md 16).
  title: Plagget
  fault: 'Fel: {value}'
  # Under interventionen och återuppvärmningen nämner felets detalj en kanal, och vilka kanaler
  # ett mönster använder skiljer sig mellan betingelserna (SPEC.md 16). Själva felet visas.
  fault_withheld: 'Fel i plagget: {value} (detalj i data)'

fit_preview:
  # SPEC.md 11.1. Visas bara när fit_preview.enabled är på. Det enda stället där deltagarens
  # skattningar når försöksledaren.
  f40_title: 'F40, körning {value}'
  touch_title: 'Beröringskalibrering, körning {value}'
  x_force: Kraft (mN, logaritmisk skala)
  x_pressure_log: Tryck (kPa, logaritmisk skala)
  x_pressure_linear: Tryck (kPa)
  y_rating: Skattning (%)
  missing: '–'
  # Citerade: YAML läser ett ensamt yes eller no som ett booleskt värde.
  answer_yes: 'ja'
  answer_no: 'nej'
  # Korta, eftersom förhandsgranskningen delar en smal kolumn med diagrammet. rho är
  # rangkorrelationen mellan skattning och kraft, F40-körningens konsistenskontroll.
  f40_quality: 'rho {rho} · {measure} av {total} appliceringar mätta'
  f40_flags_out_of_range: 'Stegen tog slut: {value}'
  f40_flags_capped: Gränsen för antal appliceringar nådd
  f40_derived: 'F40 {f40} mN, alltså {filament} g ({force} mN); lutning {slope}'
  touch_quality: 'R² {r_squared} · residual-SD {residual_sd} · stigande {monotonic}'
  touch_stage1_pass: 'Steg 1: godkänd'
  touch_stage1_fail: 'Steg 1: underkänd ({value})'
  touch_derived: 'P20 {p20} · P30 {p30} · P80 {p80} kPa'

launcher:
  # SPEC.md 4.1: de fyra valen.
  title: TATP Studie 1
  run_session: Kör en session
  run_session_detail: Själva experimentet. Kräver deltagarkod, sessionsnummer och mönstermapp.
  instruments: Instrument och miljö
  instruments_detail: Skriv in vägda filamentkrafter och dagens rumstemperatur och luftfuktighet.
  design_pattern: Skapa ett mönster
  design_pattern_detail: Inte tillgängligt än. Mönsterverktyget byggs i milstolpe 6; redigera mönstrens CSV-filer för hand tills dess.
  preview_schedule: Förhandsgranska schemat
  preview_schedule_detail: Sessionens tidslinje och dess varningar. Ingenting startas.
  environment_entered: 'Rummet {temperature} °C, {humidity} % RF, lämnas till nästa session.'
  # Sessionsdialogen. Den frågar bara efter det SPEC.md 6 räknar upp; allt annat är konfiguration.
  session_title: Kör en session
  participant_code: Deltagarkod
  session_number: Sessionsnummer
  experimenter_initials: Försöksledarens initialer
  participant_language: Deltagarens språk
  experimenter_language: Försöksledarens språk
  data_folder: Datamapp
  pattern_folder: Mönstermapp
  browse: Bläddra…
  check: Kontrollera
  start: Starta sessionen
  close: Stäng
  missing_field: 'Obligatoriskt: {value}'
  no_pattern_folder: Välj mönstermappen. Det finns ingen standardmapp, så att exempelmönstren aldrig används av misstag.
  refusals: 'Sessionen kan inte starta:'
  warnings: 'Varningar. Sessionen kan starta, och var och en registreras:'
  no_findings: Inga problem hittades.
  preview_title: Förhandsgranskning av schemat

instruments:
  # SPEC.md 8.1. Skriver de uppmätta krafterna och vägningsdatumet till config/filaments.yaml.
  title: Instrument och miljö
  filaments: Filamentkrafter
  label: Märkning (g)
  size: Storlek
  nominal: Nominell (mN)
  measured: Uppmätt (mN)
  weighing_date: 'Vägningsdatum (ÅÅÅÅ-MM-DD):'
  weighing_balance: 'Våg som användes:'
  save_forces: Spara krafterna
  saved: 'Sparade {value} uppmätta krafter i filaments.yaml.'
  invalid_force: 'Filament {filament} g: {value} är inte en kraft i mN över noll.'
  invalid_date: '{value} är inte ett datum på formen ÅÅÅÅ-MM-DD.'
  date_required: Skriv in vägningsdatumet innan uppmätta krafter sparas.
  nothing_to_save: Inga uppmätta krafter har skrivits in.
  environment: Rumsmiljö (valfritt)
  room_temperature: 'Rumstemperatur (°C):'
  relative_humidity: 'Relativ luftfuktighet (%):'
  use_environment: Använd för nästa session
  invalid_number: '{value} är inte ett tal.'