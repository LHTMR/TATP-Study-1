  # DRAFT (LOG N7.F11b9): written by the build, not ethics-sourced. Medan värmen är på.
  heat_on: Värmen är på. Ta bort termoden när det är dags för capsaicin.
  # DRAFT (LOG N7.F11b9): written by the build, not ethics-sourced
  capsaicin_apply: Ta bort termoden. Applicera 0,075 % capsaicin på den primära zonen och tryck sedan på {controls[proceed]}.
  # DRAFT (LOG N7.F11b9): written by the build, not ethics-sourced. Medan capsaicinet sitter på.
  capsaicin_on: Capsaicinet sitter på. Ta bort det när nedräkningen är slut.
  # DRAFT (LOG N7.F11b10): written by the build, not ethics-sourced
