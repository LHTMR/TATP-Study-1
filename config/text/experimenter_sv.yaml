    nedräkningar -- går så här många gånger snabbare än i en riktig session, för personer och
    simuleringar lika. Bara handens egen tid (hur länge en knapp hålls) är verklig. 1 är
    realtid. Väljs när demon startas (Klockans hastighet); ett plagg som bärs går alltid i 1.
