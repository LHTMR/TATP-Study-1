    trycker vara densamma. Ett steg man hoppar tillbaka till körs igen; allt det registrerade
    tidigare sparas, och loggen visar vilka rader som kom efter hoppet. Ett värde som ett
    överhoppat steg skulle ha mätt -- beröringskalibreringen, en stickskattning -- tas från
