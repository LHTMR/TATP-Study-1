  label: Märkning (g)
  size: Storlek
  nominal: Nominell (mN)
  # DRAFT (LOG N7.U1): written by the build, not ethics-sourced
  measured: Vägt (g)
  # DRAFT (LOG N7.U1): written by the build, not ethics-sourced
  measured_mn: Kraft (mN)
  weighing_date: 'Vägningsdatum (ÅÅÅÅ-MM-DD):'
  save_forces: Spara krafterna
  saved: 'Sparade {value} uppmätta krafter i filaments.yaml.'
  # DRAFT (LOG N7.U1): written by the build, not ethics-sourced
  invalid_force: 'Filament {filament} g: {value} är inte en vikt i gram över noll.'
  invalid_date: '{value} är inte ett datum på formen ÅÅÅÅ-MM-DD.'
  date_required: Skriv in vägningsdatumet innan uppmätta krafter sparas.
  nothing_to_save: Inga uppmätta krafter har skrivits in.
  environment: Rumsmiljö (valfritt)
  # DRAFT (LOG N7.U1): written by the build, not ethics-sourced. Kort, för att rymmas på en rad.
  room_temperature: 'Temperatur (°C):'
  # DRAFT (LOG N7.U1): written by the build, not ethics-sourced
  relative_humidity: 'Luftfuktighet (% RF):'
  use_environment: Använd för nästa session
  invalid_number: '{value} är inte ett tal.'

designer:
  # SPEC.md 12.2: startvalet 3, tools/design_pattern.py. För S, inte för en blindad
  # försöksledare (SPEC.md 16), så det får visa mönstrens namn, men ingen sträng här namnger en
  # betingelse. Skrivet av bygget (docs/LOG.md N7.P1-N7.P9), inte hämtat ur etikdokumenten.
  title: Mönsterverktyg
  for_s_only: Endast för S. Verktyget visar mönstrens namn och form, så en försöksledare som kör sessioner öppnar det aldrig.
  new: Nytt
  open: Öppna mönster…
  import_reference: Importera prototyp-CSV…
  save: Spara
