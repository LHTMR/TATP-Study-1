# Varje försöksledarvänd sträng, svenska. SPEC.md 10.4, 11.
#
# Försöksledarskärmen visar ALDRIG en deltagares skattning (Bilaga 1 3.3) och ALDRIG
# betingelsen eller det valda mönstret (SPEC.md 16).
#
# Platshållare inom klammer fylls i av programmet: {filament}, {force_mn}, {site}, {path},
# {region}, {channel}, {block}, {phase}, {time}, {value}.

meta:
  language: sv

session:
  # Identitetsraden överst i försöksledarfönstret (SPEC.md 11). Betingelsen saknas medvetet
  # och får aldrig läggas till (SPEC.md 16).
  participant: 'Deltagare {value}'
  session_number: 'Session {value}'
  limb: 'Målarm: {value}'
  experimenter: 'Försöksledare {value}'

terms:
  # Värden ur kontrollerade vokabulärer som förekommer inuti strängarna nedan, så att ett värde
  # som programmet håller på engelska -- en arm, en zon -- inte visas oöversatt.
  limbs:
    left: vänster
    right: höger
  regions:
    # Böjda så att de passar "{region} zonen" under instructions nedan.
    primary: primära
    secondary: sekundära
  # mapping.path_ids i study1.yaml, fylls i {path}.
  mapping_paths:
    proximal: proximal
    lateral: lateral
    distal: distal
    medial: medial
  # Fylls i warnings.out_of_range (SPEC.md 8.2).
  # DRAFT (LOG N7.F11b15): written by the build, not ethics-sourced. Förkortade så att
  # varningen ryms på statusraden.
  out_of_range:
    below: redan det lättaste nådde målet
    above: även det tyngsta låg under målet
  # De två sorternas interventionsblock, fylls i status.block_label. Samma i alla betingelser,
  # så namnen avslöjar ingenting (SPEC.md 16).
  block_types:
    pinprick: filament
    touch: beröring
  # Språkvalen i startfönstret, vart och ett på sitt eget språk.
  languages:
    sv: Svenska
    en: English
  # Plaggdrivrutinerna som startfönstret erbjuder (tatp/session.py DRIVERS). Namnger riggen,
  # aldrig en betingelse.
  garments:
    mock: Simulerat plagg (ingen hårdvara)
    arduino_mosfet: Prototypärmen (på/av; trycket ställs för hand)
  stage1:
    # Varför en skattning i beröringskalibreringen underkändes (SPEC.md 9). Anger vilken sorts
    # fel, aldrig en skattning.
    flat: platt
    non_monotonic: stiger inte med trycket
    poor_residuals: brusig
    bracket_unusable: inget intervall mellan de två inställningarna
    unreachable: mål utanför vad plagget kan ge
    empty_window: inget behaglighetsintervall kvar inom plaggets gränser

phases:
  setup: Förberedelse
  touch_calibration: Beröringskalibrering
  pre_sensitisation: Före sensitisering
  sensitisation: Värmesensitisering
  capsaicin: Capsaicin
  post_sensitisation: Efter sensitisering
  intervention: Intervention
  rekindle: Återuppvärmning
  post_intervention: Efter intervention
  session_end: Sessionen avslutad
  # Inte faser i sessionen: vad nedräkningen kallar medan capsaicinet sitter på, och medan
  # återuppvärmningens värme är på. `capsaicin_removal` är också det schemalagda stegets namn i
  # loggen.
  # DRAFT (LOG N7.F11b17): written by the build, not ethics-sourced
  capsaicin_removal: Borttagning av capsaicin
  # DRAFT (LOG N7.F11b10): written by the build, not ethics-sourced
  rekindle_end: Slut på återuppvärmningen

instructions:
  # SPEC.md 11: vad som ska göras nu, bredvid zondiagrammet.
  #
  # Fylls i av `tatp.config.instruction`: {controls[...]} med knapparnas etiketter nedan, så
  # att en instruktion aldrig benämner en knapp på sitt eget sätt (LOG N7.F11b18); {say[...]}
  # med en mening ur `say:` på DELTAGARENS språk, eftersom den sägs till deltagaren (LOG
  # N7.F11b19); fjärrkontrollens knappsymboler ({confirm} ...) från hardware.yaml; och stegets
  # egna värden.
  monofilament: >-
    Applicera vinkelrätt från cirka 3 cm. Böj filamentet till ungefär tre fjärdedelar av dess
    utsträckta längd, håll kvar i cirka 1 s, ingen sidorörelse, lyft sedan långsamt. Håll
    appliceringsstället utom synhåll för deltagaren.
  # Filamenten benämns med gramsiffran som står tryckt på dem (SPEC.md 8.1), kraften efter.
  # "Nu:" så att den pågående appliceringen aldrig ser ut som den förra (LOG N7.F11b8).
  # DRAFT (LOG N7.F11b8): written by the build, not ethics-sourced
  apply_filament: 'Nu: applicera filamentet {filament} g ({force_mn} mN) på plats {site}, {region} zonen.'
  # Ett drag på cirka 2 cm, aldrig upprepat: upprepning höjer smärtan (docs/research/RB2).
  # DRAFT (LOG N7.F11b8): written by the build, not ethics-sourced
  apply_brush: 'Nu: borsta den {region} zonen på plats {site}, ett enda drag på cirka 2 cm.'
  # DRAFT (LOG N7.F11b8): written by the build, not ethics-sourced. Det slumpade uppehållet
  # efter en skattning, så att förra appliceringens uppmaning inte står kvar som om den vore
  # ogjord. Nämner aldrig nästa filament.
  between_applications: 'Svar mottaget. Vänta: nästa applicering visas här.'
  # DRAFT (LOG N7.F11b8): written by the build, not ethics-sourced. Samma uppehåll efter en
  # kassering, som statusraden rapporterar, vare sig en upprepning följer eller inte.
  between_applications_discarded: 'Kasserat. Vänta: nästa steg visas här.'
  # DRAFT (LOG N7.F11b11): written by the build, not ethics-sourced. {step} är
  # mapping.step_size_mm.
  mapping_path: 'Bana {path}: flytta filamentet {step} mm inåt vid varje taktsignal. Tryck på {controls[proceed]} när deltagaren säger till att känslan förändras, och markera gränsen på huden.'
  # Läses högt före första banan: `say.mapping`.
  mapping_script: 'Säg högt: "{say[mapping]}"'
  mapping_distances: Mät varje gräns från mitten av den primära zonen och skriv in de fyra avstånden i mm när det passar. Detta avbryter aldrig sessionen.
  # DRAFT (LOG N7.F12g2): written by the build, not ethics-sourced. Inget om varningssignalen:
  # den är nu ord ("Gör dig redo"), som förklarar sig själva första gången de visas, så meningen
  # som cirkeln behövde (N7.F11b1) är borta.
  fit_garment: >-
    Sätt på plagget och kontrollera att alla fem kanaler sitter rätt. Ge deltagaren
    fjärrkontrollen och visa knapparna: {decrease} {increase} flyttar, {confirm} bekräftar,
    {emergency_stop} stoppar. Sätt på hörlurarna. Tryck sedan på {controls[proceed]}.
  # DRAFT (LOG N7.F11b2): written by the build, not ethics-sourced
  welcome: >-
    Deltagaren läser välkomsttexten och trycker på {confirm}. Direkt efter kommer övningen med
    stoppknappen: beröringen startar och deltagaren ombeds trycka på stoppknappen.
  # DRAFT (LOG N7.F14a): written by the build, not ethics-sourced
  practice_intro: >-
    Deltagaren läser att övningen med skattningsskalan kommer härnäst och trycker på {confirm}
    för att börja den.
  # DRAFT (LOG N7.F11b9): written by the build, not ethics-sourced. {minutes} är
  # sensitiseringsfönstrets längd (schedule.yaml), inuti `say.heat`.
  thermode_start: >-
    Värme: säg till deltagaren "{say[heat]}" Placera termoden (50 °C) på den primära zonen och
    tryck på {controls[proceed]} i samma stund som den börjar värma: det är tid noll.
  # DRAFT (LOG N7.F11b9): written by the build, not ethics-sourced. Medan värmen är på.
  heat_on: Värmen är på. Ta bort termoden när det är dags för capsaicin.
  # DRAFT (LOG N7.F11b9): written by the build, not ethics-sourced
  capsaicin_apply: Ta bort termoden. Applicera 0,075 % capsaicin på den primära zonen och tryck sedan på {controls[proceed]}.
  # DRAFT (LOG N7.F11b9): written by the build, not ethics-sourced. Medan capsaicinet sitter på.
  capsaicin_on: Capsaicinet sitter på. Ta bort det när nedräkningen är slut.
  # DRAFT (LOG N7.F11b10): written by the build, not ethics-sourced
  thermode_rekindle: >-
    Återuppvärmning: plaggets beröring är avstängd. Placera termoden på den primära zonen och
    tryck på {controls[proceed]} när den börjar värma.
  # DRAFT (LOG N7.F11b10): written by the build, not ethics-sourced. Medan återuppvärmningens
  # värme är på; nedräkningen ovan räknar till dess slut.
  rekindle_heating: Återuppvärmningen pågår. Ta bort termoden när nedräkningen är slut.
  # DRAFT (LOG N7.F11b10): written by the build, not ethics-sourced
  rekindle_remove: Ta bort termoden och tryck sedan på {controls[proceed]}. Plaggets beröring startar igen.
  # SPEC.md 7.4, 8.3: programmet tar tid, försöksledaren startar. En per sorts serie, och den
  # säger vad som snart ska appliceras (LOG N7.F11b7). {n} är det konfigurerade antalet.
  # DRAFT (LOG N7.F11b7): written by the build, not ethics-sourced
  ready_long: >-
    Filamentserie i den {region} zonen, med början på filamentet {filament} g. Ha filamenten
    till hands och tryck sedan på {controls[proceed]}.
  # DRAFT (LOG N7.F11b14): written by the build, not ethics-sourced. Före sessionens första
  # smärtmätning, som följs av övningen på smärtskalan.
  ready_long_first: 'Första smärtmätningarna. Säg till deltagaren: "{say[first_pain]}" Tryck sedan på {controls[proceed]}.'
  # DRAFT (LOG N7.F11b7): written by the build, not ethics-sourced
  ready_short: '{n} appliceringar med filamentet {filament} g i den {region} zonen. Ha det till hands och tryck sedan på {controls[proceed]}.'
  # DRAFT (LOG N7.F11b7): written by the build, not ethics-sourced
  ready_brush: '{n} penseldrag i den {region} zonen. Ha penseln till hands och tryck sedan på {controls[proceed]}.'
  # DRAFT (LOG N7.F11b7): written by the build, not ethics-sourced. Ett filamentblock under
  # interventionen: {ready} är `ready_short`.
  ready_pinprick_block: 'Filamentblock {block}: {ready}'
  # DRAFT (LOG N7.F11b7): written by the build, not ethics-sourced
  ready_touch_block: 'Beröringsblock {block}: inget att applicera. Tryck på {controls[proceed]} så skattar deltagaren beröringen.'
  # DRAFT (LOG N7.F11b11): written by the build, not ethics-sourced
  mapping_ready: 'Bana {index} av {count} ({path}). Börja utanför området. Tryck på {controls[proceed]} för att starta taktsignalen.'
  await_participant: Väntar på deltagarens svar.
  response_received: Svar mottaget.
  # DRAFT (LOG N7.F11b5): written by the build, not ethics-sourced. Övningen i proportionalitet
  # på VAS (SPEC.md 10.6), före en skalas första skattning; densamma i alla betingelser.
  # Försöksledaren ser inte deltagarens skärm, så etiketterna står här: {anchors} är
  # deltagartextens etiketter för skalan, från vänster till höger, och {explanation} är
  # `say.proportionality`, båda på DELTAGARENS språk.
  vas_training: >-
    Övning på skattningsskalan. Säg till deltagaren: "{say[training_scale]}" Läs etiketterna
    från vänster till höger: {anchors}. Säg därefter: "{explanation}" Tryck sedan på
    {controls[proceed]}.
  # DRAFT (LOG N7.F7a): written by the build, not ethics-sourced. Efter det Nästa steg, medan
  # deltagaren gör en övningsskattning. Visar aldrig var markören hamnade.
  vas_training_wait: >-
    Övning på skattningsskalan: deltagaren gör en övningsskattning och bekräftar den med
    {confirm}. Den sparas inte som en skattning.
  # Förberedelser och beröringskalibrering (SPEC.md 9, 10.7, 10.9). Ingen nämner ett mönster
  # eller en betingelse.
  # DRAFT (LOG N7.F11b4): written by the build, not ethics-sourced. Maskeringskontrollens steg
  # 1, med plagget fortfarande avstängt.
  masking_check: 'Ljudinställning, del 1: deltagaren höjer bruset tills hen hör det tydligt. Därefter startar plagget.'
  # DRAFT (LOG N7.F11b4): written by the build, not ethics-sourced. Maskeringssteget (SPEC.md
  # 10.7): deltagaren ombeds säga till om hen fortfarande hör plagget, och försöksledarens
  # Nästa steg är det som registrerar det.
  masking_check_mask: >-
    Ljudinställning, del 2: plagget är igång och deltagaren höjer bruset för att dölja det.
    Tryck på {controls[proceed]} bara om deltagaren säger att hen fortfarande hör plagget: det
    registreras då, och bruset stängs av så att du kan erbjuda öronproppar.
  # DRAFT (LOG N7.F11b4): written by the build, not ethics-sourced. Samma steg med öronproppar.
  masking_check_mask_earplugs: >-
    Ljudinställning, med öronproppar: deltagaren höjer bruset för att dölja plagget. Tryck på
    {controls[proceed]} bara om deltagaren säger att hen fortfarande hör det: det registreras
    då, och sessionen fortsätter registrerad som inte helt maskerad.
  # DRAFT (LOG N7.F11b4): written by the build, not ethics-sourced. Skärmen `settled`, där
  # Nästa steg inte gör något.
  masking_done: 'Ljudinställningen är klar. Deltagaren läser skärmen och trycker på {confirm}; sedan följer beröringskalibreringen.'
  # DRAFT (LOG N7.F11b4): written by the build, not ethics-sourced
  earplugs: >-
    Sätt öronpropparna under hörlurarna. Säg till deltagaren: "{say[earplugs]}" Tryck sedan på
    {controls[proceed]}.
  # DRAFT (LOG N7.F11b3): written by the build, not ethics-sourced
  stop_rehearsal: >-
    Övning med stoppknappen: beröringen är igång och deltagaren ombeds trycka på stoppknappen.
    Vänta på trycket. {controls[proceed]} är bara för en deltagare som inte kan trycka, och det
    registrerar inget tryck.
  # DRAFT (LOG N7.F11b3): written by the build, not ethics-sourced
  stop_rehearsal_resume: 'Stoppet fungerade. Säg till deltagaren: "{say[stop_works]}" Tryck sedan på {controls[resume]}.'
  # DRAFT (LOG N7.F11b3): written by the build, not ethics-sourced. Efter återupptagandet,
  # medan `stop_rehearsal_done` visas.
  stop_rehearsal_done: Deltagaren läser att stoppknappen fungerar när som helst och trycker på {confirm}. Sedan följer ljudinställningen.
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced. "Varje inställning börjar
  # från ingen beröring" gäller så länge touch_calibration.adjustments_per_anchor är 1
  # (tests/test_touchcal.py).
  touchcal_bracket: >-
    Beröringskalibrering, steg 1 av 6: deltagaren ställer in beröringen på mittkanalen, först
    till precis märkbar, sedan till precis obehaglig. Varje inställning börjar från ingen
    beröring.
  # DRAFT (LOG N7.F8c): the progress, "x/N answered" (S, 5 Oct 2026).
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_estimation: 'Beröringskalibrering, steg 2 av 6: deltagaren skattar en serie beröringar. {answered}/{total} besvarade.'
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced. {index} av {count} räknar
  # kanalerna som matchas mot mittkanalen.
  touchcal_match: 'Beröringskalibrering, steg 3 av 6: deltagaren matchar kanal {channel} ({index} av {count}) mot mittkanalen.'
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced. Steg 3:s matchning, gjord
  # om inom steg 4 för en kanal som fortfarande kändes olika.
  touchcal_readjust: 'Beröringskalibrering, steg 4 av 6: kanal {channel} matchade inte mittkanalen, så deltagaren ställer in den igen.'
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_equalise: 'Beröringskalibrering, steg 4 av 6: deltagaren jämför kanal {channel} ({index} av {count}) med mittkanalen.'
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_pleasantness: 'Beröringskalibrering, steg 5 av 6: deltagaren ställer in den behagligaste nivån.'
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_evenness: 'Beröringskalibrering, efter steg 5: deltagaren får frågan om rörelsen känns jämn.'
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_preference: 'Beröringskalibrering, steg 6 av 6: deltagaren väljer en sorts beröring.'
  # DRAFT (LOG N7.F11b18): written by the build, not ethics-sourced
  touchcal_fit_review: 'Skattningen i beröringskalibreringen är klar. Tryck på {controls[fit_accept]} eller {controls[fit_rerun]}.'
  # DRAFT (LOG N7.F11b15): written by the build, not ethics-sourced
  f40_fit_review: 'Skattningen av filamentkraften (F40) är klar. Tryck på {controls[fit_accept]} eller {controls[fit_rerun]}.'
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_stage1_failed: >-
    Skattningen i beröringskalibreringen klarade inte kvalitetskontrollen ({value}). Tryck på
    {controls[fit_rerun]} för att göra om steg 1 och 2, och säg till deltagaren:
    "{say[rerun]}" Eller tryck på {controls[fit_accept]} för att fortsätta med den flaggad.
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_stage1_unusable: >-
    Skattningen i beröringskalibreringen kan inte användas ({value}). Tryck på
    {controls[fit_rerun]} för att göra om steg 1 och 2, och säg till deltagaren:
    "{say[rerun]}" Eller tryck på {controls[abort]}.
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced. Ingen omkörning erbjuds:
  # gränsen är nådd, och en omkörning nekas.
  touchcal_stage1_exhausted: >-
    Skattningen i beröringskalibreringen kan inte användas ({value}) och gränsen för antal
    omkörningar är nådd. Tryck på {controls[fit_accept]} för att fortsätta med en
    reservlösning som registreras som inte giltig för analys, eller på {controls[abort]}.
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_gain_undefined: >-
    Kanal {channel} matchades åter vid 0 kPa. Tryck på {controls[rebalance]} för att göra om
    matchningen, eller på {controls[proceed]} för att fortsätta med kanalen på mittkanalens
    tryck, vilket registreras som inte giltigt för analys.
  # DRAFT (LOG N7.F11b6): written by the build, not ethics-sourced
  touchcal_uneven: >-
    Deltagaren upplever rörelsen som ojämn längs armen. Tryck på {controls[rebalance]} för att
    göra om steg 3 och 4, eller på {controls[proceed]} för att gå vidare.
  # Visas i början av varje beröring i ALLA betingelser, och inget annat visas: bara en
  # betingelse startas av deltagaren, så en rad om starten skulle avslöja den (SPEC.md 16).
  # DRAFT (LOG N7.F11b15): written by the build, not ethics-sourced
  touch_start: Plaggets beröring startar.
  # Sessionsförloppet (SPEC.md 2, 7.4). Programmet tar tid och försöksledaren startar; ingen
  # av dessa nämner en betingelse, ett mönster eller något med beröringen som skiljer sig.
  # DRAFT (LOG N7.F11b15): written by the build, not ethics-sourced
  waiting: Inget att göra förrän nästa steg. Nedräkningen ovan visar när det är dags.
  # DRAFT (LOG N7.F11b18): written by the build, not ethics-sourced
  capsaicin_remove: Ta bort capsaicinet och tryck sedan på {controls[proceed]} för att börja mätningarna efter sensitiseringen.
  # DRAFT (LOG N7.F11b13): written by the build, not ethics-sourced. Densamma i alla
  # betingelser: plagget ger beröring i alla betingelser (SPEC.md 12). {hours} är
  # interventionsfönstrets längd (schedule.yaml), inuti `say.intervention`.
  intervention_start: 'Intervention. Säg till deltagaren: "{say[intervention]}" Tryck sedan på {controls[proceed]}.'
  # DRAFT (LOG N7.F11c7): written by the build, not ethics-sourced
  touch_block: 'Skattningsblock för beröring: deltagaren skattar beröringen. {answered}/{total} besvarade.'
  baseline_ratings: 'Utgångsläge: deltagaren skattar hur hen känner sig just nu.'
  # DRAFT (LOG N7.F11c10): written by the build, not ethics-sourced
  intervention_end: >-
    Interventionen är slut och plagget är avstängt. Säg till deltagaren: "{say[intervention_end]}"
    Tryck sedan på {controls[proceed]}.
  # DRAFT (LOG N7.F11c9): written by the build, not ethics-sourced
  session_complete: >-
    Sessionen är klar. Alla data är sparade. Ta av plagget och berätta för deltagaren att besöket
    är slut. Tryck på {controls[proceed]} för att stänga programmet.
  # DRAFT (LOG N7.F11c1): written by the build, not ethics-sourced. Medan deltagaren läser
  # introduktionen till nästa sorts uppgift (`screens.intro_*`), numrerade som stegen.
  touchcal_intro_bracket: 'Beröringskalibrering, steg 1 av 6: deltagaren läser om vad som kommer härnäst.'
  touchcal_intro_estimation: 'Beröringskalibrering, steg 2 av 6: deltagaren läser om vad som kommer härnäst.'
  touchcal_intro_match: 'Beröringskalibrering, steg 3 av 6: deltagaren läser om vad som kommer härnäst.'
  touchcal_intro_readjust: 'Beröringskalibrering, steg 4 av 6: deltagaren läser om vad som kommer härnäst.'
  touchcal_intro_compare: 'Beröringskalibrering, steg 4 av 6: deltagaren läser om vad som kommer härnäst.'
  touchcal_intro_pleasant: 'Beröringskalibrering, steg 5 av 6: deltagaren läser om vad som kommer härnäst.'
  # SPEC.md 15: en session som återupptas under återuppvärmningen ber aldrig om värmen igen.
  # DRAFT (LOG N7.F11b18): written by the build, not ethics-sourced
  rekindle_resumed: >-
    Sessionen återupptogs under återuppvärmningen. Värmen startades före avbrottet och
    efterfrågas inte igen; återuppvärmningen räknas därifrån. Tryck på {controls[proceed]} för
    att bekräfta. Om värmen i själva verket inte gavs, ge den nu och skriv en anteckning.
    Plagget förblir avstängt tills återuppvärmningen är klar.

# Vad försöksledaren säger högt till deltagaren, citerat i `instructions` som {say[...]}.
# Läses på DELTAGARENS språk (`Config.say`), oavsett försöksledarens (LOG N7.F11b19). Ingen får
# skilja sig mellan betingelser (SPEC.md 16).
say:
  # Läses högt före första banan. Kartläggningen instrueras muntligt och deltagaren svarar
  # muntligt, så det här är enda stället formuleringen finns -- det finns ingen deltagarskärm
  # för kartläggningen. Exemplen på förändringen är Bilaga 1:s egna ("burning", "tenderness",
  # "more intense pricking"); behåll dem, det är vad planen säger att deltagaren får höra.
  mapping: >-
    Jag kommer att röra vid dig med det här filamentet och flytta ett litet steg i taget mot
    det markerade området. Säg till så snart känslan tydligt förändras – brännande, ömmande
    eller vassare stick.
