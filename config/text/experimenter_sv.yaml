  # S:s lydelse, 21 okt 2026.
  # DRAFT (LOG N7.F18e): written by the build, not ethics-sourced
  ready_short: 'Förbered att applicera filamentet {filament} g. Tryck på {controls[proceed]} när du är redo.'
  # DRAFT (LOG N7.F18e): written by the build, not ethics-sourced
  ready_brush: 'Förbered att applicera penseln. Tryck på {controls[proceed]} när du är redo.'
