# Session timeline. SPEC.md 7.
#
# Generated from `generate:` into an evenly spaced grid, then any individual block replaced
# by an entry in `overrides:`. The grid is NOT SETTLED and will change during piloting
# (SPEC.md 20 item 4) -- which is exactly why it is data rather than code.
#
# Session t=0 is the start of heat sensitisation (SPEC.md 7.4).

generate:
  n_pinprick_blocks: 6               # SPEC.md 2: 6 pinprick and 6 touch-rating blocks,
  n_touch_blocks: 6                  # alternating, evenly spaced, never back-to-back
  intervention_duration_min: 120.0
  intervention_start_offset_min: 45.0   # after sensitisation, capsaicin and post-S measures
  rekindle_offset_min: 105.0         # t+60 into the intervention (SPEC.md 2)
  rekindle_duration_min: 5.0
  capsaicin_start_offset_min: 2.0    # immediately after the 2 min sensitisation
  capsaicin_duration_min: 30.0
  sensitisation_duration_min: 2.0    # thermode 50 C, timed and prompted only (SPEC.md 1.2)
  first_block_type: pinprick

  block_spacing_min: 8.0             # Minutes between consecutive blocks. Its own parameter and
                                     # not intervention_duration / n_blocks -- that derived
                                     # value was exactly 10 min, which is 12 blocks filling all
                                     # 120 minutes and leaving nothing for the rekindle, so the
                                     # grid had only 1 min of margin ahead of it. 8 min frees
                                     # 24 min of slack, shared at both ends of each half.

  expected_duration_min:
    # How long a block is expected to take. `make preview` shows it (SPEC.md 7.2) and the
    # overlap check needs it (7.3). These are ESTIMATES, not measurements: a pinprick block is
    # 5 trials at 13-17 s ISI plus a 9 s rating delay plus the participant's time on the VAS,
    # which is the part nobody has timed. 4 min for both, S 23 Aug 2026. Replace with measured
    # values after piloting (open item 4); the two may well differ, since a touch-rating block
    # has no ISI train. Nothing derived from these enters analysis -- they drive the preview
    # and the clash warning, and the session records what a block ACTUALLY took either way.
    pinprick: 4.0
    touch: 4.0

overrides: []
  # Each entry replaces one generated block. Example, commented out because an unused
  # override is a config option nothing reads:
  # - index: 3
  #   offset_min: 72.0
  #   type: touch

validation:
  # These WARN and never block: piloting will legitimately want irregular schedules. This is
  # the one deliberate exception to fail-fast, and it is a scheduling decision rather than
  # error handling (SPEC.md 7.3).
  max_session_duration_min: 210.0
  overdue_alert_margin_s: 60.0       # audible alert when a block is overdue by this much
  due_alert_lead_s: 30.0             # audible alert when a block becomes due
  equal_spacing_tolerance_s: 30.0