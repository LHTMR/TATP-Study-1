# Ports, pressure limits, screens, audio and adjustment rates. SPEC.md 4, 10.3, 13, 14.1.

# The screens, sound devices, port and remote below are the lab's: the Windows lab laptop. They
# are the defaults of the hardware page that opens before the launcher (tatp/hardware_check.py,
# docs/LOG.md N7.F12e1), where each can be changed for what is connected, and a session records
# what it ran with. On another platform the lab's sound devices cannot exist, so the page takes
# the system's default output in their place (tatp/devices.py).
lab_platform: win32

# The hardware page's live detection (docs/LOG.md N7.F12e2). Display rates, not study timings.
devices:
  poll_interval_s: 2.0               # screens, serial ports and the remote, read again
  audio_poll_interval_s: 6.0         # sound devices, listed again in a child process
  # A child process that has not listed them by then failed. The preflight waits for it on the
  # GUI thread, so this is also the longest Check can freeze the launcher.
  probe_timeout_s: 8.0
  child_stop_timeout_s: 1.0          # the test-sound child given this long to end, then killed

garment:
  driver: mock                       # mock | arduino_mosfet | arduino_valves
  port: null                         # serial port; unused by mock
  baud: null                         # SPEC.md 20 item 14: the valve controller's protocol
  connect_timeout_s: 5.0
  pressure_max_kpa: 250.0            # the hardware maximum (SPEC.md 3)
  pressure_ceiling_kpa: 250.0        # SOFTWARE ceiling, enforced independently of the
                                     # participant's adjustment (SPEC.md 13). Set to the
                                     # hardware maximum by S on 23 Aug 2026, so it holds no
                                     # margin below it: what it guarantees is that the
                                     # software never commands past what the hardware is
                                     # rated for. The margin is the hardware emergency stop
                                     # and the rapid depressurisation mechanism, which is
                                     # SPEC.md 13's real safety path in any case.
  pressure_ceiling_kpa_confirmed: true   # closes local item L1
  pressure_rate_max_kpa_s: 60.0      # independent rate limit (SPEC.md 13). Local item L2.
  pressure_resolution_kpa: null      # SPEC.md 20 item 2
  inflation_rate_kpa_s: null         # per channel, from bring-up. SPEC.md 20 item 3
  # The current prototype, driver `arduino_mosfet` (SPEC.md 12.4): on/off per channel over the
  # MOSFET array, pressure set by hand at the regulator. Its protocol is the prototype
  # sketch's: newline-terminated `setstate:0x<mask>`, lower-case hex, and `hello` answered by
  # `hello`, which the flashed firmware does though the sketches in its repository do not.
  prototype:
    port: COM3                       # the lab laptop, 25 Sep 2026 (USB VID 2341, Arduino)
    baud: 115200                     # the sketch's Serial.begin
    boot_s: 2.5                      # opening the port resets the Arduino; wait for it to boot
    # The shift-register bit driving each channel, for channels 1-5 in order from distal (1) to
    # proximal (5). Found on 25 Sep 2026 with S watching the sleeve: tools/garment_bits.py
    # pulsed every bit, which fired the channels in the order 1, 2, 5, 4, 3. The bits are those
    # of the prototype's own motion_stim_vertical.csv (31, 27, 14, 7, 3), and a second run of 3,
    # 7, 31, 27, 14 swept distal to proximal as expected.
    channel_bits: [3, 7, 31, 27, 14]
  pattern_tick_interval_s: 0.005     # how often pattern events are delivered (SPEC.md 12.2).
                                     # Onset jitter is up to one tick, so this sits well under
                                     # the fastest pattern's 75 ms row interval.

prototype_command_file:
  # What the current prototype's Arduino sketch accepts (SPEC.md 12.4), read from
  # ttpa_touch_the_pain_away/Arduino/4_mosfet_array_controller*.ino. The pattern designer's
  # export refuses a pattern that would exceed either, because the sketch does not refuse it:
  # a step past the store is dropped with a serial message, and a longer delay wraps.
  max_steps: 199                     # `6 * (len_code + 1) < 6 * seq_size`, seq_size 200
  max_step_ms: 65535                 # each step's delay is stored as a uint16_t
  mask_bits: 32                      # `write32bits`: four shift-register bytes, so channel
                                     # ids 0-31

adjustment:
  # Accelerating two-button control (SPEC.md 10.3, comparison doc 7.5). All pilot-tunable.
  # Every press moves at least one step, which gives fine positioning; a hold traverses the full
  # range in about 6 s (tatp/touchcal.py, AdjustmentState).
  tap_step_kpa: 1.0
  hold_delay_s: 0.30
  hold_rate_initial_kpa_s: 5.0
  hold_rate_final_kpa_s: 50.0
  hold_ramp_duration_s: 1.5
  tick_interval_s: 0.05

responder:
  # Logitech R400. It emits only these keys (SPEC.md 3, 10.1). Measured on the lab's unit with
  # a key probe, 30 Sep 2026 (docs/LOG.md N7.F1): the play button alternates f5 and escape on
  # successive presses and does not auto-repeat; the other three auto-repeat when held.
  device: logitech_r400
  keys:
    decrease: [pageup]               # left large button
    increase: [pagedown]             # right large button
    confirm: [f5, escape]            # play button: both, or every other press would be lost
    emergency_stop: [period]         # blank-screen button
  # A play-button press this soon after the last one the software accepted is taken to be
  # carried over -- a double tap, or the button bouncing -- and ignored, so it cannot dismiss
  # the screen that has just come up unread (docs/LOG.md N7.U15). Well under the time anyone
  # takes to read a screen, and above a double tap's gap. Session time, which is real time in
  # a session; an accelerated test run shortens it with everything else. Pilot-tunable.
  repeat_confirm_lockout_s: 0.5
  ignore_keys: []                    # Keys the device emits that must do nothing. None: every
                                     # key the R400 sends is bound (SPEC.md 10.1).
  # Which keyboard counts as the remote (tatp/remote_keys.py, docs/LOG.md N7.D22).
  # raw_input: only the device device_match names, told apart from the experimenter's keyboard
  # by Windows' Raw Input, so the experimenter can type a full stop and the participant's stop
  # still works from any window (open item L15). any_keyboard: every keyboard is the remote --
  # development, the headless tests and the validator, which have neither the remote nor Windows.
  key_source: raw_input
  # A substring of the remote's device path, matched ignoring case. The R400's receiver on the
  # lab laptop, read with Raw Input on 14 Oct 2026: Logitech's vendor ID and its USB receiver.
  # The laptop's own keyboard is an ACPI device (HPQ8002). A second Logitech receiver plugged in
  # would match too.
  device_match: VID_046D&PID_C538
  # What the participant responds with (docs/LOG.md N7.F12e4): `remote`, the R400 above, or,
  # when it is missing, `keyboard` (the keys below) or `on_screen` (buttons on the participant
  # window, for a mouse or trackpad). Chosen on the hardware page. The two alternatives are for a
  # pilot code or a demonstration only: preflight refuses them for a study participant, whose
  # responses must come from the device the study describes (tatp/preflight.py).
  participant_input: remote
  # `keyboard`: keys on every keyboard, a MacBook's included. The arrows are the large buttons,
  # left and right where they sit; Return is ▶. The emergency stop is the full stop, the key
  # the remote's own stop button sends, so the mapping mirrors the remote. Not Esc, which
  # dismisses every dialog and would have made closing one an emergency stop (code review,
  # docs/LOG.md N7.F12e4). Every keyboard counts (any_keyboard), except in a text field, a
  # dialog, a list or a combo box, which use these keys themselves (tatp/ui/participant.py).
  alternative_keys:
    decrease: [left]
    increase: [right]
    confirm: [return, enter]
    emergency_stop: [period]
  # WHAT IS PHYSICALLY PRINTED ON EACH BUTTON. A screen that draws a control draws the symbol
  # the participant's thumb is resting on, at its physical arrangement (UI_PRINCIPLES.md 5.9),
  # so relabelling the remote is a change here and nowhere else. This lives in hardware.yaml
  # rather than in the text files because it describes the device, not the language -- the two
  # participants' screens show the same glyph whichever language they read.
  #
  # NOT propagated into the approved wording: `screens.welcome`, `screens.self_start` and
  # others spell "▶" inside their sentences, and those are S's strings to change. If the play
  # button is relabelled, those need editing by hand (docs/LOG.md N5.11).
  button_symbols:
    decrease: "‹"
    increase: "›"
    confirm: "▶"
    # Drawn on ONE screen only, `screens.stop_rehearsal`, whose purpose is pointing at it
    # (SPEC.md 10.9). Never drawn as an option on a response screen. The lab's R400 carries a
    # sticker on its blank-screen button: a black "!" on a yellow disc (S's photo, 25 Sep
    # 2026), which closes local item L12. The play button's sticker is a blue disc with an
    # outline triangle, which the wording's "▶" approximates (docs/LOG.md N5.11).
    emergency_stop: "!"
  # For a button whose printed symbol is coloured: the symbol's colour, and the filled disc it
  # sits on. Only the stop is drawn with a disc. The yellow is matched by eye to the photo.
  button_symbol_colours:
    emergency_stop: "#141414"
    # The play button's "▶" wherever participant text names it, in the blue of its sticker's
    # disc (S, lab run 5 Oct 2026), the same blue as the experimenter screen's TARGET_COLOUR.
    # The participant's text only; the experimenter's buttons stay plain.
    confirm: "#4fa3e0"
  button_symbol_discs:
    emergency_stop: "#f2b21b"
  emergency_stop_symbol_confirmed: 2026-09-25   # closes local item L12

screens:
  # SPEC.md 20 item 9. Null means "primary screen, windowed", which is right for a
  # development machine and wrong for the lab PC, so startup warns while they are null.
  # Set 25 Sep 2026 on the lab laptop, with S: screen 0 is the laptop's own display (1280x800
  # at 150 %), screen 1 the HP Z24i (1920x1200) behind the curtain. `scale_factors` below makes
  # the HP draw at the approved screenshots' 1280x800 (docs/LOG.md N5.19, N7.U10).
  participant_screen_index: 1
  experimenter_screen_index: 0
  participant_fullscreen: true
  # The participant window when it shares the experimenter's screen (a null index, chosen on
  # the hardware page when there is one display: a MacBook, docs/LOG.md N7.F12e5). A window of
  # this size, kept above the experimenter's and movable, so both can be seen and used at once.
  # Three quarters of the 1280x800 every screen is laid out at. A display size, not a timing.
  shared_participant_window_px: [960, 600]
  # How much larger each screen draws, by screen index, in place of the Windows setting
  # (docs/LOG.md N7.U10). 1920x1200 at 1.5 is 1280x800, the size every screen is laid out and
  # approved at, so the participant sees the approved screenshots enlarged. The laptop is 1.5
  # in Windows already. Null leaves each screen as the platform sets it.
  scale_factors: [1.5, 1.5]
  # How often the experimenter screen redraws its clock, countdown and hardware panel
  # (SPEC.md 7.4, 11; docs/LOG.md N6.20). A display rate, not a study timing: the countdown
  # reads the session clock, so a slower tick shows the same times less often, never wrong ones.
  experimenter_refresh_interval_s: 0.5
  # The experimenter screen's channel display (tatp/ui/garment_display.py): a channel that
  # changes is lit up and fades back over this long, so the eye is drawn to it from across the
  # room. Moved here from study1.yaml's demo block when sessions got the display too (LOG
  # N7.F16i). A display time, not a study timing.
  garment_highlight_s: 1.0
  # The fonts every screen draws in, committed under fonts/ and installed at startup (S, 23 Sep
  # 2026). Left to the platform, the Mac drew its system font and the lab PC Segoe UI, and
  # headless Windows drew empty boxes -- so the approved screenshots described a screen the lab
  # PC never showed. The first family is the study font, the closest of the candidates to the
  # approved Mac renders. Later ones supply only characters it lacks -- DejaVu Sans is there
  # for the confirm symbol, which Roboto does not have. Licences in fonts/README.md.
  font_families:
    - Roboto
    - DejaVu Sans
  font_files:
    - fonts/Roboto/static/Roboto-Regular.ttf
    - fonts/Roboto/static/Roboto-Bold.ttf
    - fonts/DejaVu_Sans/DejaVuSans.ttf

audio:
  # Continuous white noise with an alert tone mixed over it as the cue (SPEC.md 10.5).
  # The white noise is generated, not a file (SPEC.md 3).
  backend: sounddevice               # sounddevice | recording. `recording` is the test double:
                                     # it plays nothing and records what it was asked to play,
                                     # as MockGarment does. Never a silent fallback -- a real
                                     # session whose device fails raises (tatp/audio.py).
  # Devices are named by words that must ALL appear in "<device name>, <host API>" (sounddevice's
  # matching), so each resolves to exactly one output. Set 25 Sep 2026 on the lab laptop, with
  # S present. WASAPI, not MME or DirectSound, which add 90-120 ms of latency. Bluetooth adds
  # its own delay on top, unreported. And never the headset's "Hands-Free" output, which is mono
  # 16 kHz and which Windows switches to if anything opens the headset microphone.
  participant_device: Bose QC Headphones WASAPI   # the participant's headphones
  experimenter_device: Speakers Realtek WASAPI    # lab-side alerts: the laptop's own speakers.
                                     # Local item L10 -- whether they are inaudible to the
                                     # participant over the noise is still to meter (L3).
  output_channels: 2                 # the same noise to both ears
  sample_rate_hz: 48000              # WASAPI shared mode refuses anything but the device's own
                                     # rate, which is 48 kHz for both devices on the lab laptop
  tone_ramp_s: 0.01                  # raised-cosine onset/offset on every tone, so a cue does
                                     # not start with a click -- a second, louder cue
  # The two-button control of SPEC.md 10.3, applied to the noise level. The hold timings are
  # adjustment.* -- they describe the participant's hand, not the quantity. These
  # two rates put the full start-to-ceiling range at about 6 s of continuous holding, matching
  # the pressure control. Pilot-tunable; not a sound-level limit (white_noise_max_dbfs is).
  noise_hold_rate_initial_db_s: 1.0
  noise_hold_rate_final_db_s: 10.0
  # The participant sets their own noise level in the masking check (SPEC.md 10.7). These three
  # bound that adjustment; the level itself is not configured, it is measured per session.
  white_noise_start_dbfs: -60.0      # deliberately below audibility: the check starts quiet
  white_noise_max_dbfs: -12.0        # HARD CEILING, the audio equivalent of the pressure
                                     # ceiling of SPEC.md 13. "Stop before it is uncomfortable"
                                     # is the participant's limit and should always bite first;
                                     # this is what stops a held button regardless. NOT a
                                     # measured safe level -- dBFS says nothing about sound
                                     # pressure until the system volume is fixed, which is
                                     # local item L3 and a bring-up step.
  white_noise_step_db: 1.0           # one tap of the two-button control
  masking_check_pressure_kpa: 40.0   # low, and MOVING -- the valve switching is the sound
                                     # being masked (SPEC.md 10.7). Confirm at bring-up.
  earplugs_proceed_lockout_s: 2.0    # after the experimenter reports the garment still audible,
                                     # Next step does nothing for this long, so the second click
                                     # of a double click is not taken as "the earplugs are in".
                                     # Well above a double click's gap, well below the time it
                                     # takes to fit earplugs. Session time. Pilot-tunable.
  participant_cue_hz: 1000.0
  participant_cue_duration_s: 0.20
  participant_cue_over_noise_db: 12.0  # the cue is set this far above whatever noise level the
                                     # participant settled on, so it stays audible for everyone
                                     # rather than at one absolute level that suits nobody
  experimenter_alert_hz: 660.0       # lab-side; must NOT be audible to the participant
  experimenter_alert_duration_s: 0.50
  experimenter_alert_level_dbfs: -12.0
  # The 1 Hz mapping pacing cue made audible (SPEC.md 8.4), on the experimenter's device at the
  # experimenter alert's level, so it adds no new sound level. Short and higher than the alert,
  # so a tick is not mistaken for "block due". Presentation choices, pilot-tunable (LOG N7.D6).
  pacing_tick_hz: 1000.0
  pacing_tick_duration_s: 0.05

data:
  folder: data                       # relative to the repository root; gitignored (SPEC.md 14.1)
  # Where the experimenter uploads each session's files (SOP.md 14.2), a LiU samarbetsmapp.
  # The software never writes there; only tools/check_upload.py reads it.
  upload_folder: '\\fillager.liu.se\coop\t\tatp\01_raw'
  # Warn and record, never refuse, if the folder resolves inside a cloud-synced tree.
  cloud_sync_markers:
    - OneDrive
    - Dropbox
    - Library/CloudStorage
    - iCloud Drive