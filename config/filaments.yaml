# Aesthesio (DanMic) Precision Tactile Sensory Evaluator set -- the set used in Ng et al. (2024).
# SPEC.md 8.1, calibration_methods_comparison.md 2 and 8.
#
# EVERY VALUE BELOW IS TRANSCRIBED FROM THE "Aesthesio Precision Tactile Sensory Evaluator Data
# Chart", supplied 23 August 2026. Nothing here is derived, rounded or inferred by me.
#
# `label_g`           THE IDENTIFIER. The gram label printed on the filament, which is what an
#                     experimenter reads off the kit under time pressure. Everything else here
#                     is a companion value looked up from it, and the data files name filaments
#                     by this label. Settled 23 Aug 2026.
#                     Written exactly as the chart prints it, decimals included -- `2.0`, not
#                     `2`. It is a label, hence a string: the experimenter matches it against
#                     the filament by eye, and `2` and `2.0` would not match.
# `size`              Evaluator size, the Semmes-Weinstein number. The analysis literature
#                     indexes filaments this way.
# `force_nominal_mn`  The chart's Target Force in milliNewtons -- the manufacturer's stated
#                     force, which the chart itself marks as calculated and rounded at a
#                     conversion factor of 9.80665 mN/g. Display, and the fallback the estimator
#                     fits until the set is weighed (SPEC.md 8.1).
# `force_measured_mn` What the code uses where it exists. Filled in by the instruments module
#                     (launcher entry 2) from a precision balance.
#
# There is deliberately no third force column. An earlier version of this file carried a
# `force_manual_mn` and a separately-rounded `force_nominal_mn`; the chart has one manufacturer
# force, so the second was a rounding with no source and is gone.
#
# tests/test_config_files.py asserts `label_g` x 9.80665 reproduces `force_nominal_mn` on every
# row, so a mistyped label fails the suite rather than naming the wrong filament in a session.
#
# CONFIRMED AGAINST THE PHYSICAL KIT, 23 August 2026: the chart is the manual for the exact set
# held, all twenty filaments are present, and the printed labels match.
#
# Manufacturer forces deviate from measured by -19.75% to +17.61%, non-systematically
# (Berquin et al. 2010), so an unweighed set is a WARNED FALLBACK and never a silent
# substitution -- SPEC.md 20 item 1. Until every `force_measured_mn` below is filled in, startup
# warns, `filaments_measured` is written false into the session file, and every pinprick row
# carries an empty `force_measured_mn` to mark that it was fitted on label values.
#
# LIST WHATEVER IS ACTUALLY HELD. All twenty are listed because all twenty are held. Delete the
# row for any that is later lost or damaged -- nothing downstream assumes a particular ladder.

weighing_date: null   # ISO date, written by the instruments module
weighing_balance: null   # free text: which balance, so the measurement is traceable

filaments:
  - {label_g: "0.008", size: "1.65", force_nominal_mn:    0.08, force_measured_mn: null}
